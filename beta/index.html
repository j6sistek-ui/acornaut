  // 'ACORNAUT' drawn as a geometric vector wordmark — a space-style
  // letterform that needs no font file, so it renders identically on every
  // platform (system fonts can't be trusted for a logo).
  const WORDMARK = {
    A: [[[0, 10], [2.1, 0], [3.9, 0], [6, 10]], [[1.15, 6.5], [4.85, 6.5]]],
    C: [[[6, 1.6], [4.4, 0], [1.6, 0], [0, 1.6], [0, 8.4], [1.6, 10], [4.4, 10], [6, 8.4]]],
    O: [[[1.6, 0], [4.4, 0], [6, 1.6], [6, 8.4], [4.4, 10], [1.6, 10], [0, 8.4], [0, 1.6], [1.6, 0]]],
    R: [[[0, 10], [0, 0], [4.6, 0], [6, 1.4], [6, 4.2], [4.6, 5.6], [0, 5.6]], [[3.2, 5.6], [6, 10]]],
    N: [[[0, 10], [0, 0], [6, 10], [6, 0]]],
    U: [[[0, 0], [0, 8.4], [1.6, 10], [4.4, 10], [6, 8.4], [6, 0]]],
    T: [[[0, 0], [6, 0]], [[3, 0], [3, 10]]],
  };

  function drawWordmark(cx, top, h) {
    const word = 'ACORNAUT';
    const u = h / 10;
    const lw = 6 * u;
    const gapW = 3.2 * u;
    const total = word.length * lw + (word.length - 1) * gapW;
    let x = cx - total / 2;

    const g = ctx.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, '#bfe6ff');
    g.addColorStop(1, '#4ab8ff');

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(80,180,255,0.28)' : g;
      ctx.lineWidth = pass === 0 ? 0.62 * h * 0.28 : 0.36 * h * 0.28;
      let lx = x;
      for (const ch of word) {
        for (const stroke of WORDMARK[ch]) {
          ctx.beginPath();
          for (let i = 0; i < stroke.length; i++) {
            const px = lx + stroke[i][0] * u;
            const py = top + stroke[i][1] * u;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
        lx += lw + gapW;
      }
    }
    // a small star dotting the wordmark
    ctx.fillStyle = '#ffe27a';
    const sx = cx + total / 2 + 8;
    const sy = top - 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 4);
    ctx.lineTo(sx + 1.2, sy - 1.2);
    ctx.lineTo(sx + 4, sy);
    ctx.lineTo(sx + 1.2, sy + 1.2);
    ctx.lineTo(sx, sy + 4);
    ctx.lineTo(sx - 1.2, sy + 1.2);
    ctx.lineTo(sx - 4, sy);
    ctx.lineTo(sx - 1.2, sy - 1.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function iconVortex(cx, cy, a) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#e2ccff';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      for (let i = 0; i < 14; i++) {
        const th = i * 0.42 + k * Math.PI;
        const rr = 1.5 + i * 0.62;
        const px = Math.cos(th) * rr;
        const py = Math.sin(th) * rr * 0.8;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.fillStyle = '#0a0512';
    ctx.beginPath();
    ctx.arc(0, 0, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

      ctx.strokeStyle = 'rgba(160,190,230,0.22)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = 'bold 10.5px system-ui';
      ctx.fillText(name, sx + swid / 2, 244);
      ctx.fillStyle = 'rgba(255,208,128,0.6)';
      ctx.font = '600 8.5px system-ui';
      ctx.fillText('COMING SOON', sx + swid / 2, 260);
      ctx.textAlign = 'left';
    });

    // leaderboards
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 12px system-ui';
    ctx.fillText('LEADERBOARDS', 20, 306);
    ctx.fillStyle = 'rgba(140,170,220,0.1)';
    roundRect(16, 318, W - 32, 72, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(160,190,230,0.22)';
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '600 12.5px system-ui';
    ctx.fillText('Global leaderboards are coming soon.', W / 2, 348);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '600 11px system-ui';
    ctx.fillText('Your records are safe on this device until then.', W / 2, 368);
    ctx.textAlign = 'left';

    // news & updates
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 12px system-ui';
    ctx.fillText('NEWS & UPDATES', 20, 422);
    ctx.fillStyle = 'rgba(140,170,220,0.1)';
    roundRect(16, 434, W - 32, 36 + NEWS.length * 18, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(160,190,230,0.22)';
    ctx.stroke();
    ctx.fillStyle = '#ffb040';
    ctx.font = 'bold 11px system-ui';
    ctx.fillText('BETA · ' + BETA_BUILD, 30, 456);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '600 11px system-ui';
    NEWS.forEach((line, i) => {
      ctx.fillText(line, 30, 476 + i * 18);
    });
  }

  // ——— FLIGHT LOG: the reward road ———
  // A climbing track, not a table: a glowing spine runs up the screen,
  // one node per level, and every reward rides its node as a card — art,
  // a kicker, and one line that sells what it does. Earned rewards carry
  // a check; the next node glows; the future sits in full colour behind
  // a small lock, so the road itself advertises what's coming.
  function trackItemsFor(lvl) {
    const out = [];
    for (const u of TRACK) if (u.lvl === lvl) out.push(u);
    return out;
  }
  function flightRowH(lvl) {
    const n = trackItemsFor(lvl).length;
    return n === 0 ? 46 : n * 96 + 18;
  }
  function flightContentH() {
    let h = 30;
    for (let l = 2; l <= MAX_LEVEL; l++) h += flightRowH(l);
    return h + 60;
  }
  function openFlightLog() {
    mode = 'flightlog';
    // land the view just below the pilot's current position on the road
    const lvl = pilotLevel();
    let y = 30;
    for (let l = 2; l <= Math.min(lvl, MAX_LEVEL); l++) y += flightRowH(l);
    flightScroll = Math.max(0, Math.min(
      Math.max(0, flightContentH() - (H - 150)), y - H * 0.25));
  }

  function drawTrackArt(u, cx, cy, t) {
    if (u.kind === 'pal') {
      drawPalPreview(u.id, cx, cy - 4, t);
    } else if (u.kind === 'mode') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1.5, 1.5);
      if (u.id === 'deep') iconVortex(0, 0, 1);
      else iconWormhole(0, 0, 1);
      ctx.restore();
    } else if (u.kind === 'suit') {
      const s = SUITS.find(q => q.id === u.id);
      if (s) drawAstronaut(cx + 2, cy + 6, 0, 0.62, equippedHelmet(), s, { seed: 6 });
    } else if (u.kind === 'mod') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1.1, 1.1);
      drawAcorn(0, 0, 'shield');
      ctx.restore();
    } else {
      // title laurel star
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 === 0 ? 14 : 6.5;
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7a5a00';
      ctx.font = 'bold 9px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('T', cx, cy + 3);
    }
  }

  function drawFlightLog() {
    const t = performance.now() / 1000;
    const myLvl = pilotLevel();

    // scrollable road
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 138, W, H - 138);
    ctx.clip();
    ctx.translate(0, 150 - flightScroll);

    const spineX = 44;
    const totalH = flightContentH();
    const spine = ctx.createLinearGradient(0, 0, 0, totalH);
    spine.addColorStop(0, 'rgba(160,107,255,0.8)');
    spine.addColorStop(1, 'rgba(58,140,255,0.25)');
    ctx.strokeStyle = spine;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(spineX, 6);
    ctx.lineTo(spineX, totalH - 30);
    ctx.stroke();

    let y = 30;
    for (let lvl = 2; lvl <= MAX_LEVEL; lvl++) {
      const items = trackItemsFor(lvl);
      const rowH = flightRowH(lvl);
      // skip rows that are far off screen
      if (y + rowH - flightScroll > -160 && y - flightScroll < H) {
        const earned = myLvl >= lvl;
        const isNext = lvl === myLvl + 1;
        // node
        ctx.save();
        ctx.translate(spineX, y + 14);
        ctx.rotate(Math.PI / 4);
        const ns = isNext ? 15 : 12;
        ctx.fillStyle = earned ? '#ffb84d' : isNext ? '#a06bff' : 'rgba(90,100,140,0.75)';
        roundRect(-ns, -ns, ns * 2, ns * 2, 5);
        ctx.fill();
        if (isNext) {
          ctx.strokeStyle = 'rgba(201,178,255,' + (0.5 + 0.4 * Math.sin(t * 3)).toFixed(2) + ')';
          ctx.lineWidth = 2.5;
          roundRect(-ns - 4, -ns - 4, ns * 2 + 8, ns * 2 + 8, 7);
          ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = earned ? '#3a2402' : '#fff';
        ctx.font = 'bold ' + (lvl >= 10 ? 12 : 14) + 'px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(String(lvl), spineX, y + 19);
        if (earned && items.length) {
          ctx.fillStyle = '#5dff9e';
          ctx.font = 'bold 12px system-ui';
          ctx.fillText('\u2713', spineX + 20, y + 2);
        }

        // reward cards
        items.forEach((u, k) => {
          const cy = y + k * 96;
          const cardX = 76, cardW = W - cardX - 14;
          ctx.fillStyle = earned ? 'rgba(93,255,158,0.07)'
                        : isNext ? 'rgba(160,107,255,0.14)'
                        : 'rgba(140,170,220,0.08)';
          roundRect(cardX, cy - 12, cardW, 84, 13);
          ctx.fill();
          ctx.strokeStyle = earned ? 'rgba(93,255,158,0.3)'
                          : isNext ? 'rgba(201,178,255,0.6)'
                          : 'rgba(160,190,230,0.18)';
          ctx.lineWidth = 1.3;
          ctx.stroke();

          drawTrackArt(u, cardX + 33, cy + 30, t);

          const kickC = u.kind === 'mode' ? '#c084fc' : u.kind === 'pal' ? '#ffd080'
                      : u.kind === 'suit' ? '#6ef0ff' : u.kind === 'title' ? '#ffd23f' : '#5dff9e';
          const kick = u.kind === 'mode' ? 'NEW MODE' : u.kind === 'pal' ? 'NEW COMPANION'
                     : u.kind === 'suit' ? 'PREMIUM SUIT \u00b7 SHOP' : u.kind === 'title' ? 'NEW TITLE'
                     : 'HANGAR MOD';
          ctx.textAlign = 'left';
          ctx.fillStyle = kickC;
          ctx.font = 'bold 9px system-ui';
          ctx.fillText(kick, cardX + 64, cy + 8);
          ctx.fillStyle = earned ? 'rgba(255,255,255,0.75)' : '#fff';
          ctx.font = 'bold 14px system-ui';
          ctx.fillText((trackName(u) || '').toUpperCase(), cardX + 64, cy + 26);
          const d = trackDesc(u);
          if (d) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '600 10.5px system-ui';
            ctx.fillText(d, cardX + 64, cy + 44);
          } else if (u.kind === 'title') {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '600 10.5px system-ui';
            ctx.fillText('Worn on your pilot card with pride.', cardX + 64, cy + 44);
          }
          if (earned) {
            ctx.fillStyle = '#5dff9e';
            ctx.font = 'bold 11px system-ui';
            ctx.fillText('\u2713 EARNED', cardX + 64, cy + 62);
          } else if (isNext) {
            ctx.fillStyle = '#c9b2ff';
            ctx.font = 'bold 11px system-ui';
            const needN = xpCumulative(lvl) - (save.xp || 0);
            ctx.fillText(needN + ' XP TO GO', cardX + 64, cy + 62);
          } else {
            // small lock badge
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 1.6;
            const lx = cardX + cardW - 20, ly = cy - 1;
            ctx.beginPath();
            ctx.arc(lx, ly, 4, Math.PI, 0);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            roundRect(lx - 5.5, ly, 11, 8.5, 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = 'bold 10.5px system-ui';
            ctx.fillText('LV ' + lvl, cardX + 64, cy + 62);
          }
        });
      }
      y += rowH;
    }
    // road's end
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '600 11px system-ui';
    ctx.fillText('\u2026the road grows with every update', W / 2, totalH - 4);
    ctx.restore();

    // header ON TOP of the scroll area
    ctx.fillStyle = 'rgba(5,7,15,0.92)';
    ctx.fillRect(0, 0, W, 138);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(16, 26, 80, 36, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '600 13px system-ui';
    ctx.fillText('\u2190 BACK', 28, 49);
    ctx.font = 'bold 22px system-ui';
    ctx.fillText('FLIGHT LOG', 110, 50);

    const lv = pilotLevel();
    const into = (save.xp || 0) - xpCumulative(lv);
    const need = lv >= MAX_LEVEL ? 1 : XP_STEPS[lv - 1];
    ctx.fillStyle = '#c9b2ff';
    ctx.font = 'bold 13px system-ui';
    ctx.fillText('LV ' + lv + ' \u00b7 ' + pilotTitle(), 20, 92);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '600 11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(lv >= MAX_LEVEL ? 'MAX LEVEL' : into + ' / ' + need + ' XP', W - 20, 92);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(160,120,255,0.2)';
    roundRect(20, 102, W - 40, 10, 5);
    ctx.fill();
    ctx.fillStyle = '#a06bff';
    roundRect(20, 102, Math.max(4, (W - 40) * Math.min(1, into / need)), 10, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '600 10.5px system-ui';
    ctx.fillText('Every run earns XP \u2014 score + acorns, boosted in the harder skies.', 20, 128);
  }

  // ——— tabbed shop ————————————————————————————————————————————
  const SHOP_TABS = [
    { id: 'helmets', label: 'HELMETS' },
    { id: 'suits',   label: 'SUITS' },
    { id: 'mods',    label: 'MODS' },
    { id: 'trails',  label: 'TRAILS' },
    { id: 'pals',    label: 'PALS' },
  ];
  const SHOP_GRID_Y = 140;

  // Geometry shared by drawing and tap handling, same pattern as the title
  // menu — the tabs and their touch targets cannot drift apart.
  function shopTabRects() {
    const tw = (W - 32) / SHOP_TABS.length;
    return SHOP_TABS.map((t, i) => ({
      id: t.id, label: t.label,
      x: 16 + i * tw + tw / 2, y: 100, w: tw - 5, h: 34,
    }));
  }

  function shopCellRect(i) {
    const cols = 3;
    const cellW = (W - 48) / cols;
    return {
      x: 24 + (i % cols) * cellW + cellW / 2,
      y: SHOP_GRID_Y + Math.floor(i / cols) * 118 + 44,
    };
  }

  function drawShop() {
    drawShopHeader('HANGAR');

    for (const t of shopTabRects()) {
      const active = shopTab === t.id;
      ctx.fillStyle = active ? 'rgba(58,156,255,0.3)' : 'rgba(255,255,255,0.07)';
      roundRect(t.x - t.w / 2, t.y - t.h / 2, t.w, t.h, 9);
      ctx.fill();
      if (active) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.fillStyle = active ? '#fff' : 'rgba(255,255,255,0.6)';
      ctx.font = 'bold 10.5px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(t.label, t.x, t.y + 4);
    }

    if (shopTab === 'mods') drawModsTab();
    else drawRoster(shopRoster());
  }

  // Which purchasable roster the current tab shows, and which save fields
  // hold its ownership + equipped state. Used by drawing AND tap handling.
  function shopRoster() {
    if (shopTab === 'helmets') return { list: HELMETS, own: 'unlocked', eq: 'equipped', kind: 'helmet' };
    if (shopTab === 'suits') return { list: SUITS, own: 'unlockedSuits', eq: 'equippedSuit', kind: 'suit' };
    if (shopTab === 'trails') return { list: TRAILS, own: 'unlockedTrails', eq: 'equippedTrail', kind: 'trail' };
    if (shopTab === 'pals') return { list: PALS, own: 'unlockedPals', eq: 'equippedPal', kind: 'pal' };
    return null;
  }

  function drawRoster(roster) {
    const helm = equippedHelmet();
    const suit = equippedSuit();
    const t = performance.now() / 1000;
    roster.list.forEach((item, i) => {
      const c = shopCellRect(i);
      let unlocked = save[roster.own].includes(item.id);
      let lockLevel = 0;
      if (roster.kind === 'pal') {
        unlocked = palUnlocked(item.id);
        if (!unlocked) lockLevel = PAL_LEVELS[item.id] || 1;
      } else if (roster.kind === 'suit' && !unlocked && !suitRevealed(item.id)) {
        lockLevel = SUIT_REVEAL[item.id];
      }
      const eq = save[roster.eq] === item.id;

      ctx.fillStyle = eq ? 'rgba(58,156,255,0.25)' : 'rgba(255,255,255,0.06)';
      roundRect(c.x - 50, c.y - 48, 100, 100, 14);
      ctx.fill();
      if (eq) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 2;
        roundRect(c.x - 50, c.y - 48, 100, 100, 14);
        ctx.stroke();
      }

      // Grid cells render from a cached sprite (12 live characters per frame
      // is too many gradients for low-end phones); the equipped one stays
      // live so its glow and ornaments keep animating.
      if (roster.kind === 'helmet' || roster.kind === 'suit') {
        if (eq) {
          if (roster.kind === 'helmet') drawAstronaut(c.x + 4.5, c.y - 4, 0, 0.82, item, suit, { seed: i * 1.7 });
          else drawAstronaut(c.x + 4.5, c.y - 4, 0, 0.82, helm, item, { seed: i * 2.3 });
        } else {
          ctx.drawImage(rosterSprite(roster.kind, item, i), c.x - 56, c.y - 60, 112, 112);
        }
      }
      else if (roster.kind === 'trail') drawTrailPreview(item.id, c.x, c.y - 8, t);
      else drawPalPreview(item.id, c.x, c.y - 14, t);

      ctx.textAlign = 'center';
      ctx.font = '600 11px system-ui';
      ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.45)';
      const nameY = roster.kind === 'pal' ? c.y + 24 : c.y + 36;
      ctx.fillText(item.name, c.x, nameY);
      if (roster.kind === 'pal' && item.tag) {
        ctx.font = 'bold 8.5px system-ui';
        ctx.fillStyle = eq ? '#8fd0ff' : 'rgba(255,208,128,0.85)';
        ctx.fillText(item.tag, c.x, c.y + 36);
        ctx.font = '600 11px system-ui';
      }
      const costY = roster.kind === 'pal' ? c.y + 48 : c.y + 50;
      if (!unlocked && lockLevel) {
        // level-gated: the FLIGHT LOG is the price tag
        ctx.fillStyle = '#c9b2ff';
        ctx.fillText('LV ' + lockLevel, c.x, costY);
      } else if (!unlocked) {
        ctx.fillStyle = '#ffd080';
        const ct = String(item.cost);
        const cw = ctx.measureText(ct).width;
        ctx.fillText(ct, c.x - 7, costY);
        drawAcornIcon(c.x - 7 + cw / 2 + 8, costY - 4, 0.8);
      } else if (eq) {
        ctx.fillStyle = '#3a9cff';
        ctx.fillText('EQUIPPED', c.x, costY);
      }
    });

    // one-line description under the pals grid
    if (roster.kind === 'pal') {
      const sel = PALS.find(p => p.id === save.equippedPal) || PALS[0];
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '600 12px system-ui';
      const rows = Math.ceil(roster.list.length / 3);
      ctx.fillText(sel.name.toUpperCase() + ' — ' + sel.desc,
                   W / 2, SHOP_GRID_Y + rows * 118 + 14);
    }
  }

  let spriteCache = {};
  function rosterSprite(kind, item, i) {
    const key = [kind, item.id, save.equipped, save.equippedSuit, dpr].join(':');
    let cv = spriteCache[key];
    if (!cv) {
      if (Object.keys(spriteCache).length > 80) spriteCache = {};
      cv = document.createElement('canvas');
      cv.width = cv.height = Math.ceil(112 * dpr);
      const main = ctx;
      ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 51.5 * dpr, 56 * dpr);
      if (kind === 'helmet') drawAstronaut(4.5, -4, 0, 0.82, item, equippedSuit(), { seed: i * 1.7 });
      else drawAstronaut(4.5, -4, 0, 0.82, equippedHelmet(), item, { seed: i * 2.3 });
      ctx = main;
      spriteCache[key] = cv;
    }
    return cv;
  }

  function drawTrailPreview(id, cx, cy, t) {
    // a stylised burst frozen mid-flap
    const ph = (t * 2) % 1;
    ctx.save();
    ctx.translate(cx + 16, cy);
    if (id === 'sparks') {
      const g = ctx.createLinearGradient(0, 0, -34, 0);
      g.addColorStop(0, 'rgba(255,224,128,0.95)');
      g.addColorStop(0.5, 'rgba(255,128,48,0.8)');
      g.addColorStop(1, 'rgba(255,64,32,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.quadraticCurveTo(-36, 0, 0, 6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffe080';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-8 - ((ph * 26 + i * 9) % 28), (i % 2 ? -1 : 1) * (4 - i), 2.2 - i * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (id === 'ion') {
      ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const off = (ph * 30 + i * 8) % 32;
        ctx.strokeStyle = i % 2 ? '#c8f4ff' : '#3ac0f0';
        ctx.lineWidth = 2 - i * 0.3;
        ctx.beginPath();
        ctx.moveTo(-2 - off, -4 + i * 2.6);
        ctx.lineTo(-12 - off, -4 + i * 2.6);
        ctx.stroke();
      }
    } else if (id === 'bubble') {
      ctx.strokeStyle = 'rgba(170,220,255,0.9)';
      for (let i = 0; i < 4; i++) {
        const off = (ph * 26 + i * 8) % 30;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(-4 - off, (i % 2 ? -1 : 1) * (5 - i), 2 + i, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (id === 'bloom') {
      for (let i = 0; i < 4; i++) {
        const off = (ph * 24 + i * 8) % 30;
        ctx.fillStyle = i % 2 ? '#f0b8ff' : '#a45cd8';
        ctx.beginPath();
        ctx.arc(-4 - off, (i % 2 ? -1 : 1) * (4 - i * 0.5), 2 + i * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (id === 'comet') {
      const g = ctx.createLinearGradient(4, 0, -44, 0);
      g.addColorStop(0, 'rgba(255,250,225,1)');
      g.addColorStop(0.35, 'rgba(255,190,50,0.85)');
      g.addColorStop(1, 'rgba(255,110,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(4, -6.5);
      ctx.quadraticCurveTo(-46, 0, 4, 6.5);
      ctx.closePath();
      ctx.fill();
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const off = (ph * 30 + i * 11) % 34;
        ctx.strokeStyle = i % 2 ? 'rgba(255,246,210,0.9)' : 'rgba(255,180,40,0.85)';
        ctx.lineWidth = 2.4 - i * 0.5;
        ctx.beginPath();
        ctx.moveTo(-2 - off, (i - 1) * 3.4);
        ctx.lineTo(-14 - off, (i - 1) * 3.4);
        ctx.stroke();
      }
      const core = ctx.createRadialGradient(3, 0, 1, 3, 0, 7);
      core.addColorStop(0, '#ffffff');
      core.addColorStop(0.5, '#ffe27a');
      core.addColorStop(1, 'rgba(255,150,30,0)');
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(3, 0, 7, 0, Math.PI * 2);
      ctx.fill();
    } else if (id === 'prism') {
      for (let i = 0; i < 5; i++) {
        const off = (ph * 26 + i * 8) % 34;
        ctx.save();
        ctx.translate(-4 - off, (i % 2 ? -1 : 1) * (5 - i * 0.8));
        ctx.rotate(ph * 6 + i * 1.3);
        ctx.fillStyle = 'hsla(' + ((i * 72) % 360) + ',95%,68%,0.9)';
        ctx.beginPath();
        ctx.moveTo(0, -3.4); ctx.lineTo(2.6, 2.2); ctx.lineTo(-2.6, 2.2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    } else if (id === 'plasma') {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 0; i < 2; i++) {
        const off = (ph * 34 + i * 14) % 34;
        ctx.strokeStyle = i ? 'rgba(255,255,255,0.8)' : '#c77dff';
        ctx.lineWidth = 2 - i * 0.9;
        ctx.beginPath();
        ctx.moveTo(-2 - off, 0);
        ctx.lineTo(-7 - off, -4);
        ctx.lineTo(-12 - off, 3);
        ctx.lineTo(-17 - off, -2);
        ctx.stroke();
      }
      const pg = ctx.createRadialGradient(0, 0, 0.5, 0, 0, 6);
      pg.addColorStop(0, 'rgba(255,255,255,0.9)');
      pg.addColorStop(0.6, 'rgba(199,125,255,0.5)');
      pg.addColorStop(1, 'rgba(140,60,255,0)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (id === 'galaxy') {
      for (let i = 0; i < 6; i++) {
        const off = (ph * 22 + i * 7) % 36;
        const tint = i % 3 === 0 ? '255,255,255' : i % 3 === 1 ? '190,150,255' : '140,190,255';
        const tw = 0.55 + 0.45 * Math.sin(ph * 12 + i * 2.2);
        const s = 1.4 + (i % 3) * 0.7;
        const px = -3 - off, py = (i % 2 ? -1 : 1) * (6 - i * 0.9);
        ctx.fillStyle = 'rgba(' + tint + ',' + tw.toFixed(2) + ')';
        ctx.beginPath();
        ctx.moveTo(px, py - s * 1.6);
        ctx.lineTo(px + s * 0.4, py - s * 0.4);
        ctx.lineTo(px + s * 1.6, py);
        ctx.lineTo(px + s * 0.4, py + s * 0.4);
        ctx.lineTo(px, py + s * 1.6);
        ctx.lineTo(px - s * 0.4, py + s * 0.4);
        ctx.lineTo(px - s * 1.6, py);
        ctx.lineTo(px - s * 0.4, py - s * 0.4);
        ctx.closePath();
        ctx.fill();
      }
    } else if (id === 'aurora') {
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const off = (ph * 26 + i * 11) % 34;
        const col = i === 0 ? '93,255,200' : i === 1 ? '197,138,255' : '110,240,255';
        ctx.strokeStyle = 'rgba(' + col + ',0.85)';
        ctx.lineWidth = 2.4 - i * 0.5;
        ctx.beginPath();
        ctx.moveTo(-2 - off, (i - 1) * 5);
        ctx.quadraticCurveTo(-8 - off, (i - 1) * 5 + 4, -14 - off, (i - 1) * 5 - 2);
        ctx.stroke();
      }
    } else if (id === 'frost') {
      for (let i = 0; i < 3; i++) {
        const off = (ph * 24 + i * 10) % 32;
        ctx.save();
        ctx.translate(-4 - off, (i % 2 ? -1 : 1) * (5 - i));
        ctx.rotate(ph * 5 + i);
        ctx.strokeStyle = 'rgba(210,240,255,0.9)';
        ctx.lineWidth = 1;
        ctx.lineCap = 'round';
        for (let k = 0; k < 3; k++) {
          const a = k * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 3.6, Math.sin(a) * 3.6);
          ctx.lineTo(-Math.cos(a) * 3.6, -Math.sin(a) * 3.6);
          ctx.stroke();
        }
        ctx.restore();
      }
    } else if (id === 'voidsmoke') {
      for (let i = 0; i < 3; i++) {
        const off = (ph * 20 + i * 9) % 30;
        const rr = 3 + i * 1.6 + ph * 2;
        ctx.fillStyle = 'rgba(10,6,20,0.55)';
        ctx.beginPath();
        ctx.arc(-4 - off, (i % 2 ? -1 : 1) * (3 - i), rr, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,92,255,0.6)';
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
    } else if (id === 'supernova') {
      const ring = 3 + ((ph * 18) % 16);
      ctx.strokeStyle = 'rgba(255,240,200,' + (1 - ring / 19).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-8, 0, ring, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,150,60,' + (0.6 - ring / 32).toFixed(2) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(-8, 0, ring * 1.3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) {
        const a = i * 1.7 + 0.4;
        ctx.beginPath();
        ctx.arc(-8 + Math.cos(a) * ring * 0.8, Math.sin(a) * ring * 0.8, 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawPalPreview(id, cx, cy, t) {
    if (id === 'none') {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 15, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy + 10);
      ctx.lineTo(cx + 10, cy - 10);
      ctx.stroke();
    } else {
      drawPal(id, cx, cy + Math.sin(t * 2.4) * 3, 1.9, t);
    }
  }

  function drawModsTab() {
    const cardY = SHOP_GRID_Y;
    const ready = !!save.startShield;
    const affordable = save.acorns >= MOD_SHIELD_COST;

    ctx.fillStyle = ready ? 'rgba(93,255,158,0.12)' : 'rgba(255,255,255,0.06)';
    roundRect(24, cardY, W - 48, 124, 14);
    ctx.fill();
    ctx.strokeStyle = ready ? 'rgba(93,255,158,0.7)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    roundRect(24, cardY, W - 48, 124, 14);
    ctx.stroke();

    ctx.save();
    ctx.translate(64, cardY + 56);
    ctx.scale(1.25, 1.25);
    drawAcorn(0, 0, 'shield');
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui';
    ctx.fillText('SHIELD START', 106, cardY + 36);
    ctx.font = '600 12px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('Begin your next run with a', 106, cardY + 56);
    ctx.fillText('shield already active.', 106, cardY + 72);
    ctx.fillText('One run only.', 106, cardY + 88);

    if (ready) {
      ctx.fillStyle = '#5dff9e';
      ctx.font = 'bold 13px system-ui';
      ctx.fillText('READY — next run', 106, cardY + 110);
    } else if (!startShieldUnlocked()) {
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = 'bold 13px system-ui';
      ctx.fillText('REACH PILOT LEVEL 3', 106, cardY + 110);
    } else {
      ctx.fillStyle = affordable ? '#ffd080' : 'rgba(255,208,128,0.45)';
      ctx.font = 'bold 13px system-ui';
      const ct = 'BUY  ' + MOD_SHIELD_COST;
      ctx.fillText(ct, 106, cardY + 110);
      drawAcornIcon(112 + ctx.measureText(ct).width + 8, cardY + 106, 0.8);
    }

    // ——— shield battery ———
    const bY = cardY + 140;
    const owned = !!save.battery;
    const open = batteryUnlocked();
    const canBuy = open && !owned && save.acorns >= MOD_BATTERY_COST;

    ctx.fillStyle = owned ? 'rgba(93,255,158,0.12)' : 'rgba(255,255,255,0.06)';
    roundRect(24, bY, W - 48, 124, 14);
    ctx.fill();
    ctx.strokeStyle = owned ? 'rgba(93,255,158,0.7)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    roundRect(24, bY, W - 48, 124, 14);
    ctx.stroke();

    ctx.save();
    ctx.globalAlpha = open ? 1 : 0.45;
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(48 + i * 17, bY + 56);
      ctx.scale(0.72, 0.72);
      drawAcorn(0, 0, 'shield');
      ctx.restore();
    }
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = open ? '#fff' : 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 16px system-ui';
    ctx.fillText('SHIELD BATTERY', 116, bY + 36);
    ctx.font = '600 12px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('Hold up to 3 shield charges', 116, bY + 56);
    ctx.fillText('at once. Permanent.', 116, bY + 72);

    ctx.font = 'bold 13px system-ui';
    if (owned) {
      ctx.fillStyle = '#5dff9e';
      ctx.fillText('OWNED', 116, bY + 102);
    } else if (!open) {
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText('REACH PILOT LEVEL 8', 116, bY + 102);
    } else {
      ctx.fillStyle = canBuy ? '#ffd080' : 'rgba(255,208,128,0.45)';
      const bt = 'BUY  ' + MOD_BATTERY_COST;
      ctx.fillText(bt, 116, bY + 102);
      drawAcornIcon(122 + ctx.measureText(bt).width + 8, bY + 98, 0.8);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '600 12px system-ui';
    ctx.fillText('More modifiers coming soon', W / 2, bY + 156);
  }

  window.addEventListener('resize', resize);
  resize();
  initStars();
  requestAnimationFrame(frame);

  // BETA ONLY: debug hook so automated tests can inspect and stage game
  // state. Must never ship in the live build.
  window.__acornautDebug = {
    get mode() { return mode; },
    set mode(m) { mode = m; },
    get squirrel() { return squirrel; },
    get planets() { return planets; },
    get W() { return W; },
    get H() { return H; },
    get SQUIRREL_X() { return SQUIRREL_X; },
    get shields() { return shields; },
    get hasShield() { return shieldCharges > 0; },
    set hasShield(v) { shieldCharges = v ? 1 : 0; },
    get shieldCharges() { return shieldCharges; },
    set shieldCharges(v) { shieldCharges = v; },
    get absorbGrace() { return absorbGrace; },
    set absorbGrace(v) { absorbGrace = v; },
    get deepSpace() { return deepSpace; },
    set deepTimer(v) { deepTimer = v; },
    get deepTimer() { return deepTimer; },
    get shieldFreeze() { return shieldFreeze; },
    get shieldSlow() { return shieldSlow; },
    get save() { return save; },
    get hitCooldown() { return hitCooldown; },
    set hitCooldown(v) { hitCooldown = v; },
    get bounceUp() { return bounceUp; },
    set bounceUp(v) { bounceUp = v; },
    get shopTab() { return shopTab; },
    get blackholes() { return blackholes; },
    get goldens() { return goldens; },
    get invulnLeft() { return invulnLeft; },
    set invulnLeft(v) { invulnLeft = v; },
    get warpT() { return warpT; },
    get warpLeft() { return warpLeft; },
    set warpLeft(v) { warpLeft = v; },
    get warpTilt() { return warpTilt; },
    get warpMirror() { return warpMirror; },
    get recoveryMsg() { return recoveryMsg; },
    get particles() { return particles; },
    get runAcorns() { return runAcorns; },
    set runAcorns(v) { runAcorns = v; },
    pilotLevel,
    levelForXp,
    xpCumulative,
    get XP_STEPS() { return XP_STEPS; },
    get TRACK() { return TRACK; },
    get PAL_LEVELS() { return PAL_LEVELS; },
    get SUIT_REVEAL() { return SUIT_REVEAL; },
    get lastRunXp() { return lastRunXp; },
    get lastLevelFrom() { return lastLevelFrom; },
    get lastLevelTo() { return lastLevelTo; },
    get flightScroll() { return flightScroll; },
    set flightScroll(v) { flightScroll = v; },
    flightContentH,
    openFlightLog,
    get tut() { return tut; },
    startTutorial,
    get distance() { return distance; },
    set distance(v) { distance = v; },
    get score() { return score; },
    set score(v) { score = v; },
    get envB() { return envB; },
    get envBlend() { return envBlend; },
    get envName() { return ENVS[envB].name; },
    get ENVS() { return ENVS; },
    get envOrder() { return envOrder; },
    set envOrder(v) { envOrder = v; },
    get lastGapY() { return lastGapY; },
    get powerups() { return powerups; },
    get lostSpace() { return lostSpace; },
    get wormholes() { return wormholes; },
    get driftFactor() { return driftFactor; },
    get driftPhase() { return driftPhase; },
    set driftPhase(v) { driftPhase = v; },
    get tiltPhase() { return tiltPhase; },
    set tiltPhase(v) { tiltPhase = v; },
    get prevMirror() { return prevMirror; },
    difficulty,
    spawnPair,
    get pal() { return pal; },
    get acorns() { return acorns; },
    resetRun,
    flap,
  };
})();
</script>
