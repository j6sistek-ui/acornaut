      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.95, r * 0.2, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (kind === 4) {
      ctx.strokeStyle = 'rgba(100,220,200,0.5)';
      ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.35, r * 0.22, 0.18, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 7) {
      ctx.strokeStyle = 'rgba(100,140,220,0.45)';
      ctx.lineWidth = Math.max(1.8, r * 0.05);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.3, r * 0.2, -0.12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(100,140,220,0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.42, r * 0.24, -0.12, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 2) {
      // thin icy ring
      ctx.strokeStyle = 'rgba(200,220,240,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.25, r * 0.15, 0.1, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 15) {
      // broad double ice ring
      ctx.strokeStyle = 'rgba(143,212,240,0.5)';
      ctx.lineWidth = Math.max(2.5, r * 0.09);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.5, r * 0.26, -0.22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(197,138,255,0.3)';
      ctx.lineWidth = Math.max(1.2, r * 0.04);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.68, r * 0.3, -0.22, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 14) {
      // orbiting shards blasted off the shattered surface
      ctx.fillStyle = 'rgba(176,160,140,0.7)';
      [[1.28,0.12,-0.4],[1.38,-0.06,0.9],[1.32,0.2,2.2],[1.45,0.02,3.6]].forEach(([rr,tilt,th]) => {
        const px = x + Math.cos(th) * r * rr;
        const py = y + Math.sin(th) * r * rr * 0.32 + tilt * r;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(1.2, r * 0.06), 0, Math.PI * 2);
        ctx.fill();
      });
    } else if (kind === 10) {
      // a scatter of glinting crystal motes
      ctx.fillStyle = 'rgba(203,178,255,0.8)';
      [[1.3,0.4],[1.35,2.1],[1.28,4.2]].forEach(([rr,th]) => {
        const px = x + Math.cos(th) * r * rr;
        const py = y + Math.sin(th) * r * rr * 0.3;
        ctx.beginPath();
        ctx.moveTo(px, py - 2.4); ctx.lineTo(px + 1.6, py);
        ctx.lineTo(px, py + 2.4); ctx.lineTo(px - 1.6, py);
        ctx.closePath();
        ctx.fill();
      });
    }

    // crisp limb highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r - 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawAcorn(x, y, power) {
    const shield = power === 'shield';
    const hole = power === 'blackhole';
    const golden = power === 'golden';
    const worm = power === 'wormhole';
    ctx.save();
    ctx.translate(x, y);
    if (golden) {
      // radiant star-ring
      const t = performance.now() / 1000;
      const glow = ctx.createRadialGradient(0, 0, 3, 0, 0, 26);
      glow.addColorStop(0, 'rgba(255,230,120,0.55)');
      glow.addColorStop(0.55, 'rgba(255,190,40,0.2)');
      glow.addColorStop(1, 'rgba(255,190,40,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,240,170,0.95)';
      for (let i = 0; i < 5; i++) {
        const a = t * 1.2 + (i / 5) * Math.PI * 2;
        const px = Math.cos(a) * 18, py = Math.sin(a) * 18 * 0.8;
        ctx.beginPath();
        ctx.moveTo(px, py - 2.6);
        ctx.lineTo(px + 1, py - 0.8);
        ctx.lineTo(px + 2.8, py);
        ctx.lineTo(px + 1, py + 0.8);
        ctx.lineTo(px, py + 2.6);
        ctx.lineTo(px - 1, py + 0.8);
        ctx.lineTo(px - 2.8, py);
        ctx.lineTo(px - 1, py - 0.8);
        ctx.closePath();
        ctx.fill();
      }
    }
    if (worm) {
      // teal portal — two counter-rotating rings, the mirror made visible
      const t = performance.now() / 1000;
      const glow = ctx.createRadialGradient(0, 0, 3, 0, 0, 26);
      glow.addColorStop(0, 'rgba(0,45,40,0.9)');
      glow.addColorStop(0.5, 'rgba(45,220,200,0.3)');
      glow.addColorStop(1, 'rgba(45,220,200,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(110,240,220,0.9)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(0, 0, 19, 6.5, (t * 0.9) % (Math.PI * 2), 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(190,255,245,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 4.6, (-t * 0.9 - 0.9) % (Math.PI * 2), 0, Math.PI * 2);
      ctx.stroke();
    } else if (hole) {
      // dark core with a swirling accretion ring
      const t = performance.now() / 1000;
      const glow = ctx.createRadialGradient(0, 0, 3, 0, 0, 26);
      glow.addColorStop(0, 'rgba(20,0,40,0.9)');
      glow.addColorStop(0.5, 'rgba(120,40,200,0.28)');
      glow.addColorStop(1, 'rgba(120,40,200,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,130,255,0.85)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(0, 0, 19, 6.5, t * 0.8 % (Math.PI * 2), 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,190,90,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 4.6, (t * 0.8 + 0.9) % (Math.PI * 2), 0, Math.PI * 2);
      ctx.stroke();
    } else if (shield) {
      // protective bubble around the nut
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 24);
      glow.addColorStop(0, 'rgba(110,255,170,0.4)');
      glow.addColorStop(0.55, 'rgba(60,220,130,0.16)');
      glow.addColorStop(1, 'rgba(60,220,130,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,255,190,0.85)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 17, -2.3, -1.2);
      ctx.stroke();
    } else if (power) {
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
      glow.addColorStop(0, 'rgba(100,230,255,0.45)');
      glow.addColorStop(0.5, 'rgba(60,180,255,0.18)');
      glow.addColorStop(1, 'rgba(60,180,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
    }
    // soft shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(1, 12, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // nut body with gradient
    const nut = ctx.createRadialGradient(-3, 0, 2, 0, 4, 12);
    if (golden) {
      nut.addColorStop(0, '#fff3c0');
      nut.addColorStop(0.5, '#ffce45');
      nut.addColorStop(1, '#a06a08');
    } else if (worm) {
      nut.addColorStop(0, '#bffff2');
      nut.addColorStop(0.5, '#2ec4ad');
      nut.addColorStop(1, '#0a4a40');
    } else if (hole) {
      nut.addColorStop(0, '#3a2a55');
      nut.addColorStop(0.5, '#1a1030');
      nut.addColorStop(1, '#05020c');
    } else if (shield) {
      nut.addColorStop(0, '#c8ffde');
      nut.addColorStop(0.5, '#4ade80');
      nut.addColorStop(1, '#14683a');
    } else if (power) {
      nut.addColorStop(0, '#c0f0ff');
      nut.addColorStop(0.5, '#5ad0f0');
      nut.addColorStop(1, '#1a70a0');
    } else {
      nut.addColorStop(0, '#e8b060');
      nut.addColorStop(0.5, '#c47a28');
      nut.addColorStop(1, '#6a3a10');
    }
    ctx.fillStyle = nut;
    ctx.beginPath();
    ctx.ellipse(0, 3, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // stem notch line
    ctx.strokeStyle = power ? 'rgba(20,80,120,0.35)' : 'rgba(60,30,10,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.lineTo(0, 10);
    ctx.stroke();
    // cap
    const cap = ctx.createRadialGradient(0, -6, 1, 0, -4, 12);
    if (golden) {
      cap.addColorStop(0, '#ffe27a');
      cap.addColorStop(1, '#b07c10');
    } else if (worm) {
      cap.addColorStop(0, '#39a08c');
      cap.addColorStop(1, '#0c3a32');
    } else if (hole) {
      cap.addColorStop(0, '#6a3aa8');
      cap.addColorStop(1, '#241040');
    } else if (shield) {
      cap.addColorStop(0, '#3fbf74');
      cap.addColorStop(1, '#0c4a28');
    } else if (power) {
      cap.addColorStop(0, '#6ec8e8');
      cap.addColorStop(1, '#1a6088');
    } else {
      cap.addColorStop(0, '#8a5a28');
      cap.addColorStop(1, '#3a2010');
    }
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.ellipse(0, -5, 11.5, 7.5, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-11, -6, 22, 4);
    // cap texture ridges
    ctx.strokeStyle = power ? 'rgba(255,255,255,0.2)' : 'rgba(255,200,120,0.2)';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 4, -8); ctx.lineTo(i * 3.2, -3);
      ctx.stroke();
    }
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-3.5, 1, 2.8, 4.5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPal(id, x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    if (id === 'buddy') {
      // small acorn person with a sparkle jet
      ctx.fillStyle = 'rgba(255,220,120,0.5)';
      ctx.beginPath();
      ctx.arc(-8, 3 + Math.sin(t * 9) * 1.2, 1.6, 0, Math.PI * 2);
      ctx.fill();
      const nut = ctx.createRadialGradient(-2, 0, 1, 0, 2, 8);
      nut.addColorStop(0, '#e8b060');
      nut.addColorStop(1, '#7a4515');
      ctx.fillStyle = nut;
      ctx.beginPath();
      ctx.ellipse(0, 2, 6, 7.2, 0, 0, Math.PI * 2);
      ctx.fill();
      const cap = ctx.createRadialGradient(0, -4, 1, 0, -3, 8);
      cap.addColorStop(0, '#8a5a28');
      cap.addColorStop(1, '#3a2010');
      ctx.fillStyle = cap;
      ctx.beginPath();
      ctx.ellipse(0, -3.4, 7.4, 4.8, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(-7.4, -4, 14.8, 2.4);
      ctx.strokeStyle = '#5a3a18';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -6); ctx.lineTo(0, -8.4);
      ctx.stroke();
      // face
      ctx.fillStyle = '#241207';
      ctx.beginPath(); ctx.arc(-1.8, 1, 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.4, 1, 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#241207';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(0.3, 3.2, 1.7, 0.25, Math.PI - 0.25);
      ctx.stroke();
      // cheeks
      ctx.fillStyle = 'rgba(255,140,110,0.4)';
      ctx.beginPath(); ctx.arc(-3.6, 2.7, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4.2, 2.7, 1, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'bee') {
      // wings behind the body, flapping fast
      const w = Math.sin(t * 26) * 0.6;
      ctx.fillStyle = 'rgba(220,240,255,0.7)';
      ctx.save();
      ctx.rotate(-0.5 + w);
      ctx.beginPath(); ctx.ellipse(-1, -6.5, 2.6, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.rotate(0.25 - w);
      ctx.beginPath(); ctx.ellipse(2, -6, 2.2, 4.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      const bg = ctx.createRadialGradient(-2, -2, 1, 0, 0, 8);
      bg.addColorStop(0, '#ffd95c');
      bg.addColorStop(1, '#c88a10');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 5.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a2808';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * 2.6, 0, 1.1, 5.4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // helmet dome (it IS an astro bee)
      ctx.strokeStyle = 'rgba(200,230,255,0.8)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(4.2, -1.6, 3.6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#241207';
      ctx.beginPath(); ctx.arc(4.6, -1.8, 0.9, 0, Math.PI * 2); ctx.fill();
      // stinger
      ctx.fillStyle = '#3a2808';
      ctx.beginPath();
      ctx.moveTo(-6.8, 0); ctx.lineTo(-9.4, 0.8); ctx.lineTo(-6.6, 1.8);
      ctx.closePath();
      ctx.fill();
    } else if (id === 'nutsack') {
      // burlap sack, tied at the neck, stitched, with a shy face
      const bag = ctx.createRadialGradient(-2, -2, 2, 0, 2, 10);
      bag.addColorStop(0, '#c49a5c');
      bag.addColorStop(1, '#7a5a2a');
      ctx.fillStyle = bag;
      ctx.beginPath();
      ctx.moveTo(-6.5, -4);
      ctx.quadraticCurveTo(-9, 6, -4.5, 8.5);
      ctx.quadraticCurveTo(0, 10, 4.5, 8.5);
      ctx.quadraticCurveTo(9, 6, 6.5, -4);
      ctx.quadraticCurveTo(2, -6.5, -6.5, -4);
      ctx.fill();
      // tied neck + ears of the sack
      ctx.fillStyle = '#8a6632';
      ctx.beginPath();
      ctx.ellipse(0, -5, 4.4, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#5a3f18';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-3.5, -6.5); ctx.lineTo(-5, -9.5);
      ctx.moveTo(3.5, -6.5); ctx.lineTo(5, -9.5);
      ctx.stroke();
      // stitches
      ctx.strokeStyle = 'rgba(60,40,15,0.6)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-4, 2); ctx.lineTo(-2.4, 3.2);
      ctx.moveTo(2.2, 5.4); ctx.lineTo(3.8, 4.2);
      ctx.stroke();
      // face
      ctx.fillStyle = '#241207';
      ctx.beginPath(); ctx.arc(-2, 0.5, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.4, 0.5, 1, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#241207';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(0.2, 2.6, 1.5, 0.3, Math.PI - 0.3); ctx.stroke();

    } else if (id === 'meteorcore') {
      // green glowing rock, cracks lit from inside
      const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 13);
      glow.addColorStop(0, 'rgba(93,255,158,0.5)');
      glow.addColorStop(1, 'rgba(93,255,158,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
      const rock = ctx.createRadialGradient(-2, -3, 1, 0, 0, 9);
      rock.addColorStop(0, '#5a7a5a');
      rock.addColorStop(1, '#22321f');
      ctx.fillStyle = rock;
      ctx.beginPath();
      ctx.moveTo(-7.5, -1); ctx.lineTo(-3.5, -7); ctx.lineTo(3, -6.5);
      ctx.lineTo(7.5, -0.5); ctx.lineTo(4.5, 6.5); ctx.lineTo(-3.5, 7);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#5dff9e';
      ctx.lineWidth = 1.1;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-4.5, -2); ctx.lineTo(-1, 0.5); ctx.lineTo(-2, 4);
      ctx.moveTo(1.5, -4.5); ctx.lineTo(2.5, -0.5); ctx.lineTo(5.5, 1);
      ctx.stroke();
      ctx.fillStyle = '#0c1a0c';
      ctx.beginPath(); ctx.arc(-1.5, -2.2, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.6, -2.2, 1, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'cometsprite') {
      // little comet with a streaking tail and starry eyes
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = 'rgba(140,210,255,' + (0.6 - i * 0.16) + ')';

        ctx.moveTo(-3 - i * 1.5, -1 + i * 2.2);

        ctx.stroke();
      }
      const head = ctx.createRadialGradient(1, -1.5, 1, 0, 0, 7);
      head.addColorStop(0, '#ffffff');
      head.addColorStop(0.55, '#bfe6ff');
      head.addColorStop(1, '#4a9ad8');
      ctx.fillStyle = head;
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#12365a';
      ctx.beginPath(); ctx.arc(-1.5, -1, 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.5, -1, 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#12365a';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(0.5, 1.6, 1.6, 0.25, Math.PI - 0.25); ctx.stroke();

    } else if (id === 'pocketmoon') {
      const m = ctx.createRadialGradient(-2.5, -3, 1, 0, 0, 8.5);
      m.addColorStop(0, '#f0f4fa');
      m.addColorStop(0.6, '#b8c4d4');
      m.addColorStop(1, '#6a7688');
      ctx.fillStyle = m;
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(90,100,120,0.5)';
      ctx.beginPath(); ctx.arc(-3.5, 2, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, 3.5, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -3.5, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a3242';
      ctx.beginPath(); ctx.arc(-1.8, -1.5, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(1.8, -1.5, 1, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2a3242';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(0, 0.8, 1.5, 0.3, Math.PI - 0.3); ctx.stroke();

    } else if (id === 'voidjelly') {
      // translucent jelly dome with drifting tentacles
      const wob = Math.sin(t * 3);
      const dome = ctx.createRadialGradient(-1, -3, 1, 0, -1, 8);
      dome.addColorStop(0, 'rgba(230,190,255,0.9)');
      dome.addColorStop(0.6, 'rgba(160,90,220,0.6)');
      dome.addColorStop(1, 'rgba(90,40,150,0.35)');
      ctx.fillStyle = dome;
      ctx.beginPath();
      ctx.arc(0, -1, 7.5, Math.PI, 0);
      ctx.quadraticCurveTo(7.5, 3.5, 5.5, 3.5);
      ctx.lineTo(-5.5, 3.5);
      ctx.quadraticCurveTo(-7.5, 3.5, -7.5, -1);
      ctx.fill();
      ctx.strokeStyle = 'rgba(220,180,255,0.7)';
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 2.6, 3.5);
        ctx.quadraticCurveTo(i * 2.6 + wob * 2, 7, i * 2.6 - wob * 2.4, 10.5);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(40,10,80,0.85)';
      ctx.beginPath(); ctx.arc(-2, -2, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2, -2, 1, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'ufo') {
      const hull = ctx.createRadialGradient(0, -2, 1, 0, 0, 9);
      hull.addColorStop(0, '#eef4fa');
      hull.addColorStop(0.5, '#93a3ba');
      hull.addColorStop(1, '#39435a');
      ctx.fillStyle = hull;
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
      const dome = ctx.createRadialGradient(-1, -3.5, 0.5, 0, -2, 4.5);
      dome.addColorStop(0, 'rgba(190,245,255,0.9)');
      dome.addColorStop(1, 'rgba(40,120,190,0.5)');
      ctx.fillStyle = dome;
      ctx.beginPath();
      ctx.ellipse(0, -1.6, 4.2, 3.4, 0, Math.PI, 0);
      ctx.fill();
      // pilot dot
      ctx.fillStyle = '#2a4a2a';
      ctx.beginPath(); ctx.arc(0.4, -2.6, 1.2, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 4; i++) {
        const on = Math.floor(t * 5 + i) % 4 === 0;
        ctx.fillStyle = on ? '#40f0ff' : 'rgba(255,208,64,0.5)';
        ctx.beginPath();
        ctx.arc(-6 + i * 4, 1.6, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (id === 'starpup') {
      // a five-point star with a puppy face and a wagging spark tail
      const wag = Math.sin(t * 9) * 0.35;
      ctx.fillStyle = 'rgba(255,214,90,0.55)';
      ctx.beginPath();
      ctx.arc(-8, 4 + wag * 4, 1.5, 0, Math.PI * 2);
