      ctx.rotate(wag * 0.25);
      const sg = ctx.createRadialGradient(-1.5, -2, 1, 0, 0, 9);
      sg.addColorStop(0, '#fff3c0');
      sg.addColorStop(0.6, '#ffce45');
      sg.addColorStop(1, '#c98a10');
      ctx.fillStyle = sg;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 === 0 ? 8.6 : 4.1;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,95,10,0.6)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      // puppy face: floppy highlight ears, wide eyes, tongue
      ctx.fillStyle = '#3a2410';
      ctx.beginPath(); ctx.arc(-2, -0.8, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2, -0.8, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-1.6, -1.2, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.4, -1.2, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a2410';
      ctx.beginPath(); ctx.ellipse(0, 1.2, 0.9, 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8a9a';
      ctx.beginPath(); ctx.ellipse(0.4, 2.8, 0.9, 1.2, 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (id === 'tinbot') {
      // little rivet-and-solder robot with one earnest eye
      const hover = Math.sin(t * 4) * 0.8;
      ctx.save();
      ctx.translate(0, hover);
      // thruster flame
      ctx.fillStyle = 'rgba(110,240,255,' + (0.4 + 0.3 * Math.sin(t * 16)).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(-2, 8.5); ctx.lineTo(0, 12 + Math.sin(t * 16)); ctx.lineTo(2, 8.5);
      ctx.closePath();
      ctx.fill();
      const body = ctx.createLinearGradient(-6, -6, 6, 8);
      body.addColorStop(0, '#cfd8e2');
      body.addColorStop(0.5, '#8b98a8');
      body.addColorStop(1, '#525d6c');
      ctx.fillStyle = body;
      roundRect(-5.5, -2, 11, 10.5, 2.5);
      ctx.fill();
      ctx.strokeStyle = 'rgba(40,48,60,0.7)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      // rivets
      ctx.fillStyle = 'rgba(40,48,60,0.8)';
      [[-4, -0.5], [4, -0.5], [-4, 7], [4, 7]].forEach(([px, py]) => {
        ctx.beginPath(); ctx.arc(px, py, 0.6, 0, Math.PI * 2); ctx.fill();
      });
      // chest bolt light
      ctx.fillStyle = Math.floor(t * 3) % 2 ? '#ffd23f' : 'rgba(255,210,63,0.35)';
      ctx.beginPath(); ctx.arc(0, 4, 1.4, 0, Math.PI * 2); ctx.fill();
      // dome head with a single big eye
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, -5, 5, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(40,48,60,0.7)';
      ctx.beginPath(); ctx.arc(0, -5, 5, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#0c1118';
      ctx.beginPath(); ctx.arc(1, -6, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#40f0ff';
      ctx.beginPath(); ctx.arc(1 + Math.sin(t * 2) * 0.8, -6, 1.2, 0, Math.PI * 2); ctx.fill();
      // antenna
      ctx.strokeStyle = '#525d6c';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-2.5, -9.5); ctx.lineTo(-3.5, -13); ctx.stroke();
      ctx.fillStyle = '#ff5050';
      ctx.beginPath(); ctx.arc(-3.7, -13.8, 1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (id === 'wisp') {
      // a translucent spirit flame that never quite holds one shape
      const sway = Math.sin(t * 2.2);
      const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
      glow.addColorStop(0, 'rgba(190,255,245,0.8)');
      glow.addColorStop(0.5, 'rgba(90,220,205,0.35)');
      glow.addColorStop(1, 'rgba(60,180,170,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      const core = ctx.createRadialGradient(-1, -2, 0.5, 0, 0, 7);
      core.addColorStop(0, 'rgba(235,255,250,0.95)');
      core.addColorStop(0.7, 'rgba(120,230,215,0.55)');
      core.addColorStop(1, 'rgba(80,200,190,0.15)');
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.moveTo(0, -9 + sway);
      ctx.quadraticCurveTo(5.5, -4, 5, 1.5);
      ctx.quadraticCurveTo(4.5, 6, 0, 6.5);
      ctx.quadraticCurveTo(-4.5, 6, -5, 1.5);
      ctx.quadraticCurveTo(-5.5, -4, 0, -9 + sway);
      ctx.fill();
      // trailing wisps peel off behind
      ctx.strokeStyle = 'rgba(150,240,225,0.5)';
      ctx.lineWidth = 1.1;
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const k = (t * 1.1 + i * 0.33) % 1;
        ctx.globalAlpha = 0.6 * (1 - k);
        ctx.beginPath();
        ctx.moveTo(-4 - k * 6, 2 + Math.sin(i * 2.1 + t * 3) * 2.5);
        ctx.quadraticCurveTo(-7 - k * 8, 0, -9 - k * 10, 3 + Math.sin(i) * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // sleepy contented eyes
      ctx.strokeStyle = 'rgba(20,70,65,0.85)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(-2, -2, 1.4, 0.15, Math.PI - 0.15); ctx.stroke();
      ctx.beginPath(); ctx.arc(2, -2, 1.4, 0.15, Math.PI - 0.15); ctx.stroke();
    }
    ctx.restore();
  }

  function drawVortex(p) {
    // swirling black hole overlay during the transition second
    const cx = W / 2, cy = H / 2;
    const grow = Math.sin(p * Math.PI);           // swells then fades
    ctx.save();
    ctx.globalAlpha = 0.85 * grow;
    const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 120);
    g.addColorStop(0, 'rgba(0,0,0,0.95)');
    g.addColorStop(0.35, 'rgba(30,10,50,0.75)');
    g.addColorStop(0.7, 'rgba(90,40,150,0.3)');
    g.addColorStop(1, 'rgba(90,40,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, 120, 0, Math.PI * 2);
    ctx.fill();
    // spiral arms
    ctx.strokeStyle = 'rgba(180,92,255,0.8)';
    ctx.lineWidth = 2;
    for (let a = 0; a < 3; a++) {
      ctx.beginPath();
      for (let i = 0; i < 26; i++) {
        const th = i * 0.32 + a * (Math.PI * 2 / 3) + p * 9;
        const rr = 6 + i * 4 * grow;
        const px = cx + Math.cos(th) * rr;
        const py = cy + Math.sin(th) * rr * 0.8;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawParticle(p) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.max(0, t);
    if (p.kind === 'flame') {
      ctx.fillStyle = t > 0.5 ? '#ffe080' : t > 0.25 ? '#ff8030' : '#ff4020';
    } else if (p.kind === 'cyan') {
      ctx.fillStyle = '#6ef0ff';
    } else if (p.kind === 'gold') {
      ctx.fillStyle = '#ffd060';
    } else if (p.kind === 'shield') {
      ctx.fillStyle = '#5dff9e';
    } else if (p.kind === 'warp') {
      ctx.fillStyle = '#b45cff';
    } else if (p.kind === 'ion') {
      // stretched plasma streak
      ctx.strokeStyle = t > 0.5 ? '#c8f4ff' : '#3ac0f0';
      ctx.lineWidth = Math.max(0.8, p.r * t);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 9, p.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'bubble') {
      // hollow bubble that pops near the end of its life
      ctx.strokeStyle = 'rgba(170,220,255,0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const br = t > 0.25 ? p.r : p.r * (1 + (0.25 - t) * 6);
      ctx.arc(p.x, p.y, br, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(200,235,255,0.25)';
      ctx.beginPath();
      ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'bloom') {
      // petal puff that expands as it fades
      ctx.fillStyle = t > 0.5 ? '#f0b8ff' : '#a45cd8';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (2 - t), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = Math.max(0, t) * 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'comet') {
      // blazing streak with a bright head
      const len = 10 + p.r * 3;
      const grad = ctx.createLinearGradient(p.x, p.y, p.x + len, p.y);
      grad.addColorStop(0, t > 0.55 ? 'rgba(255,246,210,0.95)' : 'rgba(255,190,60,0.9)');
      grad.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(1, p.r * t);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + len, p.y);
      ctx.stroke();
      ctx.fillStyle = t > 0.55 ? '#fff6d2' : '#ffc340';
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.6, p.r * t * 0.55), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'cometcore') {
      const cg = ctx.createRadialGradient(p.x, p.y, 0.5, p.x, p.y, p.r * (1.6 - t * 0.5));
      cg.addColorStop(0, 'rgba(255,255,240,0.95)');
      cg.addColorStop(0.5, 'rgba(255,214,90,0.7)');
      cg.addColorStop(1, 'rgba(255,150,30,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1.6 - t * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'prism') {
      // tumbling rainbow shard
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.spin || 0) * t * 2);
      ctx.fillStyle = 'hsla(' + ((p.hue || 0) | 0) + ',95%,68%,' + (t * 0.95).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(0, -p.r * 1.4);
      ctx.lineTo(p.r, p.r * 0.9);
      ctx.lineTo(-p.r, p.r * 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (t * 0.4).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(0, -p.r * 0.7);
      ctx.lineTo(p.r * 0.45, p.r * 0.4);
      ctx.lineTo(-p.r * 0.45, p.r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'plasma') {
      // a jagged little bolt, kinked by its own seed
      const s = p.seed || 0;
      const k1 = Math.sin(s * 3.7) * 5, k2 = Math.sin(s * 7.1) * 5;
      ctx.strokeStyle = 'rgba(199,125,255,' + (t * 0.95).toFixed(2) + ')';
      ctx.lineWidth = Math.max(0.8, p.r * t);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 5, p.y + k1);
      ctx.lineTo(p.x + 10, p.y - k2);
      ctx.lineTo(p.x + 15, p.y + k1 * 0.4);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (t * 0.6).toFixed(2) + ')';
      ctx.lineWidth = Math.max(0.5, p.r * t * 0.4);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 5, p.y + k1);
      ctx.lineTo(p.x + 10, p.y - k2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'plasmacore') {
      const cg = ctx.createRadialGradient(p.x, p.y, 0.5, p.x, p.y, p.r * 1.8);
      cg.addColorStop(0, 'rgba(255,255,255,0.9)');
      cg.addColorStop(0.5, 'rgba(199,125,255,0.6)');
      cg.addColorStop(1, 'rgba(140,60,255,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'galaxy') {
      // four-point star twinkling in nebula tints
      const tint = p.tint === 0 ? '255,255,255' : p.tint === 1 ? '190,150,255' : '140,190,255';
      const tw = 0.6 + 0.4 * Math.sin((p.tw || 0) + t * 14);
      ctx.fillStyle = 'rgba(' + tint + ',' + (t * tw).toFixed(2) + ')';
      const s = p.r * (1 + (1 - t) * 0.6);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - s * 1.7);
      ctx.lineTo(p.x + s * 0.45, p.y - s * 0.45);
      ctx.lineTo(p.x + s * 1.7, p.y);
      ctx.lineTo(p.x + s * 0.45, p.y + s * 0.45);
      ctx.lineTo(p.x, p.y + s * 1.7);
      ctx.lineTo(p.x - s * 0.45, p.y + s * 0.45);
      ctx.lineTo(p.x - s * 1.7, p.y);
      ctx.lineTo(p.x - s * 0.45, p.y - s * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'aurora') {
      // a short waving ribbon segment in polar light colors
      const col = p.tint === 0 ? '93,255,200' : p.tint === 1 ? '197,138,255' : '110,240,255';
      const wave = Math.sin((p.tw || 0) + t * 8) * 3;
      ctx.strokeStyle = 'rgba(' + col + ',' + (t * 0.85).toFixed(2) + ')';
      ctx.lineWidth = Math.max(1, p.r * t * 1.4);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(p.x + 7, p.y + wave, p.x + 14, p.y - wave * 0.6);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'frost') {
      // six-arm snowflake, spinning as it drifts
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.spin || 0) * t * 2);
      ctx.strokeStyle = 'rgba(210,240,255,' + (t * 0.9).toFixed(2) + ')';
      ctx.lineWidth = Math.max(0.7, p.r * 0.28);
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const a = i * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * p.r * 1.5, Math.sin(a) * p.r * 1.5);
        ctx.lineTo(-Math.cos(a) * p.r * 1.5, -Math.sin(a) * p.r * 1.5);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,' + (t * 0.8).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(0, 0, p.r * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'frostdust') {
      ctx.fillStyle = '#dff5ff';
    } else if (p.kind === 'voidsmoke') {
      // hollow ring that swells as it dies, violet rim on black smoke
      const swell = p.r * (1 + (1 - t) * 2.2);
      ctx.fillStyle = 'rgba(10,6,20,' + (t * 0.55).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, swell, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(180,92,255,' + (t * 0.6).toFixed(2) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, swell, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'nova') {
      // expanding shockwave ring with a hot core
      const ring = p.r * (1 + (1 - t) * 5);
      ctx.strokeStyle = 'rgba(255,240,200,' + (t * 0.9).toFixed(2) + ')';
      ctx.lineWidth = Math.max(1, 3 * t);
      ctx.beginPath();
      ctx.arc(p.x, p.y, ring, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,150,60,' + (t * 0.5).toFixed(2) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, ring * 1.25, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'novaspark') {
      ctx.fillStyle = t > 0.5 ? '#ffffff' : '#ffcf6a';
    } else {
      ctx.fillStyle = '#e8dcc8';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * t, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function equippedHelmet() {
    return HELMETS.find(h => h.id === save.equipped) || HELMETS[0];
  }

  function equippedSuit() {
    return SUITS.find(s => s.id === save.equippedSuit) || SUITS[0];
  }

  // ——————————————————————————————————————————————————————————
  //  CHARACTER RENDERING
  //  One renderer drives gameplay, the title screen and both shop grids,
  //  so the squirrel is identical everywhere it appears.
  //  Local space: origin at the chest, facing right.
  //  Art extents before scaling: x -37..27, y -34..20
  // ——————————————————————————————————————————————————————————

  const _rgba = {};
  function withAlpha(hex, a) {
    const key = hex + '|' + a;
    let v = _rgba[key];
    if (v) return v;
    const h = hex.replace('#', '');
    const full = h.length === 3 ? h[0] + h[0] + h[1] + h[1] + h[2] + h[2] : h;
    const n = parseInt(full, 16);
    v = 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    _rgba[key] = v;
    return v;
  }

  // —— tail ——————————————————————————————————————————————————
  // A tapered plume swept along a spline: thin at the hip, broad through the
  // middle, drawn to a point at the tip. The width modulation on the edges is
  // what makes it read as fur rather than as a wing.
  // Width stays nearly constant along the plume and the tip is left broad —
  // the discs give it a soft rounded cap. A thin→bulge→point profile reads
  // as a snake that swallowed an egg, not fur.
  // Proportions follow a real squirrel: slim at the hip, a gentle swell
  // through the middle, and a soft taper at the tip — not an even sausage.
  // The tip stops beside the helmet rather than curling over the head.
  const TAIL_PTS = [
    [-2, 13], [-12, 12], [-20, 4.5], [-23, -7], [-19.5, -17.5], [-13.5, -23],
  ];
  const TAIL_W = [3.2, 5.4, 6.6, 7.0, 5.8, 3.0];
  // Sample count only needs to be dense enough that the discs overlap; the
  // spline is ~60px long, so 26 samples still leaves heavy overlap.
  const TAIL_N = 26;

  function splinePoint(pts, u) {
    const n = pts.length - 1;
    const i = Math.max(0, Math.min(Math.floor(u), n - 1));
    const f = u - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
    const f2 = f * f, f3 = f2 * f;
    const comp = (a, b, c, d) =>
      0.5 * (2 * b + (-a + c) * f + (2 * a - 5 * b + 4 * c - d) * f2 + (-a + 3 * b - 3 * c + d) * f3);
    return [comp(p0[0], p1[0], p2[0], p3[0]), comp(p0[1], p1[1], p2[1], p3[1])];
  }

  function tailWidth(u) {
    const n = TAIL_W.length - 1;
    const i = Math.max(0, Math.min(Math.floor(u), n - 1));
    const f = u - i;
    return TAIL_W[i] * (1 - f) + TAIL_W[i + 1] * f;
  }

  // The spline never changes, so it is sampled once at load instead of every
  // frame — the hangar draws nine of these characters per frame.
  const TAIL_SAMPLES = (function () {
    const seg = TAIL_PTS.length - 1;
    const out = [];
    for (let k = 0; k <= TAIL_N; k++) {
      const u = (k / TAIL_N) * seg;
      const p = splinePoint(TAIL_PTS, u);
      const q = splinePoint(TAIL_PTS, Math.min(u + 0.05, seg));
      let dx = q[0] - p[0], dy = q[1] - p[1];
      const L = Math.hypot(dx, dy) || 1;
      dx /= L; dy /= L;
      out.push({
        x: p[0], y: p[1], w: tailWidth(u),
        nx: -dy, ny: dx,
        // phase normalised so the lobe count does not change with TAIL_N;
        // kept subtle — a hint of fur without looking like a cloud
        lobe: 1 + 0.05 * Math.sin((k / TAIL_N) * 26 - 0.6)
                + 0.025 * Math.sin((k / TAIL_N) * 47 + 1.7),
      });
    }
    return out;
  })();

  // The tail is swept as a union of tapered discs rather than a pair of
  // offset curves: offsetting folds in on itself where the tail bends hardest
  // and puts a notch in the silhouette, whereas overlapping discs cannot.
  function tailPath(wMul, shift, lobes) {
    const mul = wMul || 1;
    ctx.beginPath();
    for (let k = 0; k < TAIL_SAMPLES.length; k++) {
      const s = TAIL_SAMPLES[k];
      let r = s.w * mul;
      if (lobes) r *= s.lobe;
      const cx = shift ? s.x + s.nx * s.w * shift : s.x;
      const cy = shift ? s.y + s.ny * s.w * shift : s.y;
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }
  }

  // Robot tail: articulated metal segments following the same spline, so
  // the silhouette matches the furry tail everywhere it appears.
  function drawRoboTail(suit) {
    if (suit.glow) {
      tailPath(1.16, 0, false);
      ctx.fillStyle = withAlpha(suit.glow, 0.18);
      ctx.fill();
    }
    const step = 4;
    for (let k = TAIL_SAMPLES.length - 1; k >= 0; k -= step) {
      const sSeg = TAIL_SAMPLES[k];
      const r = sSeg.w * 1.02;
      const g = ctx.createRadialGradient(sSeg.x - r * 0.4, sSeg.y - r * 0.4, r * 0.2, sSeg.x, sSeg.y, r);
      g.addColorStop(0, suit.belly);
      g.addColorStop(0.55, suit.fur);
      g.addColorStop(1, suit.furDark);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(sSeg.x, sSeg.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = withAlpha(suit.furDark, 0.9);
      ctx.lineWidth = 1;
      ctx.stroke();
      // joint bolt
      ctx.fillStyle = withAlpha(suit.trim, 0.65);
      ctx.beginPath();
      ctx.arc(sSeg.x, sSeg.y, Math.max(0.9, r * 0.16), 0, Math.PI * 2);
      ctx.fill();
    }
    // glowing tail-tip light
    const tip = TAIL_SAMPLES[TAIL_SAMPLES.length - 1];
    const t = performance.now() / 1000;
    const pulse = 0.6 + 0.4 * Math.sin(t * 4);
    ctx.fillStyle = withAlpha(suit.trim, 0.9 * pulse);
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ghost tail: no fur at all — three overlapping spectral plumes that
  // waver on their own beats, with ecto-motes rising off the tip.
  function drawGhostTail(suit) {
    const t = performance.now() / 1000;
    ctx.save();
    for (let k = 0; k < 3; k++) {
      const sway = Math.sin(t * 1.6 + k * 1.9) * 3.5;
      const g = ctx.createLinearGradient(-34, 6, -4, -14);
      g.addColorStop(0, withAlpha(suit.glow || '#9fd8ff', 0));
      g.addColorStop(0.45, withAlpha(suit.glow || '#9fd8ff', 0.22));
      g.addColorStop(1, withAlpha(suit.belly, 0.75));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-6, 9);
      ctx.quadraticCurveTo(-20 - k * 3, 12 + sway, -30 - k * 4, 2 + sway * 1.4 - k * 5);
      ctx.quadraticCurveTo(-34 - k * 4, -6 + sway - k * 5, -26 - k * 3, -12 - k * 4 + sway);
      ctx.quadraticCurveTo(-14, -14, -5, -6);
      ctx.closePath();
      ctx.fill();
    }
    for (let i = 0; i < 4; i++) {
      const kf = (t * 0.7 + i * 0.25) % 1;
      ctx.fillStyle = withAlpha(suit.glow || '#9fd8ff', 0.5 * (1 - kf));
      ctx.beginPath();
      ctx.arc(-14 - i * 5, -2 - kf * 14 + Math.sin(i * 3 + t * 2) * 2,
              1.1 + (1 - kf), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTail(suit) {
    if (suit.robo) { drawRoboTail(suit); return; }
    if (suit.ghost) { drawGhostTail(suit); return; }
    // emissive edge, drawn as a slightly larger silhouette behind the tail
    if (suit.glow) {
      tailPath(1.16, 0, true);
      ctx.fillStyle = withAlpha(suit.glow, 0.26);
      ctx.fill();
    }

    // dark keyline, same trick — a larger silhouette behind the fill
    tailPath(1.07, 0, true);
    ctx.fillStyle = suit.furDark;
    ctx.fill();

    tailPath(1, 0, true);
    const g = ctx.createLinearGradient(-30, 14, -4, -26);
    g.addColorStop(0, suit.furDark);
    g.addColorStop(0.35, suit.fur);
    g.addColorStop(0.82, suit.fur);
    g.addColorStop(1, suit.belly);
    ctx.fillStyle = g;
    ctx.fill();

    // lighter inner streak — the two-tone underside real squirrels have
    ctx.save();
    ctx.clip();
    ctx.globalAlpha = 0.36;
    ctx.fillStyle = suit.belly;
    tailPath(0.46, -0.38, false);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // a few fur strands for texture
    ctx.strokeStyle = withAlpha(suit.furDark, 0.32);
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    for (let i = 1; i <= 6; i++) {
      const s = TAIL_SAMPLES[Math.round((i / 7.2) * (TAIL_SAMPLES.length - 1))];
      // strands lean back along the plume like brushed fur
      const lean = 0.35;
      ctx.beginPath();
      ctx.moveTo(s.x + s.nx * s.w * 0.2, s.y + s.ny * s.w * 0.2);
      ctx.lineTo(s.x + s.nx * s.w * 0.88 - s.ny * s.w * lean,
                 s.y + s.ny * s.w * 0.88 + s.nx * s.w * lean);
      ctx.stroke();
    }
  }

  // —— body ——————————————————————————————————————————————————
  function drawSuitBody(suit) {
    // BIG BOOTY: the haunches go ABSOLUTELY MAXIMUM — twin planetoid
    // cheeks, each bouncing on its own beat with cartoon squash-and-
    // stretch, a deep seam, juicy double shine, and the gold waistband
    // of shorts that never stood a chance. Silhouette first, always.
    if (suit.booty) {
      const t = performance.now() / 1000;
      // out-of-phase beats so the cheeks BOUNCE independently, not slide
      const jigL = Math.sin(t * 7) * 1.8;
      const jigR = Math.sin(t * 7 + 0.7) * 1.8;
      const cheek = (cx, cy, rr, jig) => {
        // squash & stretch: wider as it lands, taller as it rises
        const sqx = 1 + Math.abs(jig) * 0.022;
        const sqy = 1 - Math.abs(jig) * 0.022;
        const g = ctx.createRadialGradient(cx - rr * 0.32, cy - rr * 0.4, 1, cx, cy, rr + 4);
        g.addColorStop(0, suit.suitLite);
        g.addColorStop(0.5, suit.suit);
        g.addColorStop(1, suit.suitDark);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(cx, cy + jig, rr * sqx, rr * 0.96 * sqy, 0.15, 0, Math.PI * 2);
        ctx.fill();
        // juicy double shine: big top gleam + a small kiss of rim light
        ctx.fillStyle = withAlpha('#ffffff', 0.3);
        ctx.beginPath();
        ctx.ellipse(cx - rr * 0.32, cy - rr * 0.4 + jig,
                    rr * 0.4, rr * 0.26, -0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = withAlpha('#ffffff', 0.16);
        ctx.beginPath();
        ctx.ellipse(cx + rr * 0.25, cy + rr * 0.35 + jig,
                    rr * 0.2, rr * 0.12, 0.35, 0, Math.PI * 2);
        ctx.fill();
        // under-cheek shadow arc so it reads perfectly ROUND
        ctx.strokeStyle = withAlpha(suit.suitDark, 0.7);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(cx, cy + jig, rr * 0.92, 0.5, 1.8);
        ctx.stroke();
      };
      // FAR cheek first: tucked up behind the body so the near cheek and
      // torso cover almost all of it — only its top crescent peeks out.
      // (Two full bubbles hanging below read as… something else.)
      cheek(-6.5, 5, 13, jigR);
      // NEAR cheek: the giant one that owns the whole silhouette
      cheek(-14, 13.5, 15.5, jigL);
      // gold waistband riding the top of all that curve
      ctx.strokeStyle = suit.trim;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-27, 5);
      ctx.quadraticCurveTo(-10, -3, 5, 5);
      ctx.stroke();
    }

    // hind haunch
    ctx.fillStyle = suit.suitDark;
    ctx.beginPath();
    ctx.ellipse(-6, 10, 8.4, 8.0, 0.18, 0, Math.PI * 2);
    ctx.fill();

    // little legs dangling beneath the suit, trailing slightly in flight
    const leg = (hx, hy, fx, fy, footR) => {
      ctx.strokeStyle = suit.suitDark;
      ctx.lineWidth = 4.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.quadraticCurveTo((hx + fx) / 2 - 1.2, (hy + fy) / 2, fx, fy);
      ctx.stroke();
      // paw
      ctx.fillStyle = suit.furDark;
      ctx.beginPath();
      ctx.ellipse(fx + 1.1, fy + 0.6, footR, footR * 0.62, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = withAlpha(suit.suitDark, 0.75);
      ctx.lineWidth = 0.7;
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.moveTo(fx + 2.2 + i * 1.4, fy - 0.6);
        ctx.lineTo(fx + 3.0 + i * 1.4, fy + 1.4);
        ctx.stroke();
      }
    };
    leg(-3.5, 13, -2, 19.5, 3.4);   // hind leg off the haunch
    leg(6, 13, 7.8, 18.5, 3.0);     // front leg under the chest

    // torso
    const g = ctx.createRadialGradient(-4, 2, 2, 1, 9, 18);
    g.addColorStop(0, suit.suitLite);
    g.addColorStop(0.5, suit.suit);
    g.addColorStop(1, suit.suitDark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 7, 13.0, 11.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // chest panel
    ctx.fillStyle = withAlpha(suit.trim, 0.2);
    ctx.beginPath();
    ctx.ellipse(2.5, 9, 6.8, 7.0, 0, 0, Math.PI * 2);
    ctx.fill();

    // shoulder trim stripe
    ctx.strokeStyle = suit.trim;
    ctx.lineWidth = 2.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9.5, 4.5);
    ctx.quadraticCurveTo(-2, 0.6, 6, 3.4);
    ctx.stroke();

    // control panel on the belly
    ctx.fillStyle = suit.suitDark;
    roundRect(1.5, 9.5, 6.5, 5.5, 1.8);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.trim, 0.7);
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.fillStyle = suit.trim;
    ctx.beginPath();
    ctx.arc(3.4, 12.2, 0.95, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.glow || suit.trim;
    ctx.beginPath();
    ctx.arc(6.2, 12.2, 0.95, 0, Math.PI * 2);
    ctx.fill();

    // front paws, held forward the way a squirrel holds a nut
    ctx.fillStyle = suit.suitDark;
    ctx.beginPath();
    ctx.ellipse(9.5, 10.5, 4.2, 3.3, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(12.4, 9.0, 3.0, 2.5, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.suitDark, 0.85);
    ctx.lineWidth = 0.7;
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(13.6 + i * 1.3, 7.8 + i * 0.9);
      ctx.lineTo(14.9 + i * 1.2, 9.1 + i * 0.9);
      ctx.stroke();
    }

    // robo: panel seams + a power core light on the torso
    if (suit.robo) {
      ctx.strokeStyle = withAlpha(suit.furDark, 0.7);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-11, 3); ctx.quadraticCurveTo(0, 6.5, 11, 3.5);
      ctx.moveTo(-9.5, 11); ctx.quadraticCurveTo(0, 14, 9.5, 11.5);
      ctx.stroke();
      const t = performance.now() / 1000;
      const corePulse = 0.65 + 0.35 * Math.sin(t * 3);
      ctx.fillStyle = withAlpha(suit.trim, corePulse);
      ctx.beginPath();
      ctx.arc(-3, 7.5, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = withAlpha(suit.trim, 0.5);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(-3, 7.5, 3.6, 0, Math.PI * 2);
      ctx.stroke();
    }

    // rim light so the silhouette separates from the starfield
    ctx.strokeStyle = suit.glow ? withAlpha(suit.glow, 0.8) : 'rgba(255,236,200,0.32)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(0, 7, 13.0, 11.8, 0, 0.35, 2.6);
    ctx.stroke();
  }

  // Robot head: metal cranium with a glowing visor eye, fin ears and an
  // antenna — same position and size as the furry head so helmets fit.
  function drawRoboHead(suit) {
    const t = performance.now() / 1000;
    // fin ears where the furry ears sit
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.moveTo(4, -17); ctx.lineTo(6.5, -24); ctx.lineTo(9, -17.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.moveTo(9.5, -17); ctx.lineTo(12, -25); ctx.lineTo(14.5, -17.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = withAlpha(suit.trim, 0.8);
    ctx.beginPath();
    ctx.moveTo(10.8, -19); ctx.lineTo(12, -23); ctx.lineTo(13.2, -19.2);
    ctx.closePath();
    ctx.fill();

    // cranium
    const hg = ctx.createRadialGradient(7, -15, 2, 11, -9, 15);
    hg.addColorStop(0, suit.belly);
    hg.addColorStop(0.5, suit.fur);
    hg.addColorStop(1, suit.furDark);
    ctx.fillStyle = hg;
    roundRect(0.5, -20, 19.5, 17.5, 7);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.furDark, 0.8);
    ctx.lineWidth = 1;
    ctx.stroke();

    // visor eye band with a scanning glow
    ctx.fillStyle = '#0c1118';
    roundRect(6, -15.5, 13, 6, 3);
    ctx.fill();
    const scan = 8 + Math.sin(t * 2.4) * 4;
    ctx.fillStyle = suit.trim;
    ctx.beginPath();
    ctx.arc(6 + scan, -12.5, 1.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = withAlpha(suit.trim, 0.35);
    ctx.beginPath();
    ctx.arc(6 + scan, -12.5, 3.2, 0, Math.PI * 2);
    ctx.fill();

    // muzzle plate with speaker grille (where the teeth would be)
    ctx.fillStyle = suit.furDark;
    roundRect(13, -8, 8.5, 6.5, 2.5);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.belly, 0.6);
    ctx.lineWidth = 0.8;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(14.8, -6.2 + i * 1.8);
      ctx.lineTo(20, -6.2 + i * 1.8);
      ctx.stroke();
    }

    // antenna
    ctx.strokeStyle = suit.furDark;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(3.5, -19.5); ctx.lineTo(1.5, -26);
    ctx.stroke();
    const blink = Math.floor(t * 2) % 2 === 0;
    ctx.fillStyle = blink ? '#ff5050' : withAlpha('#ff5050', 0.35);
    ctx.beginPath();
    ctx.arc(1.2, -27.2, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Alien head: teardrop cranium, one huge obsidian almond eye (plus a
  // hint of a second), glowing antennae — but the ears, muzzle and buck
  // teeth stay, so it's still recognisably OUR squirrel.
  function drawAlienHead(suit) {
    const t = performance.now() / 1000;
    // far ear
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(5.4, -20.2, 2.6, 4.4, -0.4, 0, Math.PI * 2);
    ctx.fill();
    // swept teardrop cranium, wider at the back like a classic grey
    const hg = ctx.createRadialGradient(7.5, -15, 2, 11, -9, 16);
    hg.addColorStop(0, suit.belly);
    hg.addColorStop(0.45, suit.fur);
    hg.addColorStop(1, suit.furDark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(9, -12.5, 10.6, 9.6, -0.12, 0, Math.PI * 2);
    ctx.fill();
    // near ear + inner
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.ellipse(11, -20.6, 3.2, 4.8, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = withAlpha(suit.furDark, 0.6);
    ctx.beginPath();
    ctx.ellipse(11.2, -20.2, 1.5, 2.7, -0.2, 0, Math.PI * 2);
    ctx.fill();
    // antennae with pulsing tips
    ctx.strokeStyle = suit.furDark;
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(6.5, -21); ctx.quadraticCurveTo(4.5, -27, 5.8, -30);
    ctx.moveTo(13.5, -21); ctx.quadraticCurveTo(15.5, -27, 14.4, -30.5);
    ctx.stroke();
    const pulse = 0.55 + 0.45 * Math.sin(t * 3.4);
    for (const [bx, by] of [[5.8, -31], [14.4, -31.5]]) {
      ctx.fillStyle = withAlpha(suit.glow || suit.trim, 0.35 * pulse);
      ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = withAlpha(suit.trim, 0.6 + 0.4 * pulse);
      ctx.beginPath(); ctx.arc(bx, by, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    // muzzle + buck teeth: the squirrel stays a squirrel
    ctx.fillStyle = suit.belly;
    ctx.beginPath();
    ctx.ellipse(16.4, -8.4, 5.0, 4.0, 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fffaf0';
    roundRect(17.2, -6.2, 3.6, 4.0, 1.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,110,60,0.5)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(19, -6); ctx.lineTo(19, -2.4);
    ctx.stroke();
    // tiny slit nostrils instead of a nose
    ctx.strokeStyle = withAlpha(suit.furDark, 0.9);
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(19.4, -10.4); ctx.lineTo(20.4, -10.0);
    ctx.moveTo(19.0, -9.2); ctx.lineTo(20.0, -8.8);
    ctx.stroke();
    // the EYE: huge obsidian almond with a wet shine and a green glint
    ctx.save();
    ctx.translate(11.6, -12.6);
    ctx.rotate(-0.35);
    const eg = ctx.createRadialGradient(-1, -1.5, 0.5, 0, 0, 6.4);
    eg.addColorStop(0, '#2c3a44');
    eg.addColorStop(0.5, '#101820');
    eg.addColorStop(1, '#05080c');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.ellipse(0, 0, 6.2, 3.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.furDark, 0.9);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(-2.2, -1.5, 1.6, 1.0, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(190,255,190,0.5)';
    ctx.beginPath(); ctx.arc(2.4, 0.8, 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // hint of the second eye further back
    ctx.fillStyle = '#0a1014';
    ctx.beginPath();
    ctx.ellipse(3.6, -14.4, 2.0, 1.3, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(3.0, -14.8, 0.5, 0, Math.PI * 2); ctx.fill();
  }

  // —— head ——————————————————————————————————————————————————
  function drawHead(suit) {
    if (suit.robo) { drawRoboHead(suit); return; }
    if (suit.alien) { drawAlienHead(suit); return; }
    // far ear (behind the head)
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(6.0, -20.6, 3.2, 5.2, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // head
    const hg = ctx.createRadialGradient(7.5, -15, 2, 11, -9, 15);
    hg.addColorStop(0, suit.fur);
    hg.addColorStop(0.62, suit.fur);
    hg.addColorStop(1, suit.furDark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(10, -11, 9.6, 9.0, 0, 0, Math.PI * 2);
    ctx.fill();

    // cheek fluff
    ctx.fillStyle = withAlpha(suit.belly, 0.5);
    ctx.beginPath();
    ctx.ellipse(11.4, -6.8, 5.0, 3.3, 0.25, 0, Math.PI * 2);
    ctx.fill();

    // near ear, with inner pink and a tuft
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.ellipse(11.4, -19.8, 3.8, 5.6, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#eeae94';
    ctx.beginPath();
    ctx.ellipse(11.6, -19.4, 1.8, 3.2, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = suit.furDark;
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(10.4, -24.2); ctx.lineTo(9.5, -26.6);
    ctx.moveTo(12.8, -24.0); ctx.lineTo(13.6, -26.4);
    ctx.stroke();

    // muzzle
    ctx.fillStyle = suit.belly;
    ctx.beginPath();
    ctx.ellipse(16.4, -8.6, 5.2, 4.2, 0.16, 0, Math.PI * 2);
    ctx.fill();

    // buck teeth — the strongest "this is a rodent" cue
    ctx.fillStyle = '#fffaf0';
    roundRect(17.2, -6.3, 3.8, 4.3, 1.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,110,70,0.55)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(19.1, -6.1); ctx.lineTo(19.1, -2.2);
    ctx.stroke();

    // nose
    ctx.fillStyle = '#3a2418';
    ctx.beginPath();
    ctx.ellipse(20.2, -10.0, 2.0, 1.6, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(19.7, -10.6, 0.7, 0.5, 0.35, 0, Math.PI * 2);
    ctx.fill();

    // whiskers
    ctx.strokeStyle = withAlpha(suit.belly, 0.5);
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(19.2, -8.4); ctx.lineTo(23.6, -9.6);
    ctx.moveTo(19.2, -7.6); ctx.lineTo(23.4, -6.7);
    ctx.stroke();

    // eye — the Ghost skin's eyes burn spectral cyan
    if (suit.ghost) {
      ctx.fillStyle = withAlpha('#8ff4ff', 0.35);
      ctx.beginPath();
      ctx.arc(13.4, -13.0, 4.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = suit.ghost ? '#0f2a33' : '#181008';
    ctx.beginPath();
    ctx.arc(13.4, -13.0, 2.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.ghost ? '#8ff4ff' : '#fff';
    ctx.beginPath();
    ctx.arc(14.3, -13.9, 1.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(12.5, -11.9, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.furDark, 0.85);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(13.4, -13.0, 4.6, -2.5, -1.15);
    ctx.stroke();
  }

  // —— atmosphere ————————————————————————————————————————————
  function drawAura(color, t, seed) {
    const pulse = 0.88 + 0.12 * Math.sin(t * 1.7 + seed);
    const r = 42 * pulse;
    const g = ctx.createRadialGradient(0, -4, 8, 0, -4, r);
    g.addColorStop(0, withAlpha(color, 0.2));
    g.addColorStop(0.45, withAlpha(color, 0.08));
    g.addColorStop(1, withAlpha(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -4, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Cosmic dust drifting around the character. Positions come from the clock
  // so no per-instance state is needed and every shop cell can differ.
  function drawDust(color, t, seed, front) {
    const n = front ? 3 : 7;
    const off = (front ? 31 : 0) + seed * 3.7;
    for (let i = 0; i < n; i++) {
      const k = i * 1.9 + off;
      const a = t * 0.5 + k;
      const rad = 26 + 11 * Math.sin(t * 0.65 + k);
      const mx = Math.cos(a) * rad * 1.1;
      const my = -5 + Math.sin(a) * rad * 0.78;
      const tw = 0.5 + 0.5 * Math.sin(t * 2.1 + k * 2.2);
      ctx.globalAlpha = (front ? 0.55 : 0.8) * (0.2 + 0.6 * tw);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(mx, my, 0.7 + 1.5 * tw, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawThruster(f, suit) {
    const len = 10 + 16 * f;
    const g = ctx.createLinearGradient(-9, 15, -9 - len, 15);
    g.addColorStop(0, withAlpha(suit.trim, 0.95 * f));
    g.addColorStop(0.35, 'rgba(255,190,70,' + (0.85 * f) + ')');
    g.addColorStop(1, 'rgba(255,70,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-8, 12.5);
    ctx.quadraticCurveTo(-9 - len, 15.5, -8, 18.5);
    ctx.quadraticCurveTo(-5, 15.5, -8, 12.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,248,190,' + (0.9 * f) + ')';
    ctx.beginPath();
    ctx.moveTo(-8, 13.8);
    ctx.quadraticCurveTo(-10 - len * 0.45, 15.5, -8, 17.2);
    ctx.quadraticCurveTo(-6, 15.5, -8, 13.8);
    ctx.fill();
  }

  // —— helmet ————————————————————————————————————————————————
  const HELM_C = { x: 11, y: -11, r: 15.2 };

  function drawHelmet(helm, suit, t, seed) {
    const c = HELM_C;

    if (helm.glow) {
      const pulse = 0.9 + 0.1 * Math.sin(t * 2 + seed);
      const g = ctx.createRadialGradient(c.x, c.y, c.r * 0.85, c.x, c.y, c.r * 1.5 * pulse);
      g.addColorStop(0, withAlpha(helm.glow, 0.34));
      g.addColorStop(0.5, withAlpha(helm.glow, 0.12));
      g.addColorStop(1, withAlpha(helm.glow, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * 1.5 * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    // glass tint — kept light so the squirrel's face stays readable
    ctx.fillStyle = withAlpha(helm.visor, helm.tint);
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    // curved-glass depth toward the lower right
    const dg = ctx.createRadialGradient(c.x - 5, c.y - 6, 2, c.x + 2, c.y + 3, c.r);
    dg.addColorStop(0, 'rgba(255,255,255,0.1)');
    dg.addColorStop(0.55, 'rgba(255,255,255,0)');
    dg.addColorStop(1, withAlpha(helm.trim, 0.28));
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.clip();
    drawVisorArt(helm, t, seed);
    ctx.restore();

    // specular highlights
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.ellipse(c.x - 5.5, c.y - 6.5, 6.4, 4.8, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 2.6, -2.35, -1.15);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 2.6, -0.75, -0.15);
    ctx.stroke();

    // rim
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = withAlpha(helm.trim, 0.85);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 1.9, 0, Math.PI * 2);
    ctx.stroke();

    drawHelmetOrnament(helm, t, seed);

    // neck seal — opaque, so the dome reads as sitting on the suit
    ctx.fillStyle = suit.suitDark;
    roundRect(2.5, 0.5, 17, 7, 3.2);
    ctx.fill();
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = withAlpha(helm.rim, 0.45);
    ctx.beginPath();
    ctx.ellipse(11, 2.4, 7.2, 1.3, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i === 1 ? (helm.glow || helm.rim) : withAlpha(suit.trim, 0.9);
      ctx.beginPath();
      ctx.arc(6.5 + i * 4.5, 5.6, 1.0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawVisorArt(helm, t, seed) {
    const c = HELM_C;
    if (helm.id === 'ion') {
      ctx.strokeStyle = 'rgba(120,230,255,0.4)';
      ctx.lineWidth = 0.8;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(c.x - 14, c.y + i * 6 + 2);
        ctx.lineTo(c.x + 14, c.y + i * 6 - 2);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(140,240,255,0.6)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(c.x + 5, c.y - 5, 4.5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'nebula') {
      // Additive so it reads as a galaxy reflected in the glass rather than
      // paint covering the squirrel's face, and offset up-left off the face.
      ctx.globalCompositeOperation = 'lighter';
      const gx = c.x - 6, gy = c.y - 6;
      const g = ctx.createRadialGradient(gx, gy, 1, gx, gy, 13);
      g.addColorStop(0, 'rgba(150,80,170,0.5)');
      g.addColorStop(0.45, 'rgba(90,30,130,0.3)');
      g.addColorStop(1, 'rgba(40,10,70,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(gx, gy, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,130,220,0.5)';
      ctx.lineWidth = 1.2;
      for (let a = 0; a < 2; a++) {
        ctx.beginPath();
        for (let i = 0; i < 18; i++) {
          const th = i * 0.3 + a * Math.PI + t * 0.35;
          const rr = i * 0.44;
          const px = gx + Math.cos(th) * rr;
          const py = gy + Math.sin(th) * rr * 0.75;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    } else if (helm.id === 'lunar') {
      ctx.fillStyle = 'rgba(120,135,160,0.32)';
      const craters = [[-7, -10, 2.5], [1, -13, 1.9], [8, -10.5, 2.8], [-2, -7, 1.5], [12, -5, 2.1]];
      for (let i = 0; i < craters.length; i++) {
        ctx.beginPath();
        ctx.arc(c.x + craters[i][0], c.y + craters[i][1], craters[i][2], 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (helm.id === 'void') {
      // additive rings high on the dome, clear of the face
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(150,80,220,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y - 8, 10, 2.8, -0.3 + Math.sin(t * 0.4) * 0.06, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180,130,60,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y - 8, 6.4, 1.8, -0.3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'cherry') {
      ctx.strokeStyle = 'rgba(255,200,220,0.45)';
      ctx.lineWidth = 1.1;
      const pts = [[0, -12.5], [10, -4.5], [6, 8], [-6, 8], [-10, -4.5]];
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        if (i === 0) ctx.moveTo(c.x + pts[i][0], c.y + pts[i][1]);
        else ctx.lineTo(c.x + pts[i][0], c.y + pts[i][1]);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x + pts[i][0], c.y + pts[i][1]);
      }
      ctx.stroke();
    } else if (helm.id === 'solar') {
      ctx.strokeStyle = 'rgba(255,210,130,0.35)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(c.x + 2, c.y + 2, 4 + i * 4, -2.6, -0.6);
        ctx.stroke();
      }
    } else if (helm.id === 'royal') {
      ctx.strokeStyle = 'rgba(255,220,140,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 10.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6.5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'aurora') {
      // northern-lights curtains reflected in the glass
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = 'rgba(' + (60 + k * 30) + ',' + (200 - k * 25) + ',170,0.4)';
        ctx.lineWidth = 3.2 - k * 0.8;
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const px = c.x - 12 + i * 2;
          const py = c.y - 9 + k * 3.4 + Math.sin(i * 0.8 + t * 1.6 + k * 1.4) * 2.6;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    } else if (helm.id === 'meteor') {
      // shooting-star streaks
      ctx.strokeStyle = 'rgba(255,200,130,0.5)';
      ctx.lineWidth = 1.2;
      for (let k = 0; k < 3; k++) {
        const f = ((t * 0.8 + k * 0.37) % 1);
        const px = c.x + 11 - f * 22;
        const py = c.y - 11 + f * 15 + k * 2.5;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + 5.5, py - 4);
        ctx.stroke();
      }
    } else if (helm.id === 'chrono') {
      // ticking clock face
      ctx.strokeStyle = 'rgba(255,232,160,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x, c.y - 1, 8.5, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(c.x + Math.cos(a) * 7.2, c.y - 1 + Math.sin(a) * 7.2);
        ctx.lineTo(c.x + Math.cos(a) * 8.5, c.y - 1 + Math.sin(a) * 8.5);
        ctx.stroke();
      }
      const mins = Math.floor(t) % 60;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - 1);
      ctx.lineTo(c.x + Math.cos(t * 0.6) * 6.5, c.y - 1 + Math.sin(t * 0.6) * 6.5);
      ctx.moveTo(c.x, c.y - 1);
      ctx.lineTo(c.x + Math.cos(mins * 0.5) * 4.2, c.y - 1 + Math.sin(mins * 0.5) * 4.2);
      ctx.stroke();
    }
  }

  function drawHelmetOrnament(helm, t, seed) {
    const c = HELM_C;
    const id = helm.id;

    if (id === 'clear') {
      ctx.fillStyle = helm.trim;
      ctx.beginPath(); ctx.arc(c.x - 12.2, c.y + 6.4, 2.0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x - 13.8, c.y - 1, 1.6, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'ion') {
      const flick = 0.75 + 0.25 * Math.sin(t * 7 + seed);
      ctx.strokeStyle = helm.rim;
      ctx.lineWidth = 1.7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.x - 6, c.y - 13.5); ctx.lineTo(c.x - 8.5, c.y - 21);
      ctx.moveTo(c.x + 6, c.y - 13.5); ctx.lineTo(c.x + 8.5, c.y - 21);
      ctx.stroke();
      ctx.fillStyle = helm.glow;
      ctx.beginPath(); ctx.arc(c.x - 8.5, c.y - 22, 2.3 * flick, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x + 8.5, c.y - 22, 2.3 * flick, 0, Math.PI * 2); ctx.fill();
      // crackling arc between the tips, not a smooth handle
      ctx.strokeStyle = withAlpha(helm.glow, 0.85 * flick);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(c.x - 8.5, c.y - 22);
      const steps = 5;
      for (let i = 1; i <= steps; i++) {
        const px = c.x - 8.5 + (17 * i) / steps;
        const wob = (i % 2 ? -1 : 1) * (1.6 + 1.4 * Math.sin(t * 9 + i + seed));
        ctx.lineTo(px, c.y - 24.5 + wob);
      }
      ctx.stroke();

    } else if (id === 'solar') {
      ctx.fillStyle = helm.rim;
      const angles = [-1.15, -0.72, -0.29, 0.14, 0.57];
      for (let i = 0; i < angles.length; i++) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(angles[i]);
        ctx.beginPath();
        ctx.moveTo(-3.2, -c.r + 1.5);
        ctx.lineTo(0, -c.r - 7);
        ctx.lineTo(3.2, -c.r + 1.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = withAlpha('#ffe9a8', 0.9);
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 2.5, 2.0, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'nebula') {
      for (let i = 0; i < 3; i++) {
        const a = t * 0.9 + i * 2.1 + seed;
        const mx = c.x + Math.cos(a) * (c.r + 5);
        const my = c.y + Math.sin(a) * (c.r + 5) * 0.55;
        ctx.fillStyle = withAlpha('#ffd7ff', 0.85);
        ctx.beginPath(); ctx.arc(mx, my, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = withAlpha('#ffd7ff', 0.4);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(mx - 3.2, my); ctx.lineTo(mx + 3.2, my);
        ctx.moveTo(mx, my - 3.2); ctx.lineTo(mx, my + 3.2);
        ctx.stroke();
      }

    } else if (id === 'lunar') {
      ctx.fillStyle = helm.rim;
      roundRect(c.x - 6.5, c.y - c.r - 5, 13, 4.6, 2);
      ctx.fill();
      ctx.fillStyle = '#f2f6ff';
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 2.7, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = helm.trim;
      ctx.beginPath(); ctx.arc(c.x + 1.5, c.y - c.r - 3.3, 2.8, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'void') {
      // orbital rings ride high on the dome so they never cross the face
      const ry = c.y - 7;
      ctx.strokeStyle = withAlpha('#d4af37', 0.9);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(c.x, ry, c.r + 4, (c.r + 4) * 0.3, -0.34 + Math.sin(t * 0.5) * 0.05, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = withAlpha('#b45cff', 0.5);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(c.x, ry, c.r + 7, (c.r + 7) * 0.27, -0.34, 0, Math.PI * 2);
      ctx.stroke();

    } else if (id === 'comet') {
      const f = 0.85 + 0.15 * Math.sin(t * 6 + seed);
      ctx.fillStyle = helm.rim;
      ctx.beginPath();
      ctx.moveTo(c.x - 5, c.y - c.r + 1);
      ctx.quadraticCurveTo(c.x - 3, c.y - c.r - 11 * f, c.x + 3, c.y - c.r - 4.5);
      ctx.quadraticCurveTo(c.x + 5, c.y - c.r - 9 * f, c.x + 8, c.y - c.r + 2);
      ctx.quadraticCurveTo(c.x + 1, c.y - c.r - 3, c.x - 5, c.y - c.r + 1);
      ctx.fill();
      ctx.fillStyle = '#ffd77a';
      ctx.beginPath();
      ctx.moveTo(c.x - 2, c.y - c.r);
      ctx.quadraticCurveTo(c.x, c.y - c.r - 7 * f, c.x + 3, c.y - c.r - 1);
      ctx.quadraticCurveTo(c.x + 1, c.y - c.r - 3, c.x - 2, c.y - c.r);
      ctx.fill();
      for (let i = 0; i < 3; i++) {
        const k = (t * 1.4 + i * 0.7 + seed) % 1;
        ctx.fillStyle = withAlpha('#ff9a3c', 0.8 * (1 - k));
        ctx.beginPath();
        ctx.arc(c.x - 14 - k * 12, c.y - 8 + Math.sin(i * 2 + t * 3) * 3, 1.8 * (1 - k) + 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (id === 'cherry') {
      for (let i = 0; i < 4; i++) {
        const a = t * 0.7 + i * 1.6 + seed;
        const px = c.x + Math.cos(a) * (c.r + 6);
        const py = c.y + Math.sin(a * 1.1) * (c.r + 3) * 0.6;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a);
        ctx.fillStyle = withAlpha('#ffc2da', 0.9);
        ctx.beginPath();
        ctx.ellipse(0, 0, 2.5, 1.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = helm.rim;
      for (let i = 0; i < 5; i++) {
        const a = -1.9 + i * 0.42;
        ctx.beginPath();
        ctx.ellipse(c.x + Math.cos(a) * c.r, c.y + Math.sin(a) * c.r, 2.2, 1.4, a, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (id === 'royal') {
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.moveTo(c.x - 9.5, c.y - c.r + 2);
      ctx.lineTo(c.x - 7, c.y - c.r - 7.5);
      ctx.lineTo(c.x - 2.8, c.y - c.r - 2);
      ctx.lineTo(c.x, c.y - c.r - 10);
      ctx.lineTo(c.x + 2.8, c.y - c.r - 2);
      ctx.lineTo(c.x + 7, c.y - c.r - 7.5);
      ctx.lineTo(c.x + 9.5, c.y - c.r + 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fff0b8';
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.fillStyle = '#ff6080';
      ctx.beginPath(); ctx.arc(c.x - 7, c.y - c.r - 8, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#60c0ff';
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 10.6, 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7dffb0';
      ctx.beginPath(); ctx.arc(c.x + 7, c.y - c.r - 8, 1.5, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 3; i++) {
        const k = 0.5 + 0.5 * Math.sin(t * 3 + i * 2.1 + seed);
        const sx = c.x - 11 + i * 11;
        const sy = c.y - c.r - 13 - i * 1.5;
        ctx.strokeStyle = withAlpha('#ffe9a8', k);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx - 2.4 * k, sy); ctx.lineTo(sx + 2.4 * k, sy);
        ctx.moveTo(sx, sy - 2.4 * k); ctx.lineTo(sx, sy + 2.4 * k);
        ctx.stroke();
      }

    } else if (id === 'aurora') {
      // flowing light ribbon above the dome
      ctx.lineCap = 'round';
      for (let k = 0; k < 2; k++) {
        ctx.strokeStyle = withAlpha(k ? '#5dffd0' : '#8fffb8', 0.75 - k * 0.25);
        ctx.lineWidth = 2.4 - k;
        ctx.beginPath();
        for (let i = 0; i <= 14; i++) {
          const px = c.x - 14 + i * 2;
          const py = c.y - c.r - 5 - k * 3 + Math.sin(i * 0.55 + t * 2.2 + k) * 3.2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

    } else if (id === 'meteor') {
      // bronze rivets on the rim + two tiny orbiting rocks
      ctx.fillStyle = '#7a4a20';
      for (let i = 0; i < 4; i++) {
        const a = -2.2 + i * 0.55;
        ctx.beginPath();
        ctx.arc(c.x + Math.cos(a) * c.r, c.y + Math.sin(a) * c.r, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 2; i++) {
        const a = t * (i ? 1.1 : -0.8) + i * 2.6 + seed;
        const mx = c.x + Math.cos(a) * (c.r + 6);
        const my = c.y + Math.sin(a) * (c.r + 6) * 0.5;
        const rg = ctx.createRadialGradient(mx - 1, my - 1, 0.4, mx, my, 3);
        rg.addColorStop(0, '#c8a078');
        rg.addColorStop(1, '#5a3a1c');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.moveTo(mx + 2.6, my);
        ctx.lineTo(mx + 0.8, my - 2.4);
        ctx.lineTo(mx - 2.2, my - 1.2);
        ctx.lineTo(mx - 2.4, my + 1.6);
        ctx.lineTo(mx + 0.6, my + 2.5);
        ctx.closePath();
        ctx.fill();
      }

    } else if (id === 'chrono') {
      // brass gear crest, slowly turning
      const a0 = t * 0.9;
      const gx = c.x, gy = c.y - c.r - 6;
      ctx.fillStyle = '#c9a94f';
      for (let i = 0; i < 8; i++) {
        const a = a0 + (i / 8) * Math.PI * 2;
        ctx.save();
        ctx.translate(gx + Math.cos(a) * 5.5, gy + Math.sin(a) * 5.5);
        ctx.rotate(a);
        ctx.fillRect(-1.4, -1.6, 2.8, 3.2);
        ctx.restore();
      }
      const gg = ctx.createRadialGradient(gx - 1.5, gy - 1.5, 1, gx, gy, 6);
      gg.addColorStop(0, '#ffe9a8');
      gg.addColorStop(1, '#8a6a24');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(gx, gy, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a2c10';
      ctx.beginPath();
      ctx.arc(gx, gy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // The one entry point. Everything in the game draws the character through
  // this, which is what keeps the hangar and gameplay identical.
  function drawAstronaut(x, y, rot, scale, helm, suit, opts) {
    opts = opts || {};
    const flame = opts.flame || 0;
    const seed = opts.seed || 0;
    const t = performance.now() / 1000;

    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (scale !== 1) ctx.scale(scale, scale);

    if (suit.glow) drawAura(suit.glow, t, seed);
    if (suit.dust) drawDust(suit.dust, t, seed, false);
    if (flame > 0) drawThruster(flame, suit);
    drawTail(suit);
    drawSuitBody(suit);
    drawHead(suit);
    drawHelmet(helm, suit, t, seed);
    if (suit.dust) drawDust(suit.dust, t, seed, true);

    // protective bubble while carrying a shield acorn
    if (opts.shield) {
      const pu = 0.94 + 0.06 * Math.sin(t * 3.2 + seed);
      const r = 37 * pu;
      const g = ctx.createRadialGradient(0, -5, r * 0.6, 0, -5, r);
      g.addColorStop(0, 'rgba(93,255,158,0)');
      g.addColorStop(1, 'rgba(93,255,158,0.16)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, -5, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,255,190,0.75)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, -5, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, -5, r - 2.5, -2.3, -1.3);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawSquirrel(x, y, rot) {
    const flame = (flapBoost > 0 && (mode === 'play' || mode === 'ready')) ? flapBoost / 0.22 : 0;
    drawAstronaut(x, y, rot, 1, equippedHelmet(), equippedSuit(),
                  { flame: flame, seed: 0, shield: shieldCharges > 0 && (mode === 'play' || mode === 'ready') });
  }

  // Small acorn glyph for the HUD and shop headers — drawn rather than an
  // emoji, which renders differently on every platform.
  function drawAcornIcon(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#c47a28';
    ctx.beginPath();
    ctx.ellipse(0, 2.5, 4.6, 5.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8b060';
    ctx.beginPath();
    ctx.ellipse(-1.4, 1.4, 1.9, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6a3a10';
    ctx.beginPath();
    ctx.ellipse(0, -2.6, 5.8, 3.6, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-5.8, -3.2, 11.6, 1.8);
    ctx.strokeStyle = '#8a5a28';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -5.6);
    ctx.lineTo(0, -7.4);
    ctx.stroke();
    ctx.restore();
  }

  function drawHUD() {
    // score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(score), W / 2, 48);

    // high score
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BEST ' + save.highScore, W / 2, 68);

    // run acorns
    ctx.textAlign = 'left';
    ctx.font = '600 14px system-ui';
    ctx.fillStyle = '#ffd080';
    drawAcornIcon(22, 23, 1);
    ctx.fillText(String(runAcorns), 32, 28);

    // carried shield indicator — one ring per charge
    if (shieldCharges > 0) {
      for (let i = 0; i < shieldCharges; i++) {
        ctx.strokeStyle = 'rgba(140,255,190,0.9)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(22 + i * 23, 47, 9, 0, Math.PI * 2);
        ctx.stroke();
        drawAcornIcon(22 + i * 23, 46, 0.65);
      }
      ctx.fillStyle = '#8cffbe';
      ctx.font = '600 12px system-ui';
      ctx.fillText(shieldCharges > 1 ? 'x' + shieldCharges : 'SHIELD', 22 + shieldCharges * 23 - 8, 51);
    }

    // golden invulnerability timer
    if (invulnLeft > 0 && mode === 'play') {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd750';
      ctx.font = 'bold 14px system-ui';
      // drop below the mode's own status line: warp countdowns, Deep
      // Space's shift timer and Lost in Space's drift readout all own y=92
      ctx.fillText('GOLDEN  ' + Math.ceil(invulnLeft) + 's', W / 2,
                   (warpLeft > 0 || deepSpace || lostSpace) ? 112 : 92);
      ctx.textAlign = 'left';
    }

    // region banner when the environment shifts
    if (envMsgT > 0 && mode === 'play') {
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, envMsgT / 0.8);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '600 11px system-ui';
      ctx.fillText('ENTERING', W / 2, 108);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 17px system-ui';
      ctx.fillText(ENVS[envB].name, W / 2, 128);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }

    // warp status
    if (warpLeft > 0) {
      const ufoSlowing = save.equippedPal === 'ufo' && !deepSpace;
      ctx.textAlign = 'center';
      ctx.fillStyle = ufoSlowing ? '#6ef0ff' : '#c084fc';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText((deepSpace ? 'SHIFT  ' : 'BLACK HOLE  ') + Math.ceil(warpLeft) + 's' +
                   (ufoSlowing ? '  · UFO SLOW' : ''), W / 2, 92);
      ctx.textAlign = 'left';
    } else if (deepSpace && mode === 'play' && warpT === 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(192,132,252,0.75)';
      ctx.font = 'bold 12px system-ui';
      ctx.fillText('FIRST SHIFT IN ' + Math.ceil(Math.max(0, 10 - deepTimer)) + 's', W / 2, 92);
      ctx.textAlign = 'left';
    } else if (lostSpace && mode === 'play' && warpT === 0) {
      // live drift readout, plus which way the world currently runs
      const pct = Math.round((driftFactor - 1) * 100);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#6ef0d8';
      ctx.font = 'bold 12px system-ui';
      ctx.fillText('LOST IN SPACE · DRIFT ' + (pct >= 0 ? '+' : '') + pct + '%' +
                   (warpMirror ? ' · REVERSED' : ''), W / 2, 92);
      ctx.textAlign = 'left';
    }
    if (warpT > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = lostSpace ? '#6ef0d8' : '#c084fc';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText(lostSpace ? 'WORMHOLE!' : 'BLACK HOLE!', W / 2, H * 0.3);
      ctx.textAlign = 'left';
    }

    // recovery banner — labelled by whatever caused the recovery, so the
    // warp ending never claims a shield was spent
    if (warpT === 0 && recoveryMsg && (shieldFreeze > 0 || shieldSlow > 2.2)) {
      ctx.textAlign = 'center';
      ctx.fillStyle = recoveryMsg === 'SHIELD ABSORBED!' ? '#5dff9e' : '#c084fc';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText(recoveryMsg, W / 2, H * 0.3);
      ctx.font = '600 13px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('get ready…', W / 2, H * 0.3 + 22);
      ctx.textAlign = 'left';
    }

    // power-up timer
    if (powerLeft > 0) {
      const secs = Math.ceil(powerLeft);
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px system-ui';
      ctx.fillStyle = '#6ef0ff';
      ctx.fillText('⏱ SLOW  ' + secs + 's', W / 2, 92);
      // bar
      const bw = 120;
      const pct = powerLeft / POWER_DURATION;
      ctx.fillStyle = 'rgba(110,240,255,0.2)';
      ctx.fillRect(W / 2 - bw / 2, 100, bw, 5);
      ctx.fillStyle = '#6ef0ff';
      ctx.fillRect(W / 2 - bw / 2, 100, bw * pct, 5);
    }
  }

  // Tutorial prompts: full-screen holds for the two controls and the
  // companion reveal, light banners while flying between them.
  function drawTutorial() {
    const t = performance.now() / 1000;
    // the action cue fades in as the reading window ends
    const armA = tut.hold
      ? Math.max(0, Math.min(1, (tut.t - TUT_ARM) / 0.3)) : 1;
    if (tut.hold) {
      ctx.fillStyle = 'rgba(5,8,16,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      // the swipe prompt sits lower — the pilot is parked high after the
      // bounce, and the prompt shouldn't cover them
      const cy = tut.stage === 'swipe' ? H * 0.55 : H * 0.4;
      if (tut.stage === 'tap' || tut.stage === 'tap2') {
        // tap ripple glyph
        for (let i = 0; i < 2; i++) {
          const k = ((t * 0.9 + i * 0.5) % 1);
          ctx.strokeStyle = 'rgba(110,240,255,' + (0.7 * (1 - k)).toFixed(2) + ')';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(W / 2, cy - 60, 12 + k * 34, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = '#6ef0ff';
        ctx.beginPath();
        ctx.arc(W / 2, cy - 60, 10, 0, Math.PI * 2);
        ctx.fill();
        // up arrow
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(W / 2, cy - 118);
        ctx.lineTo(W / 2 + 11, cy - 100);
        ctx.lineTo(W / 2 + 4, cy - 100);
        ctx.lineTo(W / 2 + 4, cy - 88);
        ctx.lineTo(W / 2 - 4, cy - 88);
        ctx.lineTo(W / 2 - 4, cy - 100);
        ctx.lineTo(W / 2 - 11, cy - 100);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px system-ui';
        ctx.fillText(tut.stage === 'tap2' ? 'TAP AGAIN' : 'TAP', W / 2, cy + 4);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = '600 15px system-ui';
        ctx.fillText(tut.stage === 'tap2' ? 'one more boost — then just watch'
                                          : 'anywhere — a boost upward', W / 2, cy + 30);
        ctx.globalAlpha = armA * (0.7 + 0.3 * Math.sin(t * 4));
        ctx.fillStyle = '#6ef0ff';
        ctx.font = '600 13px system-ui';
        ctx.fillText('try it now', W / 2, cy + 62);
        ctx.globalAlpha = 1;
      } else if (tut.stage === 'swipe') {
        // swiping finger: a dot dragging a fading tail downward
        const k = (t * 0.8) % 1;
        const fy = cy - 110 + k * 64;
        ctx.strokeStyle = 'rgba(255,184,77,0.55)';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(W / 2, cy - 110);
        ctx.lineTo(W / 2, fy);
        ctx.stroke();
        ctx.fillStyle = '#ffb84d';
        ctx.beginPath();
        ctx.arc(W / 2, fy, 9, 0, Math.PI * 2);
        ctx.fill();
        // down arrow head
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(W / 2, cy - 30);
        ctx.lineTo(W / 2 + 10, cy - 46);
        ctx.lineTo(W / 2 - 10, cy - 46);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffb84d';
        ctx.font = 'bold 16px system-ui';
        ctx.fillText(tut.bounced ? 'BOUNCED TOO HIGH!' : 'FLYING TOO HIGH!', W / 2, cy - 26);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px system-ui';
        ctx.fillText('SWIPE DOWN', W / 2, cy + 4);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = '600 15px system-ui';
        ctx.fillText('dive back down and make the gap', W / 2, cy + 30);
        ctx.globalAlpha = armA * (0.7 + 0.3 * Math.sin(t * 4));
        ctx.fillStyle = '#ffb84d';
        ctx.font = '600 13px system-ui';
        ctx.fillText(tut.nudge > 0 ? 'drag downward — not a tap!' : 'try it now', W / 2, cy + 62);
        ctx.globalAlpha = 1;
      } else if (tut.stage === 'yourturn') {
        ctx.fillStyle = '#5dff9e';
        ctx.font = 'bold 26px system-ui';
        ctx.fillText('YOUR TURN!', W / 2, cy + 4);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = '600 15px system-ui';
        ctx.fillText('fly the gaps · grab the acorns', W / 2, cy + 30);
        ctx.fillText("hit debris? you're protected while learning", W / 2, cy + 52);
        ctx.globalAlpha = armA * (0.7 + 0.3 * Math.sin(t * 4));
        ctx.fillStyle = '#5dff9e';
        ctx.font = '600 13px system-ui';
        ctx.fillText('tap to begin', W / 2, cy + 86);
        ctx.globalAlpha = 1;
      } else if (tut.stage === 'pal') {
        drawPal('buddy', W / 2, cy - 70 + Math.sin(t * 2.4) * 4, 2.6, t);
        ctx.fillStyle = '#ffd080';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText('A COMPANION APPEARS!', W / 2, cy + 4);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = '600 14px system-ui';
        ctx.fillText('The Acorn Buddy reels in nearby acorns.', W / 2, cy + 28);
        ctx.fillText('Find more companions in the hangar.', W / 2, cy + 48);
        ctx.globalAlpha = armA * (0.7 + 0.3 * Math.sin(t * 4));
        ctx.fillStyle = '#6ef0ff';
        ctx.font = '600 13px system-ui';
        ctx.fillText('tap to continue', W / 2, cy + 80);
        ctx.globalAlpha = 1;
      }
      ctx.textAlign = 'left';
      return;
    }
    // flying banners
    ctx.textAlign = 'center';
    if (tut.stage === 'glide' || tut.stage === 'bounce') {
      ctx.fillStyle = '#ffb84d';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText(tut.stage === 'bounce' ? 'BOING! PLANETS BOUNCE YOU'
                                          : 'PLANET AHEAD — LAND ON IT', W / 2, 112);
    } else if (tut.stage === 'dive') {
      ctx.fillStyle = '#ffb84d';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText('MAKE THE GAP', W / 2, 112);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '600 12px system-ui';
      ctx.fillText('a tap levels you off', W / 2, 130);
    } else if (tut.stage === 'gates') {
      ctx.fillStyle = '#6ef0ff';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText('FLY THE GAPS · GRAB THE ACORNS', W / 2, 112);
      const done = Math.min(3, score - tut.g0);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < done ? '#6ef0ff' : 'rgba(110,240,255,0.25)';
        ctx.beginPath();
        ctx.arc(W / 2 - 22 + i * 22, 128, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (tut.stage === 'palDemo') {
      ctx.fillStyle = '#ffd080';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText('WATCH THE BUDDY MAGNET THE ACORNS', W / 2, 112);
    } else if (tut.stage === 'free') {
      ctx.globalAlpha = Math.min(1, (3 - tut.t) / 0.8);
      ctx.fillStyle = '#5dff9e';
      ctx.font = 'bold 24px system-ui';
      ctx.fillText("YOU'RE READY, PILOT!", W / 2, H * 0.32);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = '600 14px system-ui';
      ctx.fillText('The sky is yours. Good luck!', W / 2, H * 0.32 + 26);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'left';
  }

  function drawReady() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '600 18px system-ui';
    ctx.textAlign = 'center';
    const pulse = 0.85 + 0.15 * Math.sin(titlePulse * 4);
    ctx.globalAlpha = pulse;
    ctx.fillText('TAP TO FLY', W / 2, H * 0.38);
    ctx.globalAlpha = 1;
  }

  function drawDead() {
    ctx.fillStyle = 'rgba(5,8,16,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('CRASHED', W / 2, H * 0.36);
    ctx.font = '600 18px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Score  ' + score, W / 2, H * 0.36 + 36);
    ctx.fillStyle = '#ffd080';
    ctx.fillText('+' + runAcorns + ' acorns', W / 2, H * 0.36 + 62);
    if (score >= save.highScore && score > 0) {
      ctx.fillStyle = '#6ef0ff';
      ctx.font = '600 14px system-ui';
      ctx.fillText('NEW BEST', W / 2, H * 0.36 + 88);
    }

    // ——— the run's XP pours into the pilot meter ———
    const fillP = Math.min(1, Math.max(0, (deadTimer - 0.35) / 1.1));
    const shown = lastXpFrom + lastRunXp * fillP;
    const lv = levelForXp(shown);
    const into = shown - xpCumulative(lv);
    const need = lv >= MAX_LEVEL ? 1 : XP_STEPS[lv - 1];
    const bw2 = Math.min(230, W * 0.6);
    const bx2 = W / 2 - bw2 / 2, by2 = H * 0.36 + 122;
    ctx.fillStyle = '#c9b2ff';
    ctx.font = 'bold 15px system-ui';
    ctx.fillText('+' + lastRunXp + ' XP', W / 2, by2 - 12);
    ctx.fillStyle = 'rgba(160,120,255,0.18)';
    roundRect(bx2, by2, bw2, 10, 5);
    ctx.fill();
    ctx.fillStyle = '#a06bff';
    roundRect(bx2, by2, Math.max(4, bw2 * Math.min(1, into / need)), 10, 5);
    ctx.fill();
    ctx.font = 'bold 12px system-ui';
    ctx.fillStyle = '#e0d0ff';
    ctx.textAlign = 'right';
    ctx.fillText('LV ' + lv, bx2 - 8, by2 + 9);
    ctx.textAlign = 'left';
    if (lv < MAX_LEVEL) ctx.fillText('LV ' + (lv + 1), bx2 + bw2 + 8, by2 + 9);
    ctx.textAlign = 'center';

    // level-up: celebration burst plus the unlock reveal cards
    if (lastLevelTo > lastLevelFrom && fillP >= 1) {
      const pulse2 = 1 + 0.05 * Math.sin(deadTimer * 6);
      ctx.fillStyle = '#ffd23f';
      ctx.font = 'bold ' + Math.round(20 * pulse2) + 'px system-ui';
      ctx.fillText('PILOT LEVEL ' + lastLevelTo + '!', W / 2, by2 + 46);
      const gained = TRACK.filter(u => u.lvl > lastLevelFrom && u.lvl <= lastLevelTo);
      let uy = by2 + 72;
      gained.slice(0, 2).forEach((u) => {
        const kick = u.kind === 'mode' ? 'NEW MODE' : u.kind === 'pal' ? 'NEW COMPANION'
                   : u.kind === 'suit' ? 'SUIT UNLOCKED IN SHOP'
                   : u.kind === 'title' ? 'NEW TITLE' : 'NEW MOD';
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '600 10px system-ui';
        ctx.fillText(kick, W / 2, uy);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px system-ui';
        ctx.fillText('\u2605 ' + (trackName(u) || '').toUpperCase() + ' \u2605', W / 2, uy + 17);
        uy += 42;
      });
      if (gained.length > 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '600 11px system-ui';
        ctx.fillText('+' + (gained.length - 2) + ' more \u2014 see the FLIGHT LOG', W / 2, uy);
      }
    }

    if (deadTimer > 0.6) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '600 15px system-ui';
      ctx.fillText('tap to continue', W / 2,
                   Math.max(H * 0.62, H * 0.36 + (lastLevelTo > lastLevelFrom ? 305 : 170)));
    }
  }

  // Single source of truth for the title menu geometry — drawTitle renders
  // these rects and handleTap hit-tests the same ones, so the buttons and
  // their tap targets can never drift apart.
  function titleButtons() {
    const bw = Math.min(224, W * 0.6), bh = 50;
    const bx = W / 2;
    const y0 = H * 0.56;
    return [
      { id: 'fly',    x: bx, y: y0,       w: bw, h: bh, label: 'FLY' },
      { id: 'deep',   x: bx, y: y0 + 70,  w: bw, h: bh, label: 'DEEP SPACE' },
      { id: 'lost',   x: bx, y: y0 + 140, w: bw, h: bh, label: 'LOST IN SPACE' },
    ];
  }

  // The bottom bar: four round icons splitting the width — hangar,
  // flight log, social, help. Everything that isn't a game mode lives
  // down here now; the centre of the screen belongs to flying.
  function bottomIcons() {
    const y = H - 46, r = 26;
    return [
      { id: 'hangar', x: W * 0.14, y, r, label: 'HANGAR' },
      { id: 'log',    x: W * 0.38, y, r, label: 'LOG' },
      { id: 'social', x: W * 0.62, y, r, label: 'SOCIAL' },
      { id: 'help',   x: W * 0.86, y, r, label: 'HELP' },
    ];
  }

  function drawBottomBar() {
    for (const b of bottomIcons()) {
      ctx.fillStyle = 'rgba(140,170,220,0.13)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(160,190,230,0.3)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      if (b.id === 'hangar') iconHangar(b.x, b.y);
      else if (b.id === 'log') iconLog(b.x, b.y);
      else if (b.id === 'social') iconSocial(b.x, b.y);
      else {
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.font = 'bold 19px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', b.x, b.y + 1);
        ctx.textBaseline = 'alphabetic';
      }
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '600 8.5px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(b.label, b.x, b.y + b.r + 12);
    }
  }

  // mini roadmap glyph for the flight log
  function iconLog(cx, cy) {
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy - 10);
    ctx.lineTo(cx - 7, cy + 10);
    ctx.stroke();
    for (let i = -1; i <= 1; i++) {
      const ny = cy + i * 7;
      ctx.save();
      ctx.translate(cx - 7, ny);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = i === 0 ? '#ffb84d' : 'rgba(255,255,255,0.95)';
      ctx.fillRect(-2.6, -2.6, 5.2, 5.2);
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(cx - 1, ny);
      ctx.lineTo(cx + 9, ny);
      ctx.stroke();
    }
  }

  function drawTitle() {
    // decorative planets
