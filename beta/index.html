  const canvas = document.getElementById('c');

  // —— persistence ——
  // Beta uses its own save slot so testing never touches the live game's progress
  const SAVE_KEY = 'acornaut_beta';
  // Update this with every PR so a hard refresh is verifiable on the menu.
  const BETA_BUILD = 'PR #42';
  const HELMET_IDS = ['clear','ion','solar','nebula','lunar','void','comet','cherry','royal','aurora','meteor','chrono'];

  const TRAIL_IDS = ['sparks','ion','bubble','bloom','comet','prism','plasma','galaxy','aurora','frost','voidsmoke','supernova'];
  const PAL_IDS = ['none','bee','buddy','ufo','nutsack','meteorcore','cometsprite','pocketmoon','voidjelly','starpup','tinbot','wisp'];
  const defaultSave = () => ({
    highScore: 0,
    acorns: 0,
    startShield: false, // one-shot modifier: begin the next run shielded
    unlocked: ['clear'], // only Clear free — rest cost acorns
    equipped: 'clear',
    unlockedSuits: ['flight'],
    equippedSuit: 'flight',
    unlockedTrails: ['sparks'],
    equippedTrail: 'sparks',
    unlockedPals: ['none'],
    equippedPal: 'none',
    battery: false,   // shield battery mod: hold up to 3 charges
    deepBest: 0,      // best score in Deep Space Flight mode
    lostBest: 0,      // best score in Lost in Space mode
    xp: 0,            // lifetime pilot experience
    tutorialDone: false, // first-flight tutorial completed
  });
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      const s = parsed ? { ...defaultSave(), ...parsed } : defaultSave();
      // Ensure defaults; do not wipe purchased unlocks
      if (!Array.isArray(s.unlocked) || !s.unlocked.length) s.unlocked = ['clear'];
      if (!s.unlocked.includes('clear')) s.unlocked.unshift('clear');
      if (!Array.isArray(s.unlockedSuits) || !s.unlockedSuits.length) s.unlockedSuits = ['flight'];
      if (!s.unlockedSuits.includes('flight')) s.unlockedSuits.unshift('flight');
      if (!SUIT_IDS.includes(s.equippedSuit)) s.equippedSuit = 'flight';
      if (!Array.isArray(s.unlockedTrails) || !s.unlockedTrails.length) s.unlockedTrails = ['sparks'];
      if (!s.unlockedTrails.includes('sparks')) s.unlockedTrails.unshift('sparks');
      if (!TRAIL_IDS.includes(s.equippedTrail) || !s.unlockedTrails.includes(s.equippedTrail)) s.equippedTrail = 'sparks';
      if (!Array.isArray(s.unlockedPals) || !s.unlockedPals.length) s.unlockedPals = ['none'];
      if (!s.unlockedPals.includes('none')) s.unlockedPals.unshift('none');
      if (!PAL_IDS.includes(s.equippedPal) || !s.unlockedPals.includes(s.equippedPal)) s.equippedPal = 'none';
      if (!HELMET_IDS.includes(s.equipped)) s.equipped = 'clear';
      if (s.equipped !== 'clear' && !s.unlocked.includes(s.equipped)) s.equipped = 'clear';
      // Pilot Level migration: saves from before the XP system get a
      // one-time grant derived from lifetime stats. Uses PRE-floor acorns
      // (fresh saves start at level 1) and ~200 XP per owned shop item as
      // a stand-in for spent acorns (item tables initialise later).
      if (parsed && !(typeof parsed.xp === 'number' && isFinite(parsed.xp))) {
        const ownedExtra =
          Math.max(0, (s.unlocked || []).length - 1) +
          Math.max(0, (s.unlockedSuits || []).length - 1) +
          Math.max(0, (s.unlockedTrails || []).length - 1) +
          Math.max(0, (s.unlockedPals || []).length - 1);
        s.xp = Math.round(
          4 * ((s.highScore || 0) + (s.deepBest || 0) + (s.lostBest || 0)) +
          (s.acorns || 0) + 200 * ownedExtra);
      }
      // BETA ONLY: every tester keeps at least 10,000 acorns so the whole
      // shop stays purchasable. The release build must strip this floor.
      if (!(s.acorns >= 10000)) s.acorns = 10000;
      return s;
    } catch { return defaultSave(); }

  const XP_STEPS = [60, 100, 150, 200, 260, 320, 390, 460, 540, 620,

  function gapSpacing() {

  // 100% to 115% of the base spacing — never TIGHTER than the classic
  // rhythm, which got punishing fast. Lost in Space keeps the full
  // 85%–115% spread: the rotation there gives tight pairs room to read.
  function nextGapSpacing() {
    return lostSpace ? gapSpacing() * (0.85 + Math.random() * 0.3)
                     : gapSpacing() * (1 + Math.random() * 0.15);
  }

  function difficulty() {
    // slower ramp, hard plateau — reaches the caps around gate ~60 and
    // holds there until the overdrive begins stretching them at gate 100
    const t = Math.min(1, distance / 16000);
    const od = Math.min(1, Math.max(0, (score - OVERDRIVE_GATE) / OVERDRIVE_SPAN));
    return {
      speed: (BASE_SPEED + (MAX_SPEED - BASE_SPEED) * t) * (1 + 0.10 * od),
      gap: (GAP_BASE - (GAP_BASE - GAP_MIN) * t) * (1 - 0.20 * od),
    };
  }

  // Obstacle types for around-path seals (not planets)
  const OB_TYPES = ['asteroid','debris','satellite','ufo','crystal','rock','junk'];

  function makeObstacle(y, xOff) {
    // debris identity follows the environment the gate spawns into
    const env = ENVS[envIndexFor(score)];
    const pool = env.obTypes || OB_TYPES;
    const type = pool[Math.floor(Math.random() * pool.length)];
    // Larger hit/visual size so the flight lane is actually blocked
    const r = type === 'ufo' ? 24 + Math.random() * 5
            : type === 'satellite' ? 22 + Math.random() * 5
            : type === 'crystal' ? 20 + Math.random() * 5
            : type === 'debris' || type === 'junk' ? 19 + Math.random() * 5
            : 22 + Math.random() * 6;
    return {
      y, r, type,
      xOff: xOff,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.8,
      seed: Math.floor(Math.random() * 1000),
      env: Math.floor(score / ENV_GATES) % ENVS.length, // keeps its birth look
    };
  }

  // Fully seal the corridor ABOVE the top gate and BELOW the bottom gate.
  // Tight vertical packing in the flight lane so you cannot slip around.
  function sealBlockers(gapY, gap) {
    const topEdge = gapY - gap / 2 - PLANET_R * 2;
    const botEdge = gapY + gap / 2 + PLANET_R * 2;
    const blockers = [];
    // Step small enough that obstacle radii overlap the flight path
    const step = 30;
    // From just above top planet → screen top
    {
      let y = topEdge - 26;
      let n = 0;
      while (y > 20) {
        // tiny lateral jitter only — stay in the lane
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y -= step;
        n++;
        if (n > 12) break; // safety
      }
    }
    // From just below bottom planet → screen bottom
    {
      let y = botEdge + 26;
      let n = 0;
      while (y < H - 20) {
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y += step;
        n++;
        if (n > 12) break;
      }
    }
    return blockers;
  }

  function spawnPair(x) {
    const d = difficulty();
    // Main gap UNCHANGED — only seal the around-path above/below
    const gap = d.gap;
    const margin = 70;
    let gapCenter = margin + gap / 2 + Math.random() * (H - 2 * margin - gap);
    // Reachability clamp: the next gap must be within what the squirrel can
    // actually climb or dive in the time between gates. Without this, high
    // speed could demand a bottom-to-top transition faster than the flap
    // physics allow — difficulty should be a marathon, never impossible.
    // Clamp against the ACTUAL distance from the previous gate — spacing
    // is randomized now — and, in Lost in Space, against the drift's
    // FASTEST (+40%): always the worst case, never the average.
    const dx = Math.max(120, x - lastSpawnX);
    // Lost in Space stacks three post-spawn perturbations on top of the
    // clamp: the sway can pull neighbouring gates up to 48px CLOSER
    // (24px amplitude each), and the vertical drift can push their gaps
    // up to 30px further APART (15px each). At the drift's fastest, the
    // old clamp had zero margin left, so the worst phase alignment of
    // all three was flat-out impossible (~1 in 100 gates). Reserve that
    // headroom here: brutally hard stays the goal — impossible doesn't.
    const dxWorst = lostSpace ? Math.max(100, dx - 48) : dx;
    const dtGate = dxWorst / (d.speed * (lostSpace ? 1.4 : 1));
    const vMargin = lostSpace ? 30 : 0;
    const climb = Math.max(40, 230 * dtGate - vMargin);  // sustainable upward pace
    const dive = Math.max(60, 520 * dtGate - vMargin);   // gravity dive pace
    gapCenter = Math.max(lastGapY - climb, Math.min(lastGapY + dive, gapCenter));
    gapCenter = Math.max(margin + gap / 2, Math.min(H - margin - gap / 2, gapCenter));
    lastGapY = gapCenter;
    const kindA = Math.floor(Math.random() * 16);
    const kindB = Math.floor(Math.random() * 16);
    const blockers = sealBlockers(gapCenter, gap);
    const pair = {
      x, gapY: gapCenter, gap, r: PLANET_R,
      topKind: kindA, botKind: kindB, scored: false,
      blockers,
    };
    // Lost in Space: gates BREATHE — each pair sways on its own rhythm,
    // drifting toward and away from its neighbours (whole column moves,
    // debris included) to deepen the distortion.
    if (lostSpace) {
      pair.swayA = 12 + Math.random() * 12;
      pair.swayP = Math.random() * Math.PI * 2;
      pair.swayT = 0;
      pair.swayLast = 0;

    // moving target (strong); Lost in Space always has a subtle version.
    const wispPal = save.equippedPal === 'wisp';
    if (wispPal || lostSpace) {
      pair.vA = wispPal ? 22 + Math.random() * 8 : 9 + Math.random() * 6;
      pair.vR = wispPal ? 1.7 : 1.1;
      pair.vP = Math.random() * Math.PI * 2;
      pair.vT = 0;
      pair.vLast = 0;

    planets.push(pair);
    // Astro Bee's vanilla mode: nothing spawns at all
    const vanilla = save.equippedPal === 'bee';
    if (tut) {
      // tutorial gates ALWAYS carry an acorn — centred while learning,
      // pushed off the flight line during the magnet demo so the Buddy
      // has something to visibly reel in
      const off = tut.stage === 'palDemo' || tut.stage === 'pal'
        ? (Math.random() < 0.5 ? -1 : 1) * 85 : 0;
      acorns.push({
        x: x + 8,
        y: gapCenter + off,
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    } else if (!vanilla && Math.random() < 0.55) {
      acorns.push({
        x: x + 8,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.35),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    // —— special pickups: ONE universal roll ——
    // 1 in 10 gates spawns a special; which one is random among whatever
    // is currently eligible. Adding new specials never inflates the total
    // pickup population — they just share the same slot.
    // The Meteor Core's ability: specials surface twice as often.
    const specialChance = save.equippedPal === 'meteorcore' ? 0.2 : 0.1;
    if (!vanilla && !tut && Math.random() < specialChance) {
      // Tin Bot: no black holes, no wormholes — and no shields either
      const tinbot = save.equippedPal === 'tinbot';
      const kinds = tinbot ? ['slow', 'golden'] : ['slow', 'shield', 'golden'];
      // black holes are pointless while a warp is pending/active, in
      // Deep Space Flight (shifts come on a timer there), and in Lost in
      // Space (wormholes own the disorientation slot there)
      if (!tinbot && !deepSpace && !lostSpace && warpT === 0 && warpLeft === 0) kinds.push('blackhole');
      // Lost in Space: wormholes take the black hole's place, weighted
      // double — they are the mode's signature hazard
      if (!tinbot && lostSpace && warpT === 0) kinds.push('wormhole', 'wormhole');
      const kind = kinds[Math.floor(Math.random() * kinds.length)];
      const spec = {
        x: x + 30,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.25),
        got: false,
        bob: Math.random() * Math.PI * 2,
      };
      if (kind === 'slow') powerups.push(spec);
      else if (kind === 'shield') shields.push(spec);
      else if (kind === 'golden') goldens.push(spec);
      else if (kind === 'wormhole') wormholes.push(spec);
      else blackholes.push(spec);
    }
    lastSpawnX = x;
  }

  // Shared by taps and the keyboard: the tutorial's prompts intercept
  // input first, and every prompt stays deaf until its reading window
  // has passed.
  function playTap() {
    if (tut && tut.hold) {
      if (tut.t < TUT_ARM) return;   // still reading — not armed yet
      if (tut.stage === 'tap') {
        tut.hold = false; tut.stage = 'tapdone'; tut.t = 0;
        flap();
      } else if (tut.stage === 'tap2') {
        tut.hold = false; tut.stage = 'glide'; tut.t = 0;
        flap();                  // from THIS flap the scripted arc flies itself
      } else if (tut.stage === 'yourturn') {
        tut.hold = false; tut.stage = 'gates'; tut.t = 0; tut.g0 = score;
        // the controls are learned — persist NOW, so quitting mid-tutorial
        // never re-runs the whole thing on the next launch
        if (!save.tutorialDone) { save.tutorialDone = true; writeSave(save); }
      } else if (tut.stage === 'pal') {
        tut.hold = false; tut.stage = 'palDemo'; tut.t = 0; tut.g1 = score;
      } else if (tut.stage === 'swipe') {
        tut.nudge = Math.min(3, tut.nudge + 1);   // taps don't dive
      }
      return;
    }
    if (tut && (tut.stage === 'glide' || tut.stage === 'bounce')) {
      return;   // hands off — the bounce lesson flies itself
    }
    flap();
  }

  // —— input ——
  let swipe = null; // {y0, t0, fired} — tracks a possible downward swipe

  function onPointer(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const x = (t.clientX - rect.left) * (W / rect.width);
    const y = (t.clientY - rect.top) * (H / rect.height);
    if (mode === 'flightlog') flightDrag = { y0: y, s0: flightScroll };
    swipe = { y0: y, t0: performance.now(), fired: false };
    handleTap(x, y);
  }

  function onPointerMove(e) {
    if (mode === 'flightlog' && flightDrag) {
      const rect = canvas.getBoundingClientRect();
      const t = e.changedTouches ? e.changedTouches[0] : e;
      const yy = (t.clientY - rect.top) * (H / rect.height);
      flightScroll = Math.max(0, Math.min(
        Math.max(0, flightContentH() - (H - 150)),
        flightDrag.s0 - (yy - flightDrag.y0)));
      return;
    }
    if (!swipe || swipe.fired) return;
    const rect = canvas.getBoundingClientRect();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const y = (t.clientY - rect.top) * (H / rect.height);
    if (performance.now() - swipe.t0 > 300) { swipe = null; return; }
    if (y - swipe.y0 >= 35) {
      swipe.fired = true;
      bounceCancel();
    }
  }

  function onPointerUp() {
    swipe = null;
    flightDrag = null;
  }

  // Swipe down is a universal control:
  //  - during an upward planet bounce it CANCELS the launch (gentle settle)
  //  - anywhere else it's a DIVE tap — the downward mirror of the flap,
  //    added so floaty runs (Pocket Moon) can push down on demand.
  function startTutorial() {
    tut = { stage: 'intro', hold: false, t: 0, g0: 0, g1: 0, gD: 0, nudge: 0, springs: 0 };
    tutPending = false;
    buildTutorialCourse();
  }
  function tutSafe() { return !!tut && tut.stage !== 'free'; }
  function tutBuddy() { return !!tut && (tut.stage === 'pal' || tut.stage === 'palDemo'); }

  function tutGrav() {
    // an existing pilot may replay with a pal equipped — match live physics
    return GRAVITY * (save.equippedPal === 'pocketmoon' ? 0.85
                    : save.equippedPal === 'nutsack' ? 1.2 : 1);
  }

  // ——— THE SCRIPTED COURSE ———
  // One fixed environment, laid out in full before the first tap. The
  // world freezes under every prompt and glide taps are ignored, so the
  // guided beats fly ONE deterministic trajectory — computable up front:
  //   flap · 0.8s · [TAP] flap · 0.55s · [TAP AGAIN] flap · 0.9s glide
  //   → touchdown on the bounce planet → spring −640 to the apex freeze
  //   → [SWIPE] → dive into the gate already waiting below.
  // Nothing is moved, restaged or conjured mid-flight — the pilot sees
  // the whole road ahead, exactly like a real run.
  function buildTutorialCourse() {
    planets = [];
    acorns = [];
    powerups = []; shields = []; goldens = []; blackholes = []; wormholes = [];
    const sx = W * SQUIRREL_X;
    const g = tutGrav();
    const fv = FLAP * (save.equippedPal === 'nutsack' ? 0.71 : 1);
    const arc = (v, t) => v * t + 0.5 * g * t * t;
    const gap = 176;                      // a touch friendlier while learning
    const clampY = (y) => Math.max(70 + gap / 2, Math.min(H - 70 - gap / 2, y));
    const y0 = H * 0.45;                  // the squirrel's start line
    const y1 = y0 + arc(fv, 0.8);         // at the TAP prompt
    const y2 = y1 + arc(fv, 0.55);        // at the TAP AGAIN prompt
    const tLand = 0.9;
    const yLand = y2 + arc(fv, tLand);    // the fall meets the planet here
    const dLand = BASE_SPEED * (0.8 + 0.55 + tLand);
    const tApex = (640 - 60) / g;         // spring −640 up to the vy>−60 freeze
    const yApex = yLand - (640 * tApex - 0.5 * g * tApex * tApex);
    const dApex = dLand + BASE_SPEED * tApex;
    // the recovery gate: as deep below the apex as the screen allows
    const dyDive = Math.max(120, Math.min(352, (H - 70 - gap / 2) - yApex - 20));
    const tDive = (-380 + Math.sqrt(380 * 380 + 2 * g * dyDive)) / g;
    const mk = (dist, gapY, sealed) => {
      const pair = {
        x: sx + dist, gapY: clampY(gapY), gap, r: PLANET_R,
        topKind: Math.floor(Math.random() * 16),
        botKind: Math.floor(Math.random() * 16),
        scored: false,
        blockers: sealed ? sealBlockers(clampY(gapY), gap) : [],
      };
      planets.push(pair);
      return pair;
    };
    // 1 — the bounce planet: bottom surface exactly on the touchdown point
    mk(dLand, yLand + 6 - gap / 2, false);
    // 2 — the dive gate, sitting low, visible ahead from the apex freeze
    const d2 = dApex + BASE_SPEED * tDive;
    const p2 = mk(d2, yApex + dyDive, false);
    // 3–7 — practice gates: a climb back to the flight line, then gentle
    // alternation; full debris seals so they read as REAL gates (the
    // tutorial's resets protect every mistake)
    const path = [y0 + 80, y0 - 40, y0 + 60, y0 - 20, y0 + 40];
    let d = d2;
    const rest = [];
    for (const yy of path) {
      d += 260;
      rest.push(mk(d, yy, true));
    }
    // acorns: centred through the lesson, pushed off the flight line on
    // the last two gates so the Buddy has something to visibly reel in
    acorns.push({ x: p2.x + 8, y: p2.gapY, got: false,
                  bob: Math.random() * Math.PI * 2 });
    for (let i = 0; i < rest.length; i++) {
      const off = i >= 3 ? (i % 2 ? -1 : 1) * 85 : 0;
      acorns.push({ x: rest[i].x + 8, y: rest[i].gapY + off, got: false,
                    bob: Math.random() * Math.PI * 2 });
    }
    // hand the reins to the normal spawner beyond the course
    lastSpawnX = d;
    lastGapY = rest[rest.length - 1].gapY;
  }

  function tickTutorial(dt) {
    tut.t += dt;
    if (tut.stage === 'intro' && tut.t > 0.8) {
      tut.stage = 'tap'; tut.hold = true; tut.t = 0;
    } else if (tut.stage === 'tapdone' && tut.t > 0.55) {
      tut.stage = 'tap2'; tut.hold = true; tut.t = 0;
    } else if (tut.stage === 'glide') {
      if (bounceUp && !tut.bounced) {
        tut.bounced = true;
        tut.stage = 'bounce'; tut.t = 0;
        // make the demo launch cinematic — a strong, readable spring
        squirrel.vy = -640;
      } else if (tut.t > 1.6) {
        // the touchdown was due at 0.9s — a missed beat (odd frame
        // pacing, a resize) must not strand the lesson: spring up anyway
        // and carry on to the swipe. The world itself never rearranges.
        tut.bounced = true;
        tut.stage = 'bounce'; tut.t = 0;
        bounceUp = false;
        squirrel.vy = -640;
      }
    } else if (tut.stage === 'bounce') {
      // let the WHOLE launch play out and freeze at the top of the arc,
      // squirrel parked high above the planet it just bounced off. If the
      // apex is still low (a floor-level rescue), boing again — the swipe
      // prompt must always fire with real room to dive below.
      if (squirrel.vy > -60 || tut.t > 1.1) {
        if (squirrel.y > H * 0.55 && tut.springs < 5) {
          tut.springs += 1;
          squirrel.vy = -640;
          tut.t = 0;
        } else {
          tut.stage = 'swipe'; tut.hold = true; tut.t = 0;
        }
      }
    } else if (tut.stage === 'dive' && (score - tut.gD >= 1 || tut.t > 3)) {
      tut.stage = 'yourturn'; tut.hold = true; tut.t = 0;
    } else if (tut.stage === 'gates' && score - tut.g0 >= 3) {
      tut.stage = 'pal'; tut.hold = true; tut.t = 0;
    } else if (tut.stage === 'palDemo' && score - tut.g1 >= 2) {
      tut.stage = 'free'; tut.t = 0;
      save.tutorialDone = true;   // seen everything — never again
      writeSave(save);
    } else if (tut.stage === 'free' && tut.t > 3) {
      tut = null;
    }
  }

  function bounceCancel() {
    if (mode !== 'play') return;
    // tutorial: the swipe prompt waits for exactly this gesture
    if (tut && tut.hold && tut.stage === 'swipe') {
      if (tut.t < TUT_ARM) return;   // still reading — not armed yet
      tut.hold = false; tut.stage = 'dive'; tut.t = 0; tut.gD = score;
      bounceUp = false;          // the launch is cancelled — that's the lesson
      squirrel.vy = 380;
      squirrel.rot = 0.5;
      return;
    }
    if (tut && (tut.stage === 'glide' || tut.stage === 'bounce')) return;
    if (!bounceUp || hitCooldown <= 0) {
      // dive tap
      squirrel.vy = 380;
      squirrel.rot = 0.5;
      const dx = W * SQUIRREL_X;
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: dx + (Math.random() - 0.5) * 14,
          y: squirrel.y - 16,
          vx: (Math.random() - 0.5) * 50,
          vy: -50 - Math.random() * 50,
          life: 0.2 + Math.random() * 0.12,
          max: 0.32,
          r: 1.4 + Math.random() * 1.8,
          kind: 'poof',
        });
      }
      return;
    }
    bounceUp = false;
    squirrel.vy = 210;
    squirrel.rot = 0.35;
    const sx = W * SQUIRREL_X;
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: sx + (Math.random() - 0.5) * 14,
        y: squirrel.y - 14,
        vx: (Math.random() - 0.5) * 60,
        vy: -40 - Math.random() * 60,
        life: 0.25 + Math.random() * 0.15,
        max: 0.4,
        r: 1.5 + Math.random() * 2,
        kind: 'poof',
      });
    }
  }
  function handleTap(x, y) {
    if (mode === 'title') {
      for (const b of titleButtons()) {
        if (hit(x, y, b)) {
          if (b.id === 'fly') {
            resetRun(false); mode = 'ready';
            if (!save.tutorialDone || tutPending) startTutorial();
          }
          else if (b.id === 'deep') {
            if (deepSpaceUnlocked()) { resetRun(true); mode = 'ready'; }
          }
          else if (b.id === 'lost') {
            if (lostSpaceUnlocked()) { resetRun('lost'); mode = 'ready'; }
          }
          return;
        }
      }
      for (const b of bottomIcons()) {
        if (Math.hypot(x - b.x, y - b.y) < b.r + 8) {
          if (b.id === 'hangar') mode = 'hangar';
          else if (b.id === 'log') openFlightLog();
          else if (b.id === 'social') mode = 'social';
          else mode = 'help';
          return;
        }
      }
      return;
    }
    if (mode === 'help' || mode === 'social' || mode === 'flightlog') {
      const back = { x: 56, y: 44, w: 80, h: 36 };
      if (hit(x, y, back)) { mode = 'title'; return; }
      if (mode === 'help' && hit(x, y, helpReplayBtn())) {
        resetRun(false);
        mode = 'ready';
        startTutorial();
      }
      return;
    }
    if (mode === 'hangar') {
      const back = { x: 56, y: 44, w: 80, h: 36 };
      if (hit(x, y, back)) { mode = 'title'; return; }
      for (const t of shopTabRects()) {
        if (hit(x, y, t)) { shopTab = t.id; return; }
      }
      const roster = shopRoster();
      if (roster) {
        roster.list.forEach((item, i) => {
          const c = shopCellRect(i);
          if (Math.hypot(x - c.x, y - c.y) < 46) {
            if (roster.kind === 'pal') {
              // pals unlock by pilot level — the level is the price
              if (palUnlocked(item.id)) {
                if (!save.unlockedPals.includes(item.id)) save.unlockedPals.push(item.id);
                save.equippedPal = item.id;
                writeSave(save);
              }
            } else if (save[roster.own].includes(item.id)) {
              save[roster.eq] = item.id;
              writeSave(save);
            } else if (roster.kind === 'suit' && !suitRevealed(item.id)) {
              // premium skin still sealed behind its level
            } else if (save.acorns >= item.cost) {
              save.acorns -= item.cost;
              save[roster.own].push(item.id);
              save[roster.eq] = item.id;
              writeSave(save);
            }
          }
        });
      } else if (shopTab === 'mods') {
        const card = { x: W / 2, y: SHOP_GRID_Y + 62, w: W - 48, h: 124 };
        if (hit(x, y, card) && startShieldUnlocked() && !save.startShield && save.acorns >= MOD_SHIELD_COST) {
          save.acorns -= MOD_SHIELD_COST;
          save.startShield = true;
          writeSave(save);
        }
        const bcard = { x: W / 2, y: SHOP_GRID_Y + 140 + 62, w: W - 48, h: 124 };
        if (hit(x, y, bcard) && batteryUnlocked() && !save.battery &&
            save.acorns >= MOD_BATTERY_COST) {
          save.acorns -= MOD_BATTERY_COST;
          save.battery = true;
          writeSave(save);
        }
      }
      return;
    }
    if (mode === 'ready' || mode === 'play') {
      playTap();
      return;
    }
    if (mode === 'dead') {
      if (deadTimer > 0.6) bankRun();
    }
  }
  // End-of-run banking, shared by tap and keyboard paths. The start-shield
  // modifier is single-purchase: it expires when the run it armed ends,
  // whether or not the shield was used.
  function bankRun() {
    save.acorns += runAcorns;
    if (deepSpace) {
      if (score > (save.deepBest || 0)) save.deepBest = score;
    } else if (lostSpace) {
      if (score > (save.lostBest || 0)) save.lostBest = score;
    } else if (score > save.highScore) save.highScore = score;
    if (startShieldArmed) save.startShield = false; // only consumed if it fired
    writeSave(save);
    mode = 'title';
  }

  function hit(x, y, b) {
    return x > b.x - b.w / 2 && x < b.x + b.w / 2 && y > b.y - b.h / 2 && y < b.y + b.h / 2;
  }

  canvas.addEventListener('pointerdown', onPointer, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (mode === 'title') {
        resetRun(); mode = 'ready';
        if (!save.tutorialDone || tutPending) startTutorial();
      }
      else if (mode === 'ready' || mode === 'play') playTap();
      else if (mode === 'dead' && deadTimer > 0.6) bankRun();
    }
  });

  // —— update ——
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    titlePulse += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    // ambient stars
    for (const s of stars) s.tw += dt * 2;

    // environment shifts with progress and crossfades over a couple of
    // seconds; a short banner announces the new region mid-run
    const envTarget = envIndexFor(score);
    if (envTarget !== envB) {
      envA = envB;
      envB = envTarget;
      envBlend = 0;
      envMsgT = mode === 'play' ? 3 : 0;
    }
    if (envBlend < 1) envBlend = Math.min(1, envBlend + dt / 2);
    if (envMsgT > 0) envMsgT = Math.max(0, envMsgT - dt);

    if (mode === 'play') {
      // The Mini UFO's ability: inside a black-hole warp (not Deep Space's
      // timed shifts) it slows time for the whole ride, like a slow acorn.
      const ufoSlow = save.equippedPal === 'ufo' && !deepSpace && warpLeft > 0;
      const slow = (powerLeft > 0 || shieldSlow > 0 || ufoSlow) ? SLOW_FACTOR : 1;
      let simDt = dt * slow;

      // Shield aftermath: a short full freeze, then a slow-motion window.
      // The freeze runs on real time; the slow timer starts once it ends.
      if (shieldFreeze > 0) {
        shieldFreeze = Math.max(0, shieldFreeze - dt);
        simDt = 0;
      } else if (shieldSlow > 0) {
        shieldSlow = Math.max(0, shieldSlow - dt);
      }

      if (tut) {
        // the tutorial clock pauses with the world during a reset freeze —
        // otherwise the bounce/apex beats burn out while physics sleep
        tickTutorial(shieldFreeze > 0 ? 0 : dt);
        if (tut && tut.hold) simDt = 0;   // the world waits for the pilot
      }
      if (powerLeft > 0) {
        powerLeft = Math.max(0, powerLeft - dt);
      }
      if (absorbGrace > 0) absorbGrace = Math.max(0, absorbGrace - dt);
      if (invulnLeft > 0) invulnLeft = Math.max(0, invulnLeft - dt);

      // Deep Space Flight: the first orientation shift arrives 10s in;
      // after that the warp-expiry chain keeps them coming back to back.
      if (deepSpace && warpT === 0 && warpLeft === 0) {
        deepTimer += dt;
        if (deepTimer >= 10) {
          pickWarpVariant();
          warpT = 1.0;
        }
      }

      // Black-hole warp: a one-second swirl (world frozen), then 15s of
      // mirrored, tilted flight, ended with the shield-style recovery.
      if (warpT > 0) {
        // Deep Space runs its swirl at double speed — shifts come every
        // 10s there, so the transition can't eat the flying time.
        warpT = Math.max(0, warpT - dt * (deepSpace ? 2 : 1));
        simDt = 0;
        if (warpT === 0) enterWarp();
      } else if (warpLeft > 0) {
        warpLeft = Math.max(0, warpLeft - dt);
        if (warpLeft === 0) exitWarp();
      }

      const d = difficulty();
      speed = d.speed;

      // Lost in Space: the scroll never holds a rhythm. Two slow sine
      // waves beat against each other so the speed wanders anywhere from
      // −40% to +40% of normal — gradual enough to feel like a current,
      // fast enough that you must keep re-reading your approach speed.
      if (lostSpace) {
        driftPhase += simDt;
        driftFactor = 1 + 0.40 * (0.62 * Math.sin(driftPhase * 0.42) +
                                  0.38 * Math.sin(driftPhase * 0.11 + 2.1));
        // the world visibly ROTATES, sweeping between −40° and +40° —
        // paused only while a wormhole swirl owns the screen
        tiltPhase += simDt;
        warpTilt = lostTiltAt(tiltPhase);
        // gate sway: applied as a delta so the scroll math stays untouched
        for (const p of planets) {
          if (p.swayA) {
            p.swayT += simDt;
            const s = Math.sin(p.swayT * 0.9 + p.swayP) * p.swayA;
            p.x += s - p.swayLast;
            p.swayLast = s;
          }
        }
      }

      // Pocket Moon floats (0.85x); the Nut-Sack is heavy (1.2x) — part of
      // its price for double acorns
      const grav = GRAVITY * (save.equippedPal === 'pocketmoon' ? 0.85
                            : save.equippedPal === 'nutsack' ? 1.2 : 1);
      squirrel.vy += grav * simDt;
      squirrel.y += squirrel.vy * simDt;
      squirrel.rot = Math.max(-0.55, Math.min(0.9, squirrel.vy / 700));

      if (flapBoost > 0) flapBoost = Math.max(0, flapBoost - dt);

      const move = speed * (lostSpace ? driftFactor : 1) * simDt;
      distance += move;

      for (const p of planets) p.x -= move;
      for (const a of acorns) { a.x -= move; a.bob += dt * 4; }
      for (const a of powerups) { a.x -= move; a.bob += dt * 5; }
      for (const a of shields) { a.x -= move; a.bob += dt * 3; }
      for (const a of goldens) { a.x -= move; a.bob += dt * 3.6; }
      for (const a of blackholes) { a.x -= move; a.bob += dt * 2.2; }
      for (const a of wormholes) { a.x -= move; a.bob += dt * 2.4; }

      // vertical gate drift (Nebula Wisp everywhere, Lost in Space always):
      // applied as a delta to the whole column, debris included, so the
      // scroll and collision math stay untouched
      for (const p of planets) {
        if (!p.vA) continue;
        p.vT += simDt;
        const s = Math.sin(p.vT * p.vR + p.vP) * p.vA;
        const dy = s - p.vLast;
        p.gapY += dy;
        for (const b of (p.blockers || [])) b.y += dy;
        p.vLast = s;
      }

      // spawn — scroll tracker, keep at least one planet ahead
      lastSpawnX -= move;
      while (lastSpawnX < W + 80) {
        spawnPair(lastSpawnX + nextGapSpacing());
      }

      // cull
      planets = planets.filter(p => p.x > -80);
      acorns = acorns.filter(a => a.x > -40 && !a.got);
      powerups = powerups.filter(a => a.x > -40 && !a.got);
      shields = shields.filter(a => a.x > -40 && !a.got);
      goldens = goldens.filter(a => a.x > -40 && !a.got);
      blackholes = blackholes.filter(a => a.x > -40 && !a.got);
      wormholes = wormholes.filter(a => a.x > -40 && !a.got);

      // score
      const sx = W * SQUIRREL_X;
      for (const p of planets) {
        if (!p.scored && p.x + p.r < sx - 12) {
          p.scored = true;
          score += 1;
        }
      }

      // collisions — circle approx on squirrel
      const sr = 16;
      const sy = squirrel.y;
      // off screen
      if (hitCooldown > 0) hitCooldown = Math.max(0, hitCooldown - simDt);
      if (hitCooldown <= 0) bounceUp = false;

      // Ceiling bounces you back down — only debris is lethal up there.
      // Falling off the bottom of the screen still ends the run.
      if (sy < sr && squirrel.vy < 0) {
        squirrel.y = sr;
        squirrel.vy = Math.abs(squirrel.vy) * 0.45 + 90;
        squirrel.rot = 0.5;
        spark(sx, 4, 'poof');
      }
      if (sy > H + 30) {
        if (tutSafe()) {
          if (tut.stage === 'dive' || tut.stage === 'gates' ||
              tut.stage === 'palDemo') {
            // practice time: scoop them straight back onto the flight
            // line — no floundering along the floor
            tutReset(sx, H + 10);
          } else {
            squirrel.y = H - 30;
            squirrel.vy = -320;
            squirrel.rot = -0.3;
          }
        } else {
          die(); return;
        }
      }

      // Debris ALWAYS kills — checked first, every frame, no cooldown.
      // (The bounce cooldown below only stops planet bounces re-triggering;
      // it must never grant safe passage through obstacles.)
      // Exceptions: a carried shield charge absorbs exactly one hit, a
      // short post-absorb grace (blinking squirrel) stops the recovery from
      // chain-draining every charge, and GOLDEN invulnerability phases
      // through everything — though the bottom of the screen still kills.
      if (absorbGrace <= 0 && invulnLeft <= 0) {
        for (const p of planets) {
          for (const b of (p.blockers || [])) {
            const bx = p.x + (b.xOff || 0);
            if (circleHit(sx, sy, sr, bx, b.y, b.r * 0.92)) {
              if (tutSafe()) {
                if (hitCooldown <= 0 && shieldFreeze <= 0) tutReset(bx, b.y);
                continue;
              }
              if (shieldCharges > 0) { absorbShield(bx, b.y); return; }
              die(); return;
            }
          }
        }
      }

      // Main planets: recoverable bounce. During the bounce cooldown the
      // planets stay SOLID — the squirrel is pushed out of any overlap
      // instead of re-bounced. Golden invulnerability does NOT phase
      // through planets: bounces are a flow mechanic pilots plan around,
      // and losing them mid-golden broke the timing constantly. Only
      // debris phases.
      outer:
      for (const p of planets) {
        const topY = p.gapY - p.gap / 2 - p.r;
        const botY = p.gapY + p.gap / 2 + p.r;
        for (const gy of [topY, botY]) {
          if (circleHit(sx, sy, sr, p.x, gy, p.r * 0.92)) {
            if (hitCooldown <= 0) { bounceOff(p.x, gy); break outer; }
            pushOut(p.x, gy, p.r * 0.92, sr);
          }
        }
      }

      // companion drifts along beside the squirrel
      if (save.equippedPal !== 'none' || tutBuddy()) {
        const tx = sx - 42;
        const ty = sy - 22 + Math.sin(performance.now() / 1000 * 2.6) * 7;
        const k = Math.min(1, dt * (pal.dart > 0 ? 14 : 5));
        pal.x += (tx - pal.x) * k;
        pal.y += (ty - pal.y) * k;
        if (pal.dart > 0) pal.dart = Math.max(0, pal.dart - dt);
      }

      // acorn collect — the Acorn Buddy stretches the grab radius and darts
      // out to fetch anything inside it
      // The Acorn Buddy is a magnet: any standard acorn that comes within
      // range — including ones that just slipped past — is DRAGGED toward
      // the squirrel until it lands in the normal pickup radius. The pull
      // outruns the world scroll, so near-misses behind you get reeled in.
      const buddyOn = save.equippedPal === 'buddy' || tutBuddy();
      const MAGNET_R = 200;      // realistic miss distances are 150-250px
      const MAGNET_PULL = 560;
      for (const a of acorns) {
        if (a.got) continue;
        let ay = a.y + Math.sin(a.bob) * 4;
        let d = Math.hypot(sx - a.x, sy - ay);
        // Sticky: once hooked, an acorn stays hooked until collected, even
        // if the squirrel darts away — what the magnet touched, it keeps.
        if (buddyOn && (d < MAGNET_R || a.pulled) && d > 1) {
          const pull = Math.min(d, MAGNET_PULL * simDt);
          a.x += ((sx - a.x) / d) * pull;
          a.y += ((sy - ay) / d) * pull;
          a.pulled = true;
          // gold streak so the reel-in reads clearly
          if (Math.random() < 0.35) {
            particles.push({
              x: a.x, y: a.y,
              vx: ((sx - a.x) / d) * 140 + (Math.random() - 0.5) * 30,
              vy: ((sy - ay) / d) * 140 + (Math.random() - 0.5) * 30,
              life: 0.22 + Math.random() * 0.12,
              max: 0.34,
              r: 1.2 + Math.random() * 1.6,
              kind: 'gold',
            });
          }
          ay = a.y + Math.sin(a.bob) * 4;
          d = Math.hypot(sx - a.x, sy - ay);
        }
        if (d < 28) {
          a.got = true;
          runAcorns += save.equippedPal === 'nutsack' ? 2 : 1;
          if (a.pulled) {
            pal.x = a.x;
            pal.y = a.y;
            pal.dart = 0.35;
          }
          spark(a.x, a.y, 'gold');
        }
      }
      for (const a of powerups) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 5)) < 30) {
          a.got = true;
          // the Comet Sprite stretches slow time to double length
          powerLeft = POWER_DURATION * (save.equippedPal === 'cometsprite' ? 2 : 1);
          spark(a.x, a.y, 'cyan');
        }
      }
      for (const a of shields) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 30) {
          a.got = true;
          // the Nut-Sack and Tin Bot can't hold a shield — the pickup fizzles
          if (save.equippedPal !== 'nutsack' && save.equippedPal !== 'tinbot') {
            shieldCharges = Math.min(maxShieldCharges(), shieldCharges + 1);
          }
          spark(a.x, a.y, 'shield');
        }
      }
      for (const a of goldens) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 30) {
          a.got = true;
          // Star Pup: golden invulnerability lasts twice as long
          invulnLeft = save.equippedPal === 'starpup' ? 20 : 10;
          spark(a.x, a.y, 'gold');
          spark(a.x, a.y, 'gold');
        }
      }
      for (const a of blackholes) {
        if (!a.got && warpT === 0 && warpLeft === 0 &&
            Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 30) {
          a.got = true;
          warpT = 1.0;                                  // swirl begins
          // five equally likely disorientations:
          //   0 backward · 1 backward tilt-up · 2 backward tilt-down
          //   3 forward tilt-up · 4 forward tilt-down
          pickWarpVariant();
          spark(a.x, a.y, 'warp');
        }
      }
      // Wormholes (Lost in Space): the swirl transition plays, then the
      // scroll direction MIRRORS — and stays mirrored until the next
      // wormhole flips it back. The tilt re-rolls too; it never rests.
      for (const a of wormholes) {
        if (!a.got && warpT === 0 &&
            Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 30) {
          a.got = true;
          prevMirror = warpMirror;
          prevTilt = warpTilt;
          warpMirror = !warpMirror;
          warpT = 1.0;
          spark(a.x, a.y, 'warp');
        }
      }
    }

    if (mode === 'dead') {
      deadTimer += dt;
      squirrel.vy += GRAVITY * dt * 0.6;
      squirrel.y += squirrel.vy * dt;
      squirrel.rot = Math.min(1.2, squirrel.rot + dt * 2);
    }

    // particles
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.kind === 'flame') p.vy -= 40 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function circleHit(x1, y1, r1, x2, y2, r2) {
    return Math.hypot(x1 - x2, y1 - y2) < r1 + r2;
  }

  // Resolve overlap with a planet without applying a new impulse: move the
  // squirrel to the surface along its (fixed) x column and cancel velocity
  // into the planet.
  function pushOut(px, py, pr, sr) {
    const sx = W * SQUIRREL_X;
    const rr = pr + sr;
    const dx = sx - px;
    if (Math.abs(dx) >= rr) return;
    const dyNeed = Math.sqrt(rr * rr - dx * dx);
    const above = squirrel.y <= py;
    squirrel.y = above ? py - dyNeed : py + dyNeed;
    if (above ? squirrel.vy > 0 : squirrel.vy < 0) squirrel.vy = 0;
  }

  // One of five equally likely disorientations:
  //   0 backward · 1 backward tilt-up · 2 backward tilt-down
  //   3 forward tilt-up · 4 forward tilt-down
  function pickWarpVariant() {
    const variant = Math.floor(Math.random() * 5);
    warpMirror = variant < 3;
    const TILT = 25 * Math.PI / 180;
    warpTilt = variant === 0 ? 0
             : (variant === 1 || variant === 3) ? TILT : -TILT;
  }

  // Warp start: same fairness treatment as the shield recovery — recenter
  // the squirrel, vaporise debris around the respawn point, brief freeze.
  function enterWarp() {
    const sx = W * SQUIRREL_X;
    const cy = safeRespawnY();
    for (const p of planets) {
      p.blockers = (p.blockers || []).filter(b =>
        Math.hypot(p.x + (b.xOff || 0) - sx, b.y - cy) > 150);
    }
    squirrel.y = cy;
    squirrel.vy = 0;
    squirrel.rot = 0;
    hitCooldown = 0;
    // Lost in Space: no countdown — the new orientation simply IS the
    // orientation now, until the next wormhole. Deep Space shifts every
    // 10s with a snappier recovery; everywhere else it's the 15s clock.
    warpLeft = lostSpace ? 0 : deepSpace ? 10 : 15;
    shieldFreeze = deepSpace ? 0.2 : 0.4;
    absorbGrace = deepSpace ? 0.9 : 1.6;
    spark(sx, cy, 'warp');
  }

  function exitWarp() {
    // Deep Space Flight never rests: each shift chains straight into the
    // next swirl — no recovery window, no pickup needed.
    if (deepSpace) {
      pickWarpVariant();
      warpT = 1.0;
      return;
    }
    warpTilt = 0;
    warpMirror = true;
    shieldFreeze = 0.7;
    shieldSlow = 3;
    recoveryMsg = 'ORIENTATION RESTORED';
    spark(W * SQUIRREL_X, squirrel.y, 'warp');
  }

  function bounceOff(px, py) {
    // destabilize — recoverable, not instant death
    const sx = W * SQUIRREL_X;
    const sy = squirrel.y;
    let dx = sx - px, dy = sy - py;
    const dist = Math.hypot(dx, dy) || 1;
    dx /= dist; dy /= dist;
    // Knockback scales with how hard the squirrel actually hit: a slow graze
    // gets a nudge, a full-speed dive gets a real bounce. A fixed impulse
    // here made every touch launch the squirrel across the screen.
    const impact = Math.abs(squirrel.vy);
    // Void Jelly: bounces land much softer
    const jelly = save.equippedPal === 'voidjelly' ? 0.55 : 1;
    const mag = Math.min(560, 170 + impact * 0.5) * jelly;
    squirrel.vy = dy * mag + (dy >= 0 ? 90 : -160);
    bounceUp = squirrel.vy < 0;   // an upward launch can be swipe-cancelled
    squirrel.y += dy * 14;
    squirrel.rot = dy >= 0 ? 0.85 : -0.55;
    hitCooldown = 0.55;
    spark(sx, sy, 'poof');
  }

  function die() {
    mode = 'dead';
    deadTimer = 0;
    tut = null;   // the send-off can't outlive the run
    // bank the run's XP now so the dead screen can pour it into the meter
    lastXpFrom = save.xp || 0;
    lastLevelFrom = levelForXp(lastXpFrom);
    let xp = score + runAcorns;
    if (score >= 25) xp += 10;
    if (score >= 50) xp += 15;
    if (score >= 75) xp += 20;
    if (score >= 100) xp += 25;
    xp = Math.round(xp * (lostSpace ? 1.5 : deepSpace ? 1.25 : 1));
    lastRunXp = xp;
    save.xp = lastXpFrom + xp;
    lastLevelTo = levelForXp(save.xp);
    spark(W * SQUIRREL_X, squirrel.y, 'poof');
  }

  // The y of the nearest upcoming gap — respawning there puts the squirrel
  // ON the flight line instead of inside a sealed debris corridor, which is
  // what used to chain-drain shield charges during recovery.
  function safeRespawnY() {
    const sx = W * SQUIRREL_X;
    let best = null;
    for (const p of planets) {
      if (p.x + p.r < sx - 20) continue;   // already behind the squirrel
      if (!best || p.x < best.x) best = p;
    }
    return best ? best.gapY : H * 0.45;
  }

  // A carried shield absorbs one debris hit: burst at the impact point,
  // vaporise nearby debris, snap the squirrel onto the upcoming flight
  // line, freeze briefly, then give a slow-motion recovery window with a
  // short debris grace.
  function absorbShield(bx, by) {
    shieldCharges -= 1;
    const sx = W * SQUIRREL_X;
    const cy = safeRespawnY();
    spark(bx, by, 'shield');
    spark(bx, by, 'poof');
    for (const p of planets) {
      p.blockers = (p.blockers || []).filter(b => {
        const ax = p.x + (b.xOff || 0);
        return Math.hypot(ax - bx, b.y - by) > 110 &&
               Math.hypot(ax - sx, b.y - cy) > 150;
      });
    }
    squirrel.y = cy;
    squirrel.vy = 0;
    squirrel.rot = 0;
    hitCooldown = 0;
    bounceUp = false;
    shieldFreeze = 0.7;
    shieldSlow = 3;
    absorbGrace = 2.2;   // freeze (0.7) + 1.5s of protected recovery
    recoveryMsg = 'SHIELD ABSORBED!';
    spark(sx, cy, 'shield');
  }

  // Tutorial mercy: a debris hit is a free reset — the full shield
  // theatre without spending anything. Vaporise the offenders, park the
  // pilot back on the flight line, breathe, resume. Unlimited, but only
  // while learning.
  function tutReset(bx, by) {
    const sx = W * SQUIRREL_X;
    const cy = safeRespawnY();
    spark(bx, by, 'shield');
    spark(bx, by, 'poof');
    for (const p of planets) {
      p.blockers = (p.blockers || []).filter(b => {
        const ax = p.x + (b.xOff || 0);
        return Math.hypot(ax - bx, b.y - by) > 110 &&
               Math.hypot(ax - sx, b.y - cy) > 150;
      });
    }
    squirrel.y = cy;
    squirrel.vy = 0;
    squirrel.rot = 0;
    hitCooldown = 0;
    bounceUp = false;
    shieldFreeze = 0.45;
    shieldSlow = 2.6;
    absorbGrace = 1.8;
    recoveryMsg = 'PROTECTED — TRY AGAIN!';
    spark(sx, cy, 'shield');
  }

  function spark(x, y, kind) {
    const n = kind === 'poof' ? 18 : kind === 'shield' || kind === 'warp' ? 16 : 10;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0.35 + Math.random() * 0.3,
        max: 0.6,
        r: 2 + Math.random() * 3,
        kind: kind === 'cyan' ? 'cyan' : kind === 'gold' ? 'gold'
            : kind === 'shield' ? 'shield' : kind === 'warp' ? 'warp' : 'poof',
      });
    }
  }

  // —— draw ——
  function envMix(key, idx) {
    const a = ENVS[envA][key], b = ENVS[envB][key];
    return a[idx] + (b[idx] - a[idx]) * envBlend;
  }
  function envRgb(key) {
    return 'rgb(' + (envMix(key, 0) | 0) + ',' + (envMix(key, 1) | 0) + ',' + (envMix(key, 2) | 0) + ')';
  }
  function envRgba(key) {
    return 'rgba(' + (envMix(key, 0) | 0) + ',' + (envMix(key, 1) | 0) + ',' +
           (envMix(key, 2) | 0) + ',' + envMix(key, 3).toFixed(3) + ')';
  }
  // Optional scalar effects (pulse/dim) blend across the crossfade; a
  // theme without the field simply contributes zero.
  function envScalar(key) {
    const a = ENVS[envA][key] || 0, b = ENVS[envB][key] || 0;
    return a + (b - a) * envBlend;
  }
  // Light shafts sweep down from a high sun; each crossfading theme with
  // rays draws its own set at its own weight.
  function drawRays(env, weight) {
    if (!env.rays || weight <= 0.01) return;
    const t = performance.now() / 1000;
    const [r, gc, b] = env.rays;
    ctx.save();
    const sx = W * 0.82, sy = -H * 0.06;
    for (let i = 0; i < 5; i++) {
      const ang = 1.55 + i * 0.22 + Math.sin(t * 0.13 + i * 1.7) * 0.05;
      const halfW = 0.045 + (i % 2) * 0.02;
      const len = H * 1.25;
      ctx.fillStyle = 'rgba(' + r + ',' + gc + ',' + b + ',' +
                      (weight * (0.05 + 0.02 * Math.sin(t * 0.4 + i))).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ang - halfW) * len, sy + Math.sin(ang - halfW) * len);
      ctx.lineTo(sx + Math.cos(ang + halfW) * len, sy + Math.sin(ang + halfW) * len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    // space bg, tinted by the current environment
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, envRgb('top'));
    g.addColorStop(1, envRgb('bot'));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // nebula washes — a theme with pulse makes them THROB (glowing lights)
    const throb = envScalar('pulse');
    if (throb > 0) {
      ctx.globalAlpha = Math.max(0.25,
        1 + Math.sin(performance.now() / 1000 * 2.1) * 0.55 * throb);
    }
    ctx.fillStyle = envRgba('wash');
    ctx.beginPath();
    ctx.ellipse(W * 0.7, H * 0.3, W * 0.5, H * 0.25, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = envRgba('wash2');
    ctx.beginPath();
    ctx.ellipse(W * 0.24, H * 0.68, W * 0.42, H * 0.2, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // sun rays, per crossfading theme
    drawRays(ENVS[envA], (1 - envBlend));
    drawRays(ENVS[envB], envBlend);

    // dimming lights: a dark vignette that slowly BREATHES
    const dim = envScalar('dim');
    if (dim > 0.01) {
      const breathe = dim * (0.55 + 0.45 * Math.sin(performance.now() / 1000 * 0.7));
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,' + (breathe * 0.55).toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    for (const s of stars) {
      const pulse = 0.55 + 0.45 * Math.sin(s.tw);
      ctx.globalAlpha = s.a * pulse;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.bright) {
        ctx.globalAlpha = s.a * pulse * 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 2.5, s.y);
        ctx.lineTo(s.x + s.r * 2.5, s.y);
        ctx.moveTo(s.x, s.y - s.r * 2.5);
        ctx.lineTo(s.x, s.y + s.r * 2.5);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    if (mode === 'title') drawTitle();
    else if (mode === 'help') drawHelp();
    else if (mode === 'social') drawSocial();
    else if (mode === 'flightlog') drawFlightLog();
    else if (mode === 'hangar') drawShop();
    else {
      // Warp is a pure RENDER transform: the simulation still scrolls the
      // same way, so every collision rule keeps working untouched. The
      // player sees the world mirrored (squirrel flying the other way) and
      // tilted ±25°; during the one-second swirl the scene spins and folds
      // through the mirror flip.
      const wp = warpT > 0 ? 1 - warpT : (warpLeft > 0 || lostSpace ? 1 : 0);
      if (wp > 0) {
        ctx.save();
        ctx.translate(W / 2, H / 2);
        const spin = warpT > 0 ? Math.sin(wp * Math.PI) * 2.6 : 0;
        // The swirl eases from the PREVIOUS orientation to the new one.
        // Outside Lost in Space the previous state is always upright, so
        // this reduces exactly to the original black-hole fold.
        // NOTE: no screen-edge pan here — an attempt to keep the squirrel
        // inside a screen band coupled the world's position to the
        // squirrel's height and wrecked the scroll feel. At extreme
        // tilts the squirrel may near the edge; that's the better tradeoff.
        ctx.rotate(prevTilt + (warpTilt - prevTilt) * wp + spin);
        const mFrom = prevMirror ? -1 : 1;
        const mTo = warpMirror ? -1 : 1;
        ctx.scale(mFrom + (mTo - mFrom) * wp, 1);
        ctx.translate(-W / 2, -H / 2);
        drawWorld();
        ctx.restore();
        if (warpT > 0) drawVortex(1 - warpT);
      } else {
        drawWorld();
      }
      drawHUD();
      if (tut && mode === 'play') drawTutorial();
      if (mode === 'ready') drawReady();
      if (mode === 'dead') drawDead();
    }
  }

  function drawWorld() {
    for (const p of planets) {
      drawPlanet(p.x, p.gapY - p.gap / 2 - p.r, p.r, p.topKind);
      drawPlanet(p.x, p.gapY + p.gap / 2 + p.r, p.r, p.botKind);
      for (const b of (p.blockers || [])) {
        drawObstacle(p.x + (b.xOff || 0), b.y, b);
      }
    }
    for (const a of acorns) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, false);
    }
    for (const a of powerups) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 5, true);
    }
    for (const a of shields) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, 'shield');
    }
    for (const a of goldens) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, 'golden');
    }
    for (const a of wormholes) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, 'wormhole');
    }
    for (const a of blackholes) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, 'blackhole');
    }
    for (const p of particles) drawParticle(p);
    // golden radiance around the invulnerable squirrel
    if (invulnLeft > 0 && mode === 'play') {
      const gt = performance.now() / 1000;
      const gr = 40 + Math.sin(gt * 5) * 4;
      const gg = ctx.createRadialGradient(W * SQUIRREL_X, squirrel.y, 10, W * SQUIRREL_X, squirrel.y, gr);
      gg.addColorStop(0, 'rgba(255,215,80,0.28)');
      gg.addColorStop(0.7, 'rgba(255,190,40,0.1)');
      gg.addColorStop(1, 'rgba(255,190,40,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(W * SQUIRREL_X, squirrel.y, gr, 0, Math.PI * 2);
      ctx.fill();
      if (Math.random() < 0.4) {
        particles.push({
          x: W * SQUIRREL_X + (Math.random() - 0.5) * 44,
          y: squirrel.y + (Math.random() - 0.5) * 44,
          vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 40,
          life: 0.3 + Math.random() * 0.2, max: 0.5,
          r: 1.2 + Math.random() * 1.8, kind: 'gold',
        });
      }
    }
    if (absorbGrace > 0 && mode === 'play') {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 1000 * 18);
    }
    drawSquirrel(W * SQUIRREL_X, squirrel.y, squirrel.rot);
    ctx.globalAlpha = 1;
    if (save.equippedPal !== 'none' || tutBuddy()) {
      drawPal(tutBuddy() && save.equippedPal === 'none' ? 'buddy' : save.equippedPal,
              pal.x, pal.y, 1, performance.now() / 1000);
    }
  }


  function drawObstacle(x, y, b) {
    const r = b.r;
    const type = b.type || 'asteroid';
    const seed = b.seed || 0;
    const rot = (b.rot || 0) + (b.spin || 0) * (performance.now() / 1000);
    const bEnv = ENVS[b.env || 0];

    // environment aura behind the obstacle — the region's colour signature
    if (bEnv.obAccent) {
      const ag = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 1.6);
      ag.addColorStop(0, withAlpha(bEnv.obAccent, 0.16));
      ag.addColorStop(1, withAlpha(bEnv.obAccent, 0));
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // soft contact shadow under every obstacle
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(2, r * 0.55, r * 0.7, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    if (type === 'asteroid') {
      // irregular body
      const pts = 8;
      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const jitter = 0.72 + ((seed * (i + 3)) % 9) / 22;
        const px = Math.cos(a) * r * jitter;
        const py = Math.sin(a) * r * jitter;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const grd = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.08, 0, 0, r);
      grd.addColorStop(0, '#c8b8a0');
      grd.addColorStop(0.45, '#8a7a64');
      grd.addColorStop(1, '#3a3028');
      ctx.fillStyle = grd;
      ctx.fill();
      // rim
      ctx.strokeStyle = 'rgba(255,230,200,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // craters with rims
      for (let i = 0; i < 4; i++) {
        const a = (seed * 0.7 + i * 1.7) % (Math.PI * 2);
        const d = r * (0.2 + (i % 3) * 0.15);
        const cr = r * (0.1 + (i % 3) * 0.05);
        const cx = Math.cos(a) * d, cy = Math.sin(a) * d;
        ctx.fillStyle = 'rgba(25,20,15,0.5)';
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(180,160,130,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    } else if (type === 'debris') {
      // main plate
      const grd = ctx.createLinearGradient(-r, -r, r, r);
      grd.addColorStop(0, '#9aa2aa');
      grd.addColorStop(0.5, '#5a626c');
      grd.addColorStop(1, '#2a3038');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.lineTo(r * 0.95, r * 0.15);
      ctx.lineTo(-r * 0.35, r * 0.8);
      ctx.closePath();
      ctx.fill();
      // secondary shard
      ctx.fillStyle = '#4a525c';
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, r * 0.05);
      ctx.lineTo(r * 0.25, -r * 0.3);
      ctx.lineTo(r * 0.1, r * 0.6);
      ctx.closePath();
      ctx.fill();
      // heat edge
      ctx.strokeStyle = 'rgba(255,100,30,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.stroke();
      // rivets
      ctx.fillStyle = '#c0c8d0';
      [[-0.4,-0.1],[0.2,-0.4],[0.4,0.05],[-0.15,0.4]].forEach(([dx,dy]) => {
        ctx.beginPath(); ctx.arc(dx * r, dy * r, 1.6, 0, Math.PI * 2); ctx.fill();
      });
    } else if (type === 'satellite') {
      // body
      const bg = ctx.createLinearGradient(-r * 0.4, -r * 0.5, r * 0.4, r * 0.5);
      bg.addColorStop(0, '#e8eef4');
      bg.addColorStop(1, '#687480');
      ctx.fillStyle = bg;
      ctx.fillRect(-r * 0.38, -r * 0.45, r * 0.76, r * 0.9);
      // window
      ctx.fillStyle = 'rgba(80,180,255,0.55)';
      ctx.fillRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      // solar panels
      const panel = (x0) => {
        const pg = ctx.createLinearGradient(x0, 0, x0 + r * 0.55, 0);
        pg.addColorStop(0, '#1a4a7a');
        pg.addColorStop(0.5, '#3a8ad0');
        pg.addColorStop(1, '#1a4a7a');
        ctx.fillStyle = pg;
        ctx.fillRect(x0, -r * 0.3, r * 0.55, r * 0.6);
        ctx.strokeStyle = 'rgba(120,200,255,0.45)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          const py = -r * 0.3 + i * r * 0.15;
          ctx.beginPath(); ctx.moveTo(x0 + 2, py); ctx.lineTo(x0 + r * 0.53, py); ctx.stroke();
        }
        for (let i = 1; i < 3; i++) {
          const px = x0 + i * r * 0.18;
          ctx.beginPath(); ctx.moveTo(px, -r * 0.28); ctx.lineTo(px, r * 0.28); ctx.stroke();
        }
      };
      panel(-r * 1.1);
      panel(r * 0.55);
      // dish / antenna
      ctx.strokeStyle = '#d0d8e0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r * 0.45); ctx.lineTo(0, -r * 0.95); ctx.stroke();
      ctx.fillStyle = '#ff5050';
      ctx.beginPath(); ctx.arc(0, -r * 1.0, r * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -r * 0.7, r * 0.22, -2.2, -0.6); ctx.stroke();
    } else if (type === 'ufo') {
      // hull
      const hull = ctx.createRadialGradient(0, -r * 0.15, r * 0.1, 0, 0, r * 1.1);
      hull.addColorStop(0, '#f0f4f8');
      hull.addColorStop(0.4, '#90a0b8');
      hull.addColorStop(1, '#303848');
      ctx.fillStyle = hull;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.15, r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      // rim ring
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.05, r * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      // dome
      const dome = ctx.createRadialGradient(-r * 0.1, -r * 0.35, r * 0.05, 0, -r * 0.15, r * 0.5);
      dome.addColorStop(0, 'rgba(180,240,255,0.85)');
      dome.addColorStop(0.6, 'rgba(60,160,220,0.55)');
      dome.addColorStop(1, 'rgba(20,60,100,0.35)');
      ctx.fillStyle = dome;
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.18, r * 0.5, r * 0.4, 0, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // underglow lights
      for (let i = 0; i < 6; i++) {
        const a = -1.0 + i * 0.4;
        ctx.fillStyle = i % 2 ? '#ffd040' : '#40f0ff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.22 + r * 0.05, r * 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    } else if (type === 'crystal') {
      // outer crystal, cut in the environment's colours
      const cc = bEnv.crystal || ['rgba(220,180,255,0.95)', 'rgba(140,70,230,0.9)', 'rgba(60,20,120,0.85)'];
      const cg = ctx.createLinearGradient(0, -r, 0, r);
      cg.addColorStop(0, cc[0]);
      cg.addColorStop(0.45, cc[1]);
      cg.addColorStop(1, cc[2]);
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.lineTo(r * 0.35, r * 0.9);
      ctx.lineTo(-r * 0.4, r * 0.75);
      ctx.lineTo(-r * 0.65, -r * 0.15);
      ctx.closePath();
      ctx.fill();
      // inner highlight facet
      ctx.fillStyle = 'rgba(255,240,255,0.45)';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.75);
      ctx.lineTo(r * 0.28, -r * 0.05);
      ctx.lineTo(0, r * 0.35);
      ctx.lineTo(-r * 0.28, -r * 0.05);
      ctx.closePath();
      ctx.fill();
      // edge shine
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-r * 0.2, -r * 0.55);
      ctx.lineTo(r * 0.15, r * 0.25);
      ctx.stroke();
      // glow
      ctx.strokeStyle = 'rgba(180,100,255,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.stroke();
    } else if (type === 'rock') {
      const rg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      rg.addColorStop(0, '#9a9080');
      rg.addColorStop(0.5, '#5a5048');
      rg.addColorStop(1, '#2a2420');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.98, r * 0.82, 0.35, 0, Math.PI * 2);
      ctx.fill();
      // lumps
      ctx.fillStyle = '#7a7060';
      ctx.beginPath();
      ctx.ellipse(-r * 0.25, -r * 0.28, r * 0.4, r * 0.32, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(20,16,12,0.45)';
      ctx.beginPath(); ctx.arc(r * 0.3, r * 0.2, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.35, r * 0.28, r * 0.14, 0, Math.PI * 2); ctx.fill();
      // highlight
      ctx.strokeStyle = 'rgba(220,200,170,0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(-r * 0.15, -r * 0.35, r * 0.35, r * 0.2, -0.4, 0, Math.PI * 2);
      ctx.stroke();
    } else { // junk
      // barrel body
      const jg = ctx.createLinearGradient(-r * 0.7, 0, r * 0.7, 0);
      jg.addColorStop(0, '#5a3a20');
      jg.addColorStop(0.4, '#c08040');
      jg.addColorStop(1, '#4a3018');
      ctx.fillStyle = jg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.72, r * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();
      // bands
      ctx.strokeStyle = '#e0a860';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      // rust spots
      ctx.fillStyle = 'rgba(80,40,10,0.4)';
      ctx.beginPath(); ctx.arc(-r * 0.25, r * 0.1, r * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
      // metal strut
      ctx.strokeStyle = '#b0b8c0';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(r * 0.45, -r * 0.7);
      ctx.lineTo(r * 1.15, r * 0.35);
      ctx.stroke();
      // joint ball
      const bg2 = ctx.createRadialGradient(r * 1.1, r * 0.3, 1, r * 1.15, r * 0.35, r * 0.2);
      bg2.addColorStop(0, '#e0e8f0');
      bg2.addColorStop(1, '#505860');
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.arc(r * 1.15, r * 0.35, r * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawPlanet(x, y, r, kind) {
    const palettes = [
      // 0 ocean earth
      ['#2a6aa8', '#1a4068', '#6eb8e8', '#3a9a5a', '#1a5a38'],
      // 1 golden ringed
      ['#d4a84a', '#a07828', '#f0d88a', '#c9a04a', '#8a6020'],
      // 2 icy moon
      ['#b0c0d0', '#788898', '#e8f0f8', '#a0b0c0', '#606878'],
      // 3 lava / mars
      ['#c04020', '#701808', '#e87040', '#a03018', '#ff9040'],
      // 4 teal gas
      ['#1a9080', '#0c5848', '#5ad0b8', '#2a8070', '#0a4038'],
      // 5 rock grey
      ['#6a6e78', '#3c4048', '#a0a4ac', '#5a5e66', '#2a2c30'],
      // 6 desert
      ['#b07030', '#704018', '#e0a060', '#986028', '#503010'],
      // 7 deep blue gas
      ['#142850', '#081830', '#3a68a0', '#1e4070', '#0a1830'],
      // 8 pink alien
      ['#c06078', '#782840', '#e8a0b0', '#a04858', '#501828'],
      // 9 jungle canopy
      ['#3f8f3a', '#245c1e', '#8ed17a', '#5cae4e', '#173d12'],
      // 10 amethyst crystal
      ['#8f6fd0', '#5a3f96', '#cbb2ff', '#a98fe8', '#3a2668'],
      // 11 night city
      ['#2e3a52', '#18202e', '#5a739c', '#3d4f70', '#0e131c'],
      // 12 watcher (eyeball)
      ['#d8cfc0', '#a89a88', '#f4efe4', '#c7bcab', '#6e6353'],
      // 13 candy stripe
      ['#e86a8a', '#b03a58', '#ffb6c8', '#f090a8', '#7c2340'],
      // 14 shattered core
      ['#7a6a5a', '#4a3e32', '#b0a08c', '#93816d', '#2c241c'],
      // 15 aurora ice giant
      ['#3a7fa8', '#1e4e70', '#8fd4f0', '#5aa8cc', '#12324a'],
    ];
    const [c1, c2, c3, c4, c5] = palettes[kind % palettes.length];

    // soft outer atmosphere glow
    const atmo = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.25);
    atmo.addColorStop(0, 'rgba(0,0,0,0)');
    atmo.addColorStop(0.7, 'rgba(160,200,255,0.04)');
    atmo.addColorStop(1, 'rgba(160,200,255,0)');
    ctx.fillStyle = atmo;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // base sphere with richer lighting
    const grd = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.04, x + r * 0.15, y + r * 0.2, r * 1.05);
    grd.addColorStop(0, c3);
    grd.addColorStop(0.35, c1);
    grd.addColorStop(0.75, c2);
    grd.addColorStop(1, c5 || c2);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // surface detail (clipped)
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();

    if (kind === 0) { // earth continents + clouds
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.65;
      [[-0.2,-0.15,0.5,0.32,-0.5],[0.28,0.18,0.35,0.22,0.4],[-0.05,0.35,0.28,0.18,0.1]].forEach(([dx,dy,rx,ry,rot]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, rot, 0, Math.PI*2);
        ctx.fill();
      });
      // cloud wisps
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.22;
      [[0.1,-0.3,0.3,0.1],[ -0.3,0.1,0.25,0.08],[0.25,0.3,0.2,0.07]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, 0, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 1 || kind === 7) { // gas bands
      for (let i = -3; i <= 3; i++) {
        ctx.strokeStyle = i % 2 === 0 ? c4 : c5;
        ctx.globalAlpha = 0.28 + (i % 2) * 0.1;
        ctx.lineWidth = r * (0.1 + Math.abs(i) * 0.02);
        ctx.beginPath();
        ctx.ellipse(x, y + i * r * 0.18, r * 0.96, r * 0.16, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      // storm oval
      ctx.fillStyle = c3;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.ellipse(x + r * 0.25, y + r * 0.1, r * 0.22, r * 0.14, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (kind === 2 || kind === 5) { // craters + maria
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.35;
      [[-0.3,-0.25,0.22],[0.25,0.1,0.18],[-0.05,0.35,0.15],[0.35,-0.3,0.12],[-0.35,0.15,0.1],[0.1,-0.05,0.08]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
        // rim highlight
        ctx.strokeStyle = c3;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = c5;
      });
      ctx.globalAlpha = 1;
    } else if (kind === 3) { // lava + cracks
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.55;
      [[-0.15,-0.2,0.2],[0.2,0.15,0.18],[-0.25,0.25,0.12]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = '#ff9040';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2.2;
      [[-0.45,-0.2,0.1,0.15,0.4,-0.1],[-0.2,0.3,0.15,0.05,0.45,0.2],[0.1,-0.35,0.0,-0.1,0.3,0.05]].forEach(([x1,y1,cx,cy,x2,y2]) => {
        ctx.beginPath();
        ctx.moveTo(x + x1 * r, y + y1 * r);
        ctx.quadraticCurveTo(x + cx * r, y + cy * r, x + x2 * r, y + y2 * r);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 4 || kind === 8) { // soft spots + haze
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.3;
      [[0.15,-0.2,0.4,0.28],[ -0.25,0.15,0.3,0.22]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x + dx * r, y + dy * r, r * rx, r * ry, 0.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 6) { // desert dunes
      ctx.strokeStyle = c5;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x - r * 0.8, y + i * r * 0.22);
        ctx.quadraticCurveTo(x, y + i * r * 0.22 - r * 0.08, x + r * 0.8, y + i * r * 0.22);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (kind === 9) { // jungle canopy: vine spirals + mist banks
      ctx.strokeStyle = c5;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1.8;
      [[-0.25,-0.15],[0.2,0.1],[-0.05,0.32]].forEach(([dx,dy], k) => {
        ctx.beginPath();
        for (let i = 0; i <= 14; i++) {
          const th = i * 0.5 + k * 2;
          const rr = r * 0.05 + i * r * 0.018;
          const px = x + dx * r + Math.cos(th) * rr;
          const py = y + dy * r + Math.sin(th) * rr * 0.75;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      });
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.14;
      [[0.05,-0.35,0.4,0.09],[-0.3,0.05,0.3,0.08]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, 0.1, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 10) { // amethyst: geodesic facets with a glint
      ctx.globalAlpha = 0.4;
      [[-0.4,-0.3,0.15,-0.55,0.3,-0.2,c3],[-0.1,0.05,0.4,-0.15,0.35,0.35,c5],
       [-0.55,0.2,-0.15,0.1,-0.25,0.5,c4],[0.15,-0.6,0.5,-0.45,0.45,-0.1,c5]].forEach(([x1,y1,x2,y2,x3,y3,cc]) => {
        ctx.fillStyle = cc;
        ctx.beginPath();
        ctx.moveTo(x + x1*r, y + y1*r);
        ctx.lineTo(x + x2*r, y + y2*r);
        ctx.lineTo(x + x3*r, y + y3*r);
        ctx.closePath();
        ctx.fill();
      });
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.5, y - r * 0.42);
      ctx.lineTo(x + r * 0.15, y - r * 0.1);
      ctx.lineTo(x - r * 0.1, y + r * 0.45);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (kind === 11) { // night city: light grids on the dark side
      ctx.fillStyle = '#ffd76a';
      ctx.globalAlpha = 0.75;
      for (let gx = -4; gx <= 4; gx++) {
        for (let gy = -4; gy <= 4; gy++) {
          const px = gx * r * 0.16 + ((gy % 2) * r * 0.05);
          const py = gy * r * 0.15;
          if (px * px + py * py > r * r * 0.72) continue;
          if ((gx * 7 + gy * 13 + 5) % 4 === 0) continue; // dark blocks
          ctx.fillRect(x + px, y + py, Math.max(1, r * 0.035), Math.max(1, r * 0.028));
        }
      }
      // a glowing river of light
      ctx.strokeStyle = '#ffb84d';
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.7, y + r * 0.25);
      ctx.quadraticCurveTo(x - r * 0.1, y - r * 0.15, x + r * 0.65, y + r * 0.1);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (kind === 12) { // the watcher: a great planetary eye
      ctx.fillStyle = '#3aa8a0';
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.52, r * 0.52, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a6a64';
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.4, r * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0a0e12';
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.2, r * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(x - r * 0.08, y - r * 0.14, r * 0.07, 0, Math.PI * 2);
      ctx.fill();
      // bloodshot veins reaching in from the limb
      ctx.strokeStyle = '#b05a4a';
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 1;
      [[-0.85,-0.25,-0.6,-0.1],[-0.8,0.35,-0.58,0.18],[0.82,-0.3,0.58,-0.14],[0.85,0.28,0.6,0.15]].forEach(([x1,y1,x2,y2]) => {
        ctx.beginPath();
        ctx.moveTo(x + x1*r, y + y1*r);
        ctx.quadraticCurveTo(x + (x1+x2)/2*r, y + y1*r*0.6, x + x2*r, y + y2*r);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 13) { // candy stripes, rolled at an angle
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.5);
      for (let i = -3; i <= 3; i++) {
        ctx.fillStyle = i % 2 === 0 ? c3 : c5;
        ctx.globalAlpha = i % 2 === 0 ? 0.4 : 0.3;
        ctx.fillRect(-r, i * r * 0.28 - r * 0.11, r * 2, r * 0.22);
      }
      ctx.restore();
      // sugar glints
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.5;
      [[-0.3,-0.2],[0.25,0.05],[-0.05,0.38]].forEach(([dx,dy]) => {
        ctx.beginPath();
        ctx.arc(x + dx*r, y + dy*r, r * 0.035, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 14) { // shattered core: fissures glowing from inside
      ctx.strokeStyle = '#ff7a30';
      ctx.globalAlpha = 0.75;
      ctx.lineWidth = 2;
      [[-0.7,-0.3,-0.2,-0.1,0.15,-0.45],[-0.2,-0.1,0.1,0.25,0.6,0.1],
       [-0.2,-0.1,-0.35,0.4],[0.1,0.25,-0.05,0.65]].forEach((seg) => {
        ctx.beginPath();
        ctx.moveTo(x + seg[0]*r, y + seg[1]*r);
        for (let i = 2; i < seg.length; i += 2) ctx.lineTo(x + seg[i]*r, y + seg[i+1]*r);
        ctx.stroke();
      });
      ctx.strokeStyle = '#ffd76a';
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.7, y - r * 0.3);
      ctx.lineTo(x - r * 0.2, y - r * 0.1);
      ctx.lineTo(x + r * 0.6, y + r * 0.1);
      ctx.stroke();
      // dark shadow plates between the cracks
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.35;
      [[0.3,-0.35,0.25],[-0.4,0.25,0.2]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx*r, y + dy*r, r*s, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 15) { // aurora ice giant: polar light curtains
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = i === 1 ? '#c58aff' : '#5dffc8';
        ctx.globalAlpha = 0.4 - i * 0.08;
        ctx.lineWidth = r * (0.07 - i * 0.015);
        ctx.beginPath();
        ctx.ellipse(x, y - r * 0.55, r * (0.55 + i * 0.14), r * (0.16 + i * 0.05), 0.06, Math.PI * 1.05, Math.PI * 1.95);
        ctx.stroke();
      }
      // frost bands
      ctx.strokeStyle = c3;
      ctx.globalAlpha = 0.25;
      ctx.lineWidth = r * 0.1;
      for (let i = 0; i <= 2; i++) {
        ctx.beginPath();
        ctx.ellipse(x, y + (i + 0.5) * r * 0.25, r * 0.94, r * 0.15, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // terminator / night side soft shadow
    const night = ctx.createLinearGradient(x - r, y, x + r, y);
    night.addColorStop(0, 'rgba(0,0,0,0)');
    night.addColorStop(0.55, 'rgba(0,0,0,0)');
    night.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = night;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // rings (drawn outside clip)
    if (kind === 1) {
      ctx.strokeStyle = 'rgba(212,175,55,0.8)';
      ctx.lineWidth = Math.max(2.5, r * 0.08);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.45, r * 0.28, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(212,175,55,0.35)';
      ctx.lineWidth = Math.max(1.2, r * 0.04);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.62, r * 0.32, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      // ring shadow on planet
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.clip();
